<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#05010f">
<title>FLASHY BIRD — zone map prototype v0.3</title>
<style>
  html,body{margin:0;padding:0;background:#05010f;overflow:hidden;height:100%;touch-action:none;-webkit-user-select:none;user-select:none;overscroll-behavior:none}
  canvas{display:block;position:fixed;inset:0;cursor:grab;touch-action:none}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
'use strict';
/* ========== FLASHY BIRD — ZONE MAP PROTOTYPE v0.3 ==========
   One zone per screen. The tunnel is a seeded right-angled maze of
   tightly-packed rainbow rings pulsing along their length. Everything
   roams. Standalone file — the game is untouched.
   =========================================================== */
const TAU=Math.PI*2;

/* ---------------- DESIGN GUIDELINES (the theme-pack contract) ----------------
   Fixed by the framework: the maze grid (orthogonal runs, rounded corners,
   center ports top & bottom), one-screen zone height, TUBE spec, BLEND band,
   node metrics, life budgets. A theme pack contributes ONLY palettes
   (>=2, dark bg), motif(), nodeBody(), critters(4), drifter().
   HARD RULES: everything idle-animates, and each theme needs at least two
   ROAMING inhabitants (things that travel, not just wiggle). */
const G = {
  UNIT_W:390, ZONE_H:720, PORT_X:0.5,
  MAZE:{ rows:7, xMin:64, xMax:316, minRun:84, corner:22, topLane:52 },
  TUBE:{ ringGap:14, rx:14, ry:5.5, beamW:34, pulseNear:90 },
  BLEND:120,
  NODE:{ r:20, ringW:2.6, starR:4.6 },
  SKIP:{ r:17, lane:352 },
  MOTIF:{ perZone:9, margin:16, clearance:56, sizeMin:16, sizeMax:52 },
  LIFE:{ drifters:8, sparks:30, critters:4 },
  TEXT:{ zone:15, node:11, hint:11 },
};

/* ---------------- tiny utils ---------------- */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let x=Math.imul(a^a>>>15,1|a);x=x+Math.imul(x^x>>>7,61|x)^x;return((x^x>>>14)>>>0)/4294967296}}
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,f)=>a+(b-a)*f;
function blink(t,seed){ const p=(t+seed*13.7)%(2.8+(seed%1)*2.6); return p<0.14?1:0; }
function hexA(hex,a){ const n=parseInt(hex.slice(1),16);
  return 'rgba('+(n>>16)+','+((n>>8)&255)+','+(n&255)+','+a+')'; }

/* ---------------- THEME PACKS ---------------- */
const THEMES={
sky:{
  name:'CALM SKY OF A BIRD PLANET',
  palettes:[
    { hue:205, bg:['#0a2c55','#123f74'], node:'#9fdcff', nodeDone:'#ffd977',
      lock:'#41648c', accent:'#ffd977', text:'#eaf6ff', veil:'#061426' },
    { hue:24,  bg:['#331036','#6e2c2c'], node:'#ffcf9f', nodeDone:'#ffd977',
      lock:'#6b4550', accent:'#ff8fb0', text:'#ffeede', veil:'#1c0a1c' },
  ],
  motif(ctx,m,t,P){
    const s=m.s;
    if(m.v<0.62){ // sleepy cloud
      ctx.fillStyle='rgba(255,255,255,0.15)';
      ctx.beginPath();
      ctx.arc(-s*0.42,0,s*0.30,0,TAU); ctx.arc(0,-s*0.16,s*0.40,0,TAU);
      ctx.arc(s*0.4,0,s*0.28,0,TAU); ctx.arc(0,s*0.12,s*0.34,0,TAU); ctx.fill();
      const bl=blink(t,m.v);
      ctx.strokeStyle='rgba(255,255,255,0.55)'; ctx.lineWidth=2; ctx.lineCap='round';
      for(const e of [-1,1]){
        ctx.beginPath();
        if(bl||m.v<0.2){ ctx.moveTo(e*s*0.13-s*0.05,-s*0.05); ctx.lineTo(e*s*0.13+s*0.05,-s*0.05); }
        else ctx.arc(e*s*0.13,-s*0.07,s*0.05,0.2,Math.PI-0.2);
        ctx.stroke();
      }
      ctx.beginPath(); ctx.arc(0,s*0.07,s*0.06,0.3,Math.PI-0.3); ctx.stroke();
    } else { // smiling sun
      ctx.save(); ctx.rotate(t*0.15);
      ctx.fillStyle=P.accent; ctx.globalAlpha=0.9;
      ctx.beginPath(); ctx.arc(0,0,s*0.26,0,TAU); ctx.fill();
      ctx.strokeStyle=P.accent; ctx.lineWidth=2.4; ctx.lineCap='round';
      for(let i=0;i<9;i++){ const a=i/9*TAU, w=1+Math.sin(t*3+i)*0.18;
        ctx.beginPath(); ctx.moveTo(Math.cos(a)*s*0.35,Math.sin(a)*s*0.35);
        ctx.lineTo(Math.cos(a)*s*0.48*w,Math.sin(a)*s*0.48*w); ctx.stroke(); }
      ctx.restore(); ctx.globalAlpha=1;
      ctx.fillStyle='#5b3b10';
      for(const e of [-1,1]){ ctx.beginPath(); ctx.arc(e*s*0.09,-s*0.05,s*0.032,0,TAU); ctx.fill(); }
      ctx.strokeStyle='#5b3b10'; ctx.lineWidth=2;
      ctx.beginPath(); ctx.arc(0,s*0.03,s*0.08,0.3,Math.PI-0.3); ctx.stroke();
    }
  },
  nodeBody(ctx,r,t,P,st){
    ctx.fillStyle=st.done?'rgba(255,217,119,0.25)':'rgba(255,255,255,0.18)';
    for(let i=0;i<7;i++){ const a=i/7*TAU+t*0.3;
      ctx.beginPath(); ctx.arc(Math.cos(a)*r*0.6,Math.sin(a)*r*0.6,r*0.46+Math.sin(t*2+i)*1.2,0,TAU); ctx.fill(); }
  },
  critter(ctx,i,t,P,zH){
    if(i<3){ // commuting birds
      const sp=30+i*10, y0=120+i*(zH-260)/2;
      const x=((t*sp+i*160)%(G.UNIT_W+120))-60;
      const y=y0+Math.sin(t*1.4+i*2)*18, f=Math.sin(t*9+i)*0.5;
      ctx.save(); ctx.translate(x,y); if(i%2)ctx.scale(-1,1);
      ctx.fillStyle=P.text; ctx.globalAlpha=0.85;
      ctx.beginPath(); ctx.ellipse(0,0,6.5,4,0,0,TAU); ctx.fill();
      ctx.beginPath(); ctx.arc(5.5,-2,2.8,0,TAU); ctx.fill();
      ctx.fillStyle=P.accent;
      ctx.beginPath(); ctx.moveTo(8,-2.4); ctx.lineTo(11,-1.4); ctx.lineTo(8,-0.5); ctx.fill();
      ctx.fillStyle=P.text;
      ctx.beginPath(); ctx.ellipse(-1,-2.8,5.5,2.4,-0.7-f,0,TAU); ctx.fill();
      ctx.restore(); ctx.globalAlpha=1;
    } else { // drifting hot-air balloon with a nest basket
      const x=((t*9+140)%(G.UNIT_W+160))-80, y=150+Math.sin(t*0.7)*26;
      ctx.save(); ctx.translate(x,y);
      ctx.fillStyle=P.accent; ctx.globalAlpha=0.8;
      ctx.beginPath(); ctx.arc(0,0,13,Math.PI*0.95,Math.PI*2.05); ctx.quadraticCurveTo(9,9,0,11);
      ctx.quadraticCurveTo(-9,9,-12.6,1); ctx.fill();
      ctx.strokeStyle=P.accent;
      ctx.beginPath(); ctx.moveTo(-5,10); ctx.lineTo(-4,17); ctx.moveTo(5,10); ctx.lineTo(4,17); ctx.stroke();
      ctx.strokeStyle='hsl(35,90%,65%)'; ctx.lineWidth=2; ctx.lineCap='round';
      ctx.beginPath(); ctx.arc(0,17,5,0.3,Math.PI-0.3); ctx.stroke();
      ctx.restore(); ctx.globalAlpha=1;
    }
  },
  drifter(ctx,d,t,P){
    ctx.save(); ctx.rotate(Math.sin(t*1.1+d.ph)*0.7);
    ctx.strokeStyle='rgba(255,255,255,0.5)'; ctx.lineWidth=1.5; ctx.lineCap='round';
    ctx.beginPath(); ctx.moveTo(-d.s*0.4,0); ctx.quadraticCurveTo(0,-d.s*0.45,d.s*0.4,0); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(-d.s*0.28,0); ctx.lineTo(d.s*0.32,-d.s*0.08); ctx.stroke();
    ctx.restore();
  },
},
jungle:{
  name:'PSYCHEDELIC JUNGLE',
  palettes:[
    { hue:118, bg:['#03170c','#0d3b18'], node:'#c0ff6e', nodeDone:'#ffd977',
      lock:'#2f5c3a', accent:'#ff5fd0', text:'#eaffe0', veil:'#031208' },
    { hue:300, bg:['#20052e','#45104e'], node:'#ff9ff5', nodeDone:'#7dff6e',
      lock:'#5b3a68', accent:'#7dffc9', text:'#ffe8ff', veil:'#150320' },
  ],
  motif(ctx,m,t,P){
    const s=m.s;
    if(m.v<0.4){ // breathing leaf
      ctx.save(); ctx.rotate(m.v*16+Math.sin(t*1.2+m.v*9)*0.16);
      const grow=1+Math.sin(t*1.6+m.v*5)*0.06; ctx.scale(grow,grow);
      const lg=ctx.createLinearGradient(0,0,0,-s);
      lg.addColorStop(0,'rgba(70,220,110,0.34)'); lg.addColorStop(1,'rgba(255,95,208,0.30)');
      ctx.fillStyle=lg;
      ctx.beginPath(); ctx.moveTo(0,0);
      ctx.quadraticCurveTo(s*0.6,-s*0.5,0,-s);
      ctx.quadraticCurveTo(-s*0.6,-s*0.5,0,0); ctx.fill();
      ctx.strokeStyle='rgba(160,255,160,0.55)'; ctx.lineWidth=1.6;
      ctx.beginPath(); ctx.moveTo(0,0); ctx.quadraticCurveTo(s*0.06,-s*0.5,0,-s); ctx.stroke();
      ctx.restore();
    } else if(m.v<0.7){ // hypno-swirl
      ctx.save(); ctx.rotate(t*(m.v>0.55?0.55:-0.45));
      ctx.lineWidth=2.2; ctx.lineCap='round';
      for(let arm=0;arm<2;arm++){
        ctx.strokeStyle=arm?P.accent:'rgba(125,255,110,0.8)'; ctx.globalAlpha=0.6;
        ctx.beginPath();
        for(let i=0;i<=24;i++){ const a=i/24*4.2+arm*Math.PI, r=s*0.07+i/24*s*0.42;
          const x=Math.cos(a)*r, y=Math.sin(a)*r; i?ctx.lineTo(x,y):ctx.moveTo(x,y); }
        ctx.stroke();
      }
      ctx.restore(); ctx.globalAlpha=1;
    } else { // blinking eye-flower
      ctx.save(); ctx.rotate(Math.sin(t*0.8+m.v*11)*0.12);
      for(let i=0;i<7;i++){ const a=i/7*TAU+t*0.4;
        ctx.fillStyle=i%2?P.accent:'rgba(125,255,110,0.9)'; ctx.globalAlpha=0.8;
        ctx.beginPath(); ctx.ellipse(Math.cos(a)*s*0.26,Math.sin(a)*s*0.26,s*0.22,s*0.1,a,0,TAU); ctx.fill(); }
      ctx.globalAlpha=1;
      const bl=blink(t,m.v);
      ctx.fillStyle='#fff'; ctx.beginPath();
      ctx.ellipse(0,0,s*0.15,s*0.15*(1-bl*0.92),0,0,TAU); ctx.fill();
      if(!bl){ ctx.fillStyle='#12220f'; ctx.beginPath();
        ctx.arc(Math.sin(t*0.9+m.v)*s*0.05,0,s*0.07,0,TAU); ctx.fill(); }
      ctx.restore();
    }
  },
  nodeBody(ctx,r,t,P,st){
    for(let i=0;i<8;i++){ const a=i/8*TAU+t*0.5;
      ctx.fillStyle=st.done?'rgba(255,217,119,0.45)':i%2?'rgba(255,95,208,0.5)':'rgba(192,255,110,0.5)';
      ctx.beginPath(); ctx.ellipse(Math.cos(a)*r*0.72,Math.sin(a)*r*0.72,r*0.4,r*0.18,a,0,TAU); ctx.fill(); }
  },
  critter(ctx,i,t,P,zH){
    if(i<2){ // glowbugs
      const cx=70+i*(G.UNIT_W-140), cy=180+i*(zH-360);
      const x=cx+Math.sin(t*0.55+i*2.4)*70+Math.sin(t*1.7+i)*16;
      const y=cy+Math.cos(t*0.45+i*1.8)*80+Math.sin(t*2.2+i)*10;
      const wing=Math.sin(t*30+i)*0.5;
      ctx.save(); ctx.translate(x,y); ctx.globalCompositeOperation='lighter';
      ctx.fillStyle='rgba(150,255,110,0.25)';
      ctx.beginPath(); ctx.arc(0,0,9,0,TAU); ctx.fill();
      ctx.fillStyle='hsl(95,100%,72%)';
      ctx.beginPath(); ctx.arc(0,0,3.2,0,TAU); ctx.fill();
      ctx.fillStyle='rgba(255,255,255,0.8)';
      ctx.beginPath(); ctx.ellipse(-3,-2.2,3.6,1.6,-0.6-wing,0,TAU); ctx.fill();
      ctx.beginPath(); ctx.ellipse(3,-2.2,3.6,1.6,0.6+wing,0,TAU); ctx.fill();
      ctx.restore();
    } else { // butterflies wandering figure-eights
      const cx=100+(i-2)*180, cy=zH*0.5;
      const x=cx+Math.sin(t*0.7+i*3)*90, y=cy+Math.sin(t*1.4+i*3)*110;
      const f=Math.sin(t*14+i)*0.8;
      ctx.save(); ctx.translate(x,y); ctx.rotate(Math.sin(t*0.7+i)*0.4);
      ctx.fillStyle=i%2?P.accent:'rgba(125,255,190,0.9)'; ctx.globalAlpha=0.9;
      for(const e of [-1,1]){
        ctx.beginPath(); ctx.ellipse(e*4,-1,5,3.4,e*(0.6+f*0.5),0,TAU); ctx.fill();
        ctx.beginPath(); ctx.ellipse(e*3,2.6,3.4,2.2,e*(0.8+f*0.5),0,TAU); ctx.fill();
      }
      ctx.fillStyle='#223'; ctx.beginPath(); ctx.ellipse(0,0.5,1.2,4,0,0,TAU); ctx.fill();
      ctx.restore(); ctx.globalAlpha=1;
    }
  },
  drifter(ctx,d,t,P){
    ctx.globalCompositeOperation='lighter';
    ctx.fillStyle=d.ph%1<0.5?'rgba(150,255,120,0.5)':'rgba(255,120,220,0.45)';
    ctx.beginPath(); ctx.arc(0,0,d.s*0.11+Math.sin(t*3+d.ph)*0.7,0,TAU); ctx.fill();
    ctx.globalCompositeOperation='source-over';
  },
},
fishbirds:{
  name:'FLYING FISH & DIVING BIRDS',
  palettes:[
    { hue:172, bg:['#02182b','#07536b'], node:'#7ff2e2', nodeDone:'#ffd977',
      lock:'#2b5f6b', accent:'#ffa64f', text:'#e2fffa', veil:'#021019' },
    { hue:225, bg:['#0a0a33','#20296e'], node:'#aab7ff', nodeDone:'#4fe8d9',
      lock:'#3c4380', accent:'#ff7fa8', text:'#e8ecff', veil:'#06061f' },
  ],
  motif(ctx,m,t,P){
    const s=m.s;
    if(m.v<0.5){ // swaying kelp
      ctx.strokeStyle='rgba(90,220,190,0.5)'; ctx.lineWidth=2.6; ctx.lineCap='round';
      for(let b=0;b<3;b++){
        ctx.beginPath(); ctx.moveTo((b-1)*s*0.14,s*0.4);
        for(let i=1;i<=5;i++){ const yy=s*0.4-i*s*0.16;
          ctx.quadraticCurveTo((b-1)*s*0.14+Math.sin(t*1.8+b+i*0.8)*s*0.11,yy+s*0.08,
                               (b-1)*s*0.14+Math.sin(t*1.8+b+(i+0.5)*0.8)*s*0.09,yy); }
        ctx.stroke();
      }
    } else { // shimmering current
      ctx.strokeStyle='rgba(160,255,240,0.35)'; ctx.lineWidth=2; ctx.lineCap='round';
      for(let i=0;i<3;i++){ const yy=(i-1)*s*0.2, ph=t*2+m.v*10+i;
        ctx.beginPath();
        for(let k=0;k<=14;k++){ const x=-s*0.5+k/14*s, y=yy+Math.sin(ph+k*0.75)*s*0.06;
          k?ctx.lineTo(x,y):ctx.moveTo(x,y); }
        ctx.stroke(); }
    }
  },
  nodeBody(ctx,r,t,P,st){
    ctx.strokeStyle=st.done?'rgba(255,217,119,0.7)':'rgba(160,255,240,0.6)'; ctx.lineWidth=2;
    ctx.beginPath(); ctx.arc(0,0,r*1.02+Math.sin(t*2.6)*1.1,0,TAU); ctx.stroke();
    ctx.beginPath(); ctx.arc(-r*0.4,-r*0.4,r*0.2,0.6,2.6); ctx.stroke();
    ctx.beginPath(); ctx.arc(r*0.5+Math.sin(t*1.8)*3,-r*0.7,r*0.12,0,TAU); ctx.stroke();
  },
  critter(ctx,i,t,P,zH){
    if(i<2){ // leaping fish with glitter
      const per=3.2+i*0.9, u=((t+i*1.7)%per)/per;
      const x0=50+i*(G.UNIT_W-190), y0=zH*0.45+i*90, span=110;
      if(u<0.5){
        const f=u/0.5, x=x0+f*span, y=y0-Math.sin(f*Math.PI)*90;
        ctx.save(); ctx.translate(x,y); ctx.rotate(Math.atan2(-Math.cos(f*Math.PI)*2.2,1));
        ctx.fillStyle=P.accent;
        ctx.beginPath(); ctx.ellipse(0,0,11,4.4,0,0,TAU); ctx.fill();
        ctx.beginPath(); ctx.moveTo(-9,0); ctx.lineTo(-15,-5); ctx.lineTo(-15,5); ctx.closePath(); ctx.fill();
        ctx.fillStyle='rgba(255,255,255,0.85)';
        ctx.beginPath(); ctx.ellipse(1.6,-1.6,4.2,1.4,-0.4+Math.sin(t*24)*0.3,0,TAU); ctx.fill();
        ctx.fillStyle='#08222b'; ctx.beginPath(); ctx.arc(6.8,-1.2,1.2,0,TAU); ctx.fill();
        ctx.restore();
        ctx.globalCompositeOperation='lighter';
        for(let d=1;d<4;d++){ const df=f-d*0.07; if(df<0) continue;
          ctx.fillStyle='rgba(140,240,255,'+(0.5-d*0.12)+')';
          ctx.beginPath(); ctx.arc(x0+df*span,y0-Math.sin(df*Math.PI)*90+5+d*4,1.4,0,TAU); ctx.fill(); }
        ctx.globalCompositeOperation='source-over';
      } else if(u<0.6){
        const f=(u-0.5)/0.1;
        ctx.strokeStyle='rgba(160,255,240,'+(0.6*(1-f))+')'; ctx.lineWidth=2;
        ctx.beginPath(); ctx.ellipse(x0+span,y0+3,3+f*16,(3+f*16)*0.32,0,0,TAU); ctx.stroke();
      }
    } else if(i===2){ // jellyfish on patrol, rising forever
      const x=G.UNIT_W*0.5+Math.sin(t*0.5)*120;
      const y=(zH+40-((t*22)%(zH+80)));
      const sq=1+Math.sin(t*3)*0.12;
      ctx.save(); ctx.translate(x,y);
      ctx.fillStyle='rgba(127,242,226,0.35)';
      ctx.beginPath(); ctx.arc(0,0,10*sq,Math.PI,0); ctx.fill();
      ctx.strokeStyle='rgba(127,242,226,0.5)'; ctx.lineWidth=1.8; ctx.lineCap='round';
      for(let k=0;k<4;k++){ const x0=-6+k*4;
        ctx.beginPath(); ctx.moveTo(x0,0);
        ctx.quadraticCurveTo(x0+Math.sin(t*3+k)*3,9,x0+Math.sin(t*3+k+1)*4,16); ctx.stroke(); }
      if(!blink(t,0.4)){ ctx.fillStyle='#04222b';
        for(const e of [-1,1]){ ctx.beginPath(); ctx.arc(e*3.4,-2.4,1.2,0,TAU); ctx.fill(); } }
      ctx.restore();
    } else { // a bird dives clean through the zone, bubble trail
      const per=5.5, u=((t+2.2)%per)/per;
      if(u<0.4){
        const f=u/0.4, x=G.UNIT_W*0.72-f*60, y=-20+f*(zH+40);
        ctx.save(); ctx.translate(x,y); ctx.rotate(1.85);
        ctx.fillStyle=P.text; ctx.globalAlpha=0.85;
        ctx.beginPath(); ctx.ellipse(0,0,9,3.6,0,0,TAU); ctx.fill();
        ctx.beginPath(); ctx.moveTo(8,0); ctx.lineTo(13,0); ctx.lineTo(8,1.6); ctx.fill();
        const fl=Math.sin(t*20)*0.3;
        ctx.beginPath(); ctx.ellipse(-1,-2.6,5.5,2,-0.5-fl,0,TAU); ctx.fill();
        ctx.restore(); ctx.globalAlpha=1;
        ctx.strokeStyle='rgba(160,255,240,0.4)'; ctx.lineWidth=1.4;
        for(let d=1;d<4;d++){ const df=f-d*0.05; if(df<0) continue;
          ctx.beginPath(); ctx.arc(G.UNIT_W*0.72-df*60+4,-20+df*(zH+40),2+d,0,TAU); ctx.stroke(); }
      }
    }
  },
  drifter(ctx,d,t,P){
    ctx.strokeStyle='rgba(160,255,240,0.5)'; ctx.lineWidth=1.5;
    ctx.beginPath(); ctx.arc(Math.sin(t*2+d.ph)*3,0,d.s*0.11,0,TAU); ctx.stroke();
  },
},
boneyard:{
  name:'SWARM OF BIRD SKELETONS',
  palettes:[
    { hue:262, bg:['#120b1c','#2c1e40'], node:'#efe8ff', nodeDone:'#8effc2',
      lock:'#4a3d63', accent:'#f4f0e0', text:'#f1ecff', veil:'#0b0714' },
    { hue:16,  bg:['#1a0c0c','#3d1c14'], node:'#ffe9d4', nodeDone:'#ffd977',
      lock:'#5f4234', accent:'#fff3dd', text:'#ffefe2', veil:'#120707' },
  ],
  motif(ctx,m,t,P){
    const s=m.s;
    if(m.v<0.5){ // skull lantern
      ctx.save(); ctx.rotate(Math.sin(t*0.9+m.v*9)*0.08);
      ctx.fillStyle=P.accent; ctx.globalAlpha=0.85;
      ctx.beginPath(); ctx.arc(0,0,s*0.2,0,TAU); ctx.fill();
      ctx.beginPath(); ctx.moveTo(s*0.13,s*0.05); ctx.lineTo(s*0.4,s*0.14); ctx.lineTo(s*0.11,s*0.17); ctx.closePath(); ctx.fill();
      const g=0.45+Math.sin(t*2.4+m.v*20)*0.35;
      ctx.globalCompositeOperation='lighter';
      ctx.fillStyle='rgba(190,160,255,'+g+')';
      ctx.beginPath(); ctx.arc(-s*0.06,-s*0.03,s*0.06,0,TAU); ctx.fill();
      ctx.beginPath(); ctx.arc(s*0.08,-s*0.01,s*0.045,0,TAU); ctx.fill();
      ctx.globalCompositeOperation='source-over';
      ctx.restore(); ctx.globalAlpha=1;
    } else { // bird constellation
      ctx.strokeStyle='rgba(207,196,255,0.35)'; ctx.lineWidth=1.3;
      const pts=[[-0.4,0.1],[-0.15,-0.15],[0.1,0.02],[0.35,-0.2],[0.45,0.05]];
      ctx.beginPath();
      pts.forEach((p,i)=>{ i?ctx.lineTo(p[0]*s,p[1]*s):ctx.moveTo(p[0]*s,p[1]*s); });
      ctx.stroke();
      for(const p of pts){
        const tw=0.4+Math.sin(t*3+p[0]*17)*0.35;
        ctx.globalCompositeOperation='lighter';
        ctx.fillStyle='rgba(220,210,255,'+tw+')';
        ctx.beginPath(); ctx.arc(p[0]*s,p[1]*s,1.6,0,TAU); ctx.fill();

  },
  nodeBody(ctx,r,t,P,st){
    ctx.save(); ctx.rotate(t*0.35);
    ctx.strokeStyle=st.done?'rgba(142,255,194,0.6)':'rgba(230,220,255,0.55)';
    ctx.lineWidth=2.2; ctx.lineCap='round';
    for(let i=0;i<8;i++){ const a=i/8*TAU;
      ctx.save(); ctx.translate(Math.cos(a)*r*0.92,Math.sin(a)*r*0.92); ctx.rotate(a+Math.PI/2);
      ctx.beginPath(); ctx.moveTo(-3,0); ctx.lineTo(3,0); ctx.stroke();
      ctx.beginPath(); ctx.arc(-3.7,-0.9,1,0,TAU); ctx.arc(-3.7,0.9,1,0,TAU); ctx.stroke();
      ctx.beginPath(); ctx.arc(3.7,-0.9,1,0,TAU); ctx.arc(3.7,0.9,1,0,TAU); ctx.stroke();
      ctx.restore(); }
    ctx.restore();
  },
  critter(ctx,i,t,P,zH){
    if(i<3){ // the skeleton swarm commutes
      const sp=16+i*7, y0=130+i*(zH-260)/2;
      const x=G.UNIT_W-(((t*sp+i*200)%(G.UNIT_W+140))-70);
      const y=y0+Math.sin(t*1.1+i*2.2)*20, f=Math.sin(t*5.5+i)*0.55;
      ctx.save(); ctx.translate(x,y); ctx.scale(-1,1); ctx.globalAlpha=0.8;
      ctx.strokeStyle=P.accent; ctx.lineWidth=1.8; ctx.lineCap='round';
      ctx.beginPath(); ctx.moveTo(-7,0); ctx.lineTo(5,0); ctx.stroke();
      for(let v=0;v<3;v++){ ctx.beginPath(); ctx.moveTo(-5+v*3.5,-1.8); ctx.lineTo(-5+v*3.5,1.8); ctx.stroke(); }
      ctx.fillStyle=P.accent;
      ctx.beginPath(); ctx.arc(7,-1,2.9,0,TAU); ctx.fill();
      ctx.beginPath(); ctx.moveTo(9.3,-1); ctx.lineTo(12.4,0); ctx.lineTo(9.3,0.7); ctx.fill();
      ctx.fillStyle=P.bg[0]; ctx.beginPath(); ctx.arc(7.4,-1.5,0.9,0,TAU); ctx.fill();
      ctx.strokeStyle=P.accent;
      ctx.beginPath(); ctx.moveTo(-2,-1); ctx.quadraticCurveTo(2,-7-f*5,9,-8-f*6); ctx.stroke();
      for(let fe=0;fe<3;fe++){ ctx.beginPath(); ctx.moveTo(1+fe*2.6,-2.6-f*(2+fe)); ctx.lineTo(2.6+fe*2.6,-6-f*(3.5+fe)); ctx.stroke(); }
      ctx.restore(); ctx.globalAlpha=1;
    } else { // a will-o'-wisp doing laps around the maze
      const u=(t*0.06)%1, ang=u*TAU;
      const x=G.UNIT_W*0.5+Math.cos(ang)*150, y=zH*0.5+Math.sin(ang*2)*zH*0.36;
      ctx.save(); ctx.translate(x,y); ctx.globalCompositeOperation='lighter';
      const p2=0.5+Math.sin(t*5)*0.3;
      ctx.fillStyle='rgba(190,160,255,'+p2+')';
      ctx.beginPath(); ctx.arc(0,0,3,0,TAU); ctx.fill();
      ctx.fillStyle='rgba(190,160,255,0.18)';
      ctx.beginPath(); ctx.arc(0,0,9,0,TAU); ctx.fill();
      ctx.restore();
    }
  },
  drifter(ctx,d,t,P){
    ctx.save(); ctx.translate(Math.sin(t*1.2+d.ph)*5,0);
    ctx.fillStyle='rgba(207,196,255,0.22)';
    const w=d.s*0.15;
    ctx.beginPath(); ctx.arc(0,0,w,Math.PI,0);
    ctx.quadraticCurveTo(w*0.6,d.s*0.13,w*0.3,d.s*0.19);
    ctx.quadraticCurveTo(0,d.s*0.11,-w*0.3,d.s*0.19);
    ctx.quadraticCurveTo(-w*0.6,d.s*0.13,-w,0); ctx.fill();
    if(!blink(t,d.ph)){ ctx.fillStyle='rgba(20,16,40,0.8)';
      ctx.beginPath(); ctx.arc(-w*0.35,-1,1.1,0,TAU); ctx.fill();
      ctx.beginPath(); ctx.arc(w*0.35,-1,1.1,0,TAU); ctx.fill(); }
    ctx.restore();
  },
},
};

/* ---------------- progression state (fake) ---------------- */

/* ---------------- the maze tunnel ----------------
   Per zone: an orthogonal walk. Enter bottom-center, then for each of 7
   rows run horizontally to a seeded x (min run length enforced) and step
   up; finally jog back to center and exit the top port. Corners rounded,
   nodes sit mid-run. Deterministic per zone index. */
const NODEPOS=[];   // [zi][k-1] = [x, worldY]
function buildWorldPath(){
  const cx=G.UNIT_W*G.PORT_X, all=[[cx,worldH+50]];
  for(let zi=0;zi<NZ;zi++){
    const rng=mulberry32(0xA7E^(ZONES[zi].n*2654435761));
    const top=zoneTop(zi), rowH=(G.ZONE_H-G.MAZE.topLane-60)/G.MAZE.rows;
    let x=cx; NODEPOS[zi]=[];
    for(let k=1;k<=G.MAZE.rows;k++){
      const y=top+G.ZONE_H-60-(k-1)*rowH-rowH*0.5;
      let nx, guard=0;
      do{ nx=G.MAZE.xMin+rng()*(G.MAZE.xMax-G.MAZE.xMin); }
      while(Math.abs(nx-x)<G.MAZE.minRun && guard++<20);
      if(Math.abs(nx-x)<G.MAZE.minRun) nx=x>G.UNIT_W/2?x-G.MAZE.minRun:x+G.MAZE.minRun;
      all.push([x,y]);                    // rise into the row
      all.push([nx,y]);                   // the horizontal run
      NODEPOS[zi].push([(x+nx)/2,y]);     // node mid-run
      x=nx;
    }
    all.push([x,top+G.MAZE.topLane]);     // up into the exit lane
    all.push([cx,top+G.MAZE.topLane]);    // jog back to center
    all.push([cx,top]);                   // out the port
  }
  all.push([cx,-50]);
  /* sample with rounded corners into an arc-length LUT */
  const lut=[]; let cum=0;
  const push=(x,y)=>{ if(lut.length){ const q=lut[lut.length-1]; const d=Math.hypot(x-q.x,y-q.y);
      if(d<0.4) return; cum+=d; } lut.push({x,y,cum}); };
  for(let i=0;i<all.length;i++){
    const B=all[i];
    if(i===0||i===all.length-1){ push(B[0],B[1]); continue; }
    const A=all[i-1], C=all[i+1];
    const l1=Math.hypot(B[0]-A[0],B[1]-A[1]), l2=Math.hypot(C[0]-B[0],C[1]-B[1]);
    const r=Math.min(G.MAZE.corner,l1*0.5,l2*0.5);
    if(r<2){ push(B[0],B[1]); continue; }
    const inX=B[0]-(B[0]-A[0])/l1*r, inY=B[1]-(B[1]-A[1])/l1*r;
    const outX=B[0]+(C[0]-B[0])/l2*r, outY=B[1]+(C[1]-B[1])/l2*r;
    // straight up to the corner entry (dense enough for smooth rings)
    const q=lut.length?lut[lut.length-1]:{x:A[0],y:A[1]};
    const segLen=Math.hypot(inX-q.x,inY-q.y), steps=Math.max(1,Math.floor(segLen/7));
    for(let s2=1;s2<=steps;s2++) push(lerp(q.x,inX,s2/steps),lerp(q.y,inY,s2/steps));
    for(let s2=1;s2<=7;s2++){ const u=s2/7;   // quadratic corner ≈ arc
      push((1-u)*(1-u)*inX+2*u*(1-u)*B[0]+u*u*outX,
           (1-u)*(1-u)*inY+2*u*(1-u)*B[1]+u*u*outY); }
  }
  { const end=all[all.length-1], q=lut[lut.length-1];
    const segLen=Math.hypot(end[0]-q.x,end[1]-q.y), steps=Math.max(1,Math.floor(segLen/7));
    for(let s2=1;s2<=steps;s2++) push(lerp(q.x,end[0],s2/steps),lerp(q.y,end[1],s2/steps)); }
  for(let i=0;i<lut.length;i++){
    const a=lut[Math.max(0,i-1)], b=lut[Math.min(lut.length-1,i+1)];
    lut[i].ang=Math.atan2(b.y-a.y,b.x-a.x);
  }
  return lut;
}
const LUT=buildWorldPath(), PATHLEN=LUT[LUT.length-1].cum;
function pathPoint(dist){
  let lo=0,hi=LUT.length-1;
  while(lo<hi){ const mid=(lo+hi)>>1; LUT[mid].cum<dist?lo=mid+1:hi=mid; }
  const b=LUT[lo], a=LUT[Math.max(0,lo-1)];
  const f=(a.cum===b.cum)?0:(dist-a.cum)/(b.cum-a.cum);
  return {x:lerp(a.x,b.x,f), y:lerp(a.y,b.y,f), ang:a.ang+((b.ang-a.ang+Math.PI*3)%TAU-Math.PI)*f};
}

/* ---------------- seeded set dressing ---------------- */
const motifCache={}, driftCache={};
function motifs(zi){
  if(motifCache[zi]) return motifCache[zi];
  const rng=mulberry32(0xF00D^zi*7919), out=[]; let guard=0;
  const top=zoneTop(zi);
  while(out.length<G.MOTIF.perZone && guard++<600){
    const x=G.MOTIF.margin+rng()*(G.UNIT_W-2*G.MOTIF.margin);
    const y=40+rng()*(G.ZONE_H-90);
    let ok=true;
    for(let i=0;i<LUT.length;i+=6){ const p=LUT[i];
      if(p.y>top-20&&p.y<top+G.ZONE_H+20&&Math.hypot(p.x-x,p.y-(top+y))<G.MOTIF.clearance){ ok=false; break; } }
    if(!ok || x>G.SKIP.lane-38) continue;
    out.push({x,y,s:G.MOTIF.sizeMin+rng()*(G.MOTIF.sizeMax-G.MOTIF.sizeMin),
              v:rng(),wa:8+rng()*16,ws:0.2+rng()*0.4,wp:rng()*9});
  }
  return motifCache[zi]=out;
}
function drifters(zi){
  if(driftCache[zi]) return driftCache[zi];
  const rng=mulberry32(0xD1F7^zi*104729), out=[];
  for(let i=0;i<G.LIFE.drifters;i++)
    out.push({x:rng()*G.UNIT_W, y0:rng()*G.ZONE_H, s:12+rng()*16, sp:10+rng()*18, ph:rng()*9});
  return driftCache[zi]=out;
}
const STARS=[]; { const rng=mulberry32(0x57A2);
  for(let i=0;i<110;i++) STARS.push({x:rng()*G.UNIT_W,y:rng()*worldH*0.92,r:0.6+rng()*1.3,ph:rng()*9}); }
const SPARKS=[]; { const rng=mulberry32(0x5EED);
  for(let i=0;i<G.LIFE.sparks;i++) SPARKS.push({d:rng(),sp:130+rng()*110,ph:rng()*9}); }

/* ---------------- rendering ---------------- */
function drawTube(camY){
  const yTop=camY-40, yBot=camY+H/S+40;
  ctx.save(); ctx.globalCompositeOperation='lighter'; ctx.lineCap='round';
  /* soft beam hugging the maze */
  ctx.beginPath(); let started=false;
  for(let i=0;i<LUT.length;i++){ const p=LUT[i];
    if(p.y<yTop||p.y>yBot){ started=false; continue; }
    started?ctx.lineTo(p.x,p.y-camY):(ctx.moveTo(p.x,p.y-camY),started=true); }
  ctx.strokeStyle='hsla('+((t*60)%360)+',90%,65%,0.09)'; ctx.lineWidth=G.TUBE.beamW; ctx.stroke();
  ctx.strokeStyle='rgba(255,255,255,0.05)'; ctx.lineWidth=G.TUBE.beamW*0.45; ctx.stroke();
  /* rainbow rings, tight, with a pulse racing along the tunnel */
  const cur=ZONES.find(z=>z.vis==='current');
  const curZi=ZONES.indexOf(cur), [ncx,ncy]=NODEPOS[curZi][cur.curLevel-1];
  for(let d=0,k2=0; d<PATHLEN; d+=G.TUBE.ringGap,k2++){
    const p=pathPoint(d);
    if(p.y<yTop||p.y>yBot) continue;
    const hue=(d*0.7+t*130)%360;
    const wave=Math.sin(t*6-d*0.055);
    const near=Math.hypot(p.x-ncx,p.y-ncy)<G.TUBE.pulseNear;
    const puls=(1+wave*0.16)*(near?1.12:1);
    const lum=62+wave*10+(near?8:0);
    ctx.save(); ctx.translate(p.x,p.y-camY); ctx.rotate(p.ang+Math.PI/2);
    ctx.strokeStyle='hsla('+hue+',100%,'+lum+'%,0.30)'; ctx.lineWidth=3.6;
    ctx.beginPath(); ctx.ellipse(0,0,G.TUBE.rx*puls,G.TUBE.ry*puls,0,0,TAU); ctx.stroke();
    ctx.strokeStyle='hsla('+hue+',100%,'+Math.min(88,lum+16)+'%,0.9)'; ctx.lineWidth=1.4;
    ctx.beginPath(); ctx.ellipse(0,0,G.TUBE.rx*puls,G.TUBE.ry*puls,0,0,TAU); ctx.stroke();
    ctx.restore();
  }
  for(const s2 of SPARKS){
    const d=((s2.d+t*s2.sp/PATHLEN)%1)*PATHLEN, p=pathPoint(d);
    if(p.y<yTop||p.y>yBot) continue;
    const hue=(d*0.7+t*130)%360, tw=0.55+Math.sin(t*6+s2.ph)*0.35;
    ctx.fillStyle='hsla('+hue+',100%,78%,'+tw+')';
    ctx.beginPath(); ctx.arc(p.x,p.y-camY,2,0,TAU); ctx.fill();
    const q=pathPoint(Math.max(0,d-12));
    ctx.strokeStyle='hsla('+hue+',100%,72%,'+(tw*0.4)+')'; ctx.lineWidth=1.8;
    ctx.beginPath(); ctx.moveTo(q.x,q.y-camY); ctx.lineTo(p.x,p.y-camY); ctx.stroke();
  }
  ctx.restore();
}
function wavyText(txt,x,y,size,fill,glow){
  ctx.font='900 '+size+'px system-ui,sans-serif';
  ctx.textAlign='left'; ctx.textBaseline='middle';
  let tw=0; const ws=[];
  for(const ch of txt){ const w=ctx.measureText(ch).width; ws.push(w); tw+=w; }
  let xx=x-tw/2;
  for(let i=0;i<txt.length;i++){
    const dy=Math.sin(t*2.6+i*0.55)*2.2;
    if(glow){ ctx.shadowColor=glow; ctx.shadowBlur=9; }
    ctx.fillStyle=fill; ctx.fillText(txt[i],xx,y+dy);
    ctx.shadowBlur=0; xx+=ws[i];
  }
  ctx.textAlign='center';
}
const nodePop={};
function drawBirdie(x,y,sz){
  ctx.save(); ctx.translate(x,y+Math.sin(t*3)*2.5);
  const hop=Math.max(0,Math.sin(t*1.6));
  const f=Math.sin(t*8)*0.35+hop*0.4;
  ctx.fillStyle='#ffb23e';
  ctx.beginPath(); ctx.ellipse(-sz*0.55,-sz*0.1,sz*0.5,sz*0.22,-0.5-f,0,TAU); ctx.fill();
  ctx.beginPath(); ctx.ellipse(sz*0.55,-sz*0.1,sz*0.5,sz*0.22,0.5+f,0,TAU); ctx.fill();
  const bg=ctx.createRadialGradient(-sz*0.2,-sz*0.25,sz*0.1,0,0,sz*0.9);
  bg.addColorStop(0,'#ffdf6e'); bg.addColorStop(1,'#e8920f');
  ctx.fillStyle=bg; ctx.beginPath(); ctx.ellipse(0,0,sz*0.62,sz*0.68,0,0,TAU); ctx.fill();
  ctx.fillStyle='#ffd23e'; ctx.beginPath(); ctx.arc(0,-sz*0.62,sz*0.36,0,TAU); ctx.fill();

  ctx.fillStyle='rgba(255,120,120,0.55)';
  for(const e of [-1,1]){ ctx.beginPath(); ctx.arc(e*sz*0.26,-sz*0.56,sz*0.06,0,TAU); ctx.fill(); }
  ctx.fillStyle='#ff8b30'; ctx.beginPath();
  ctx.moveTo(-sz*0.07,-sz*0.55); ctx.lineTo(sz*0.07,-sz*0.55); ctx.lineTo(0,-sz*0.4); ctx.closePath(); ctx.fill();
  if(hop>0.75){ ctx.globalCompositeOperation='lighter';
    for(let i=0;i<3;i++){ const a=t*7+i*2.1;
      ctx.fillStyle='rgba(255,240,160,0.7)';
      ctx.beginPath(); ctx.arc(Math.cos(a)*sz,Math.sin(a)*sz*0.7-sz*0.3,1.4,0,TAU); ctx.fill(); }
    ctx.globalCompositeOperation='source-over'; }
  ctx.restore();
}
function star5(x,y,r,fill,rot){
  ctx.save(); ctx.translate(x,y); ctx.rotate(rot||0);
  ctx.beginPath();
  for(let i=0;i<10;i++){ const a=-Math.PI/2+i/10*TAU, rr=i%2?r*0.45:r;
    ctx[i?'lineTo':'moveTo'](Math.cos(a)*rr,Math.sin(a)*rr); }
  ctx.closePath(); ctx.fillStyle=fill; ctx.fill(); ctx.restore();
}
function drawZoneLayer(zi,camY){
  const z=ZONES[zi], TH=THEMES[z.theme], P=palOf(z), top=zoneTop(zi);
  ctx.save(); ctx.translate(0,top-camY);
  for(const m of motifs(zi)){
    ctx.save();
    ctx.translate(m.x+Math.sin(t*m.ws+m.wp)*m.wa, m.y+Math.cos(t*m.ws*0.8+m.wp)*m.wa*0.6);
    TH.motif(ctx,m,t,P);
    ctx.restore(); ctx.globalAlpha=1;
  }
  for(const d of drifters(zi)){
    const y=((d.y0-t*d.sp)%G.ZONE_H+G.ZONE_H)%G.ZONE_H;
    ctx.save(); ctx.translate(d.x+Math.sin(t*0.8+d.ph)*10,y);
    TH.drifter(ctx,d,t,P);
    ctx.restore(); ctx.globalAlpha=1; ctx.globalCompositeOperation='source-over';
  }
  if(z.vis!=='hidden') for(let i=0;i<G.LIFE.critters;i++) TH.critter(ctx,i,t,P,G.ZONE_H);
  ctx.restore();
}
function drawZoneUI(zi,camY){
  const z=ZONES[zi], TH=THEMES[z.theme], P=palOf(z), top=zoneTop(zi);
  const cx=G.UNIT_W*G.PORT_X;

  ctx.lineTo(G.SKIP.lane,G.MAZE.topLane); ctx.lineTo(cx,G.MAZE.topLane);
  ctx.stroke(); ctx.setLineDash([]);
  ctx.save(); ctx.translate(G.SKIP.lane,gateY); ctx.rotate(t*0.9);
  ctx.strokeStyle='#ffd977'; ctx.lineWidth=2.6;

    ctx[i?'lineTo':'moveTo'](Math.cos(a)*G.SKIP.r,Math.sin(a)*G.SKIP.r); }
  ctx.closePath(); ctx.stroke(); ctx.shadowBlur=0; ctx.restore();
  ctx.fillStyle='#ffd977'; ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.font='900 11px system-ui,sans-serif';
  ctx.fillText('×2',G.SKIP.lane,gateY);
  ctx.font='700 8px system-ui,sans-serif'; ctx.fillStyle='rgba(255,217,119,0.8)';
  ctx.fillText('SKIP',G.SKIP.lane,gateY+G.SKIP.r+9);
  const orb=t*2.2;
  ctx.globalCompositeOperation='lighter';
  ctx.fillStyle='rgba(255,230,150,0.9)';
  ctx.beginPath(); ctx.arc(G.SKIP.lane+Math.cos(orb)*(G.SKIP.r+6),gateY+Math.sin(orb)*(G.SKIP.r+6),1.8,0,TAU); ctx.fill();

    ctx.strokeStyle=done?P.nodeDone:isCur?P.node:P.lock; ctx.lineWidth=G.NODE.ringW;
    if(isCur){ ctx.shadowColor=P.node; ctx.shadowBlur=14; }
    ctx.beginPath(); ctx.arc(0,0,r*0.62,0,TAU); ctx.stroke(); ctx.shadowBlur=0;
    ctx.fillStyle=done?P.nodeDone:isCur?'#fff':P.lock;
    ctx.font='900 '+G.TEXT.node+'px system-ui,sans-serif';
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText(String(k),0,0.5);
    if(done){ const n=z.stars[k-1];
      for(let s2=0;s2<3;s2++){
        const tw=s2<n&&Math.sin(t*3+s2*2+k)>0.93;
        star5((s2-1)*11,-r-10+(s2===1?-2:0),G.NODE.starR*(tw?1.35:1),
              s2<n?P.nodeDone:'rgba(255,255,255,0.14)',(s2-1)*0.2+(tw?t*3:0));
      } }
    ctx.restore();
    if(isCur) drawBirdie(x-36,y-22,13);
  }
  /* zone-mouth gate ring at the entry port */
  ctx.save(); ctx.translate(cx,G.ZONE_H);
  const mh=(t*130)%360;
  ctx.strokeStyle='hsla('+mh+',100%,65%,0.85)'; ctx.lineWidth=3;
  ctx.shadowColor='hsla('+mh+',100%,60%,1)'; ctx.shadowBlur=12;
  for(const rr of [1,1.5]){
    ctx.save(); ctx.rotate(Math.sin(t*0.7)*0.06); ctx.globalAlpha=rr===1?0.9:0.3;
    ctx.beginPath(); ctx.ellipse(0,0,26*rr,10*rr,0,0,TAU); ctx.stroke(); ctx.restore(); }
  ctx.shadowBlur=0; ctx.restore();
  /* zone plate — single compact line */
  if(z.vis==='done'||z.vis==='current'){
    let plate='ZONE '+z.n+' · '+TH.name;
    if(z.vis==='done') plate+='  ★'+z.stars.reduce((a,b)=>a+b,0)+'/21';
    wavyText(plate,cx,G.ZONE_H-24,G.TEXT.zone-2,P.text,'hsla('+P.hue+',100%,60%,1)');
  }
  ctx.restore();
}
function drawVeil(zi,camY){
  const z=ZONES[zi]; if(z.vis!=='next'&&z.vis!=='hidden') return;
  const P=palOf(z), TH=THEMES[z.theme], top=zoneTop(zi), cx=G.UNIT_W*G.PORT_X;
  ctx.save(); ctx.translate(0,top-camY);
  const a=z.vis==='next'?0.78:0.93;
  const vg=ctx.createLinearGradient(0,G.ZONE_H,0,G.ZONE_H-G.BLEND);
  vg.addColorStop(0,hexA(P.veil,0)); vg.addColorStop(1,hexA(P.veil,a));
  ctx.fillStyle=vg; ctx.fillRect(0,G.ZONE_H-G.BLEND,G.UNIT_W,G.BLEND);
  ctx.fillStyle=hexA(P.veil,a); ctx.fillRect(0,-1,G.UNIT_W,G.ZONE_H-G.BLEND+1);
  for(let i=0;i<3;i++){
    const wy=(i*0.31*G.ZONE_H+Math.sin(t*0.4+i)*40)%G.ZONE_H;
    const wx=(t*14*(i%2?1:-1)+i*130)%(G.UNIT_W+240)-120;
    const fg=ctx.createRadialGradient(wx,wy,0,wx,wy,110);
    fg.addColorStop(0,'rgba(207,208,255,0.07)'); fg.addColorStop(1,'rgba(207,208,255,0)');
    ctx.fillStyle=fg;
    ctx.beginPath(); ctx.ellipse(wx,wy,110,30,0,0,TAU); ctx.fill();
  }
  if(z.vis==='next'){
    wavyText('ZONE '+z.n+' · '+TH.name,cx,G.ZONE_H-24,G.TEXT.zone-2,
             'rgba(255,255,255,0.8)','hsla('+P.hue+',100%,60%,0.9)');
    ctx.font='700 10px system-ui,sans-serif'; ctx.fillStyle='rgba(255,255,255,0.42)';
    ctx.textAlign='center';
    ctx.fillText('clear zone '+(z.n-1)+' to light the way',cx,G.ZONE_H-8);
  } else {
    const p=0.28+Math.sin(t*1.8)*0.1;
    ctx.font='900 40px system-ui,sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.shadowColor='rgba(200,190,255,0.8)'; ctx.shadowBlur=16;
    ctx.fillStyle='rgba(255,255,255,'+p+')';
    ctx.fillText('?',cx+Math.sin(t*0.9)*5,G.ZONE_H*0.5+Math.sin(t*1.3)*8);
    ctx.shadowBlur=0;
  }
  ctx.restore();
}

/* ---------------- scroll (snaps zone to zone), tap, toast ---------------- */
let camY=0,dragging=false,dragY0=0,camY0=0,moved=false,vel=0,lastY=0;
let toast='',toastT=0,toastHue=140;
const maxCam=()=>Math.max(0,worldH-H/S);
function zoneCam(zi){ return clamp(zoneTop(zi)-(H/S-G.ZONE_H)/2,0,maxCam()); }
let snapZi=1;
camY=zoneCam(1);
addEventListener('pointerdown',e=>{ dragging=true; moved=false; dragY0=e.clientY; camY0=camY; lastY=e.clientY; vel=0; });
addEventListener('pointermove',e=>{ if(!dragging) return;
  if(Math.abs(e.clientY-dragY0)>6) moved=true;
  camY=clamp(camY0+(e.clientY-dragY0)/S,-40,maxCam()+40); vel=(e.clientY-lastY)/S; lastY=e.clientY; });
addEventListener('pointerup',e=>{
  if(dragging&&!moved) tap(e.clientX/S,e.clientY/S+camY);
  if(dragging&&moved){
    // fling or settle: a fling picks the neighbouring zone in its direction
    // (dragging up = negative vel = deeper zone, since higher zones sit at
    // smaller world-y), a slow drag settles on whatever fills the screen
    const center=camY+H/S/2, zi=zoneAt(clamp(center,0,worldH-1));
    snapZi = Math.abs(vel)>4 ? clamp(zi+(vel<0?1:-1),0,NZ-1) : zi;
  }
  dragging=false; });
addEventListener('pointercancel',()=>dragging=false);
addEventListener('wheel',e=>{ snapZi=clamp(snapZi+(e.deltaY>0?-1:1),0,NZ-1); },{passive:true});
function tap(ux,wy){
  const zi=zoneAt(clamp(wy,0,worldH-1)), z=ZONES[zi];
  if(z.vis==='next'||z.vis==='hidden'){ say('the tunnel ahead is still dark…',260); return; }
  const gateY=(NODEPOS[zi][3][1]+NODEPOS[zi][2][1])/2;
  if(Math.hypot(ux-G.SKIP.lane,wy-gateY)<30){
    say('beat one level at ×2 difficulty to skip ahead!',48); return; }
  for(let k=1;k<=7;k++){
    const [wx2,wy2]=NODEPOS[zi][k-1];
    if(Math.hypot(ux-wx2,wy-wy2)<G.NODE.r+10){
      nodePop[zi+'-'+k]=1;
      if(z.vis==='done') say('replay '+z.n+'-'+k+' for missing stars',48);
      else if(z.curLevel===k) say('LEVEL '+z.n+'-'+k+' — let’s fly!',(palOf(z).hue+40)%360);
      else if(z.stars&&z.stars[k-1]>0) say('replay level '+z.n+'-'+k,140);
      else say('locked — clear level '+z.n+'-'+z.curLevel+' first',0);
      return; } }
}
function say(m,hue){ toast=m; toastT=2.6; toastHue=hue; }

/* ---------------- frame ---------------- */
let last=performance.now();
function frame(now){
  const dt=Math.min(0.05,(now-last)/1000); last=now; t+=dt;
  if(!dragging){ camY+=(zoneCam(snapZi)-camY)*Math.min(1,dt*7); }
  toastT=Math.max(0,toastT-dt);
  for(const k in nodePop) nodePop[k]=Math.max(0,nodePop[k]-dt*2.4);
  ctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.fillStyle='#05010f'; ctx.fillRect(0,0,W,H);
  ctx.save(); ctx.scale(S,S);
  for(const st of STARS){
    const sy=st.y-camY*0.82;
    if(sy<-10||sy>H/S+10) continue;
    ctx.fillStyle='rgba(255,255,255,'+(0.25+Math.sin(t*2+st.ph)*0.2)+')';
    ctx.beginPath(); ctx.arc(st.x,sy,st.r,0,TAU); ctx.fill();
  }
  for(let zi=0;zi<NZ;zi++){
    const top=zoneTop(zi);
    if(top+G.ZONE_H+G.BLEND<camY||top-G.BLEND>camY+H/S) continue;
    const P=palOf(ZONES[zi]);
    const gTop=top-G.BLEND*0.5, gBot=top+G.ZONE_H+G.BLEND*0.5;
    const bg=ctx.createLinearGradient(0,gTop-camY,0,gBot-camY);
    bg.addColorStop(0,hexA(P.bg[1],0)); bg.addColorStop(G.BLEND/(gBot-gTop),hexA(P.bg[1],0.9));
    bg.addColorStop(1-G.BLEND/(gBot-gTop),hexA(P.bg[0],0.9)); bg.addColorStop(1,hexA(P.bg[0],0));
    ctx.fillStyle=bg; ctx.fillRect(0,gTop-camY,G.UNIT_W,gBot-gTop);
  }
  for(let zi=0;zi<NZ;zi++){
    const top=zoneTop(zi);
    if(top+G.ZONE_H<camY||top>camY+H/S) continue;
    drawZoneLayer(zi,camY);
  }
  drawTube(camY);
  for(let zi=0;zi<NZ;zi++){
    const top=zoneTop(zi);
    if(top+G.ZONE_H<camY||top>camY+H/S) continue;
    if(ZONES[zi].vis==='done'||ZONES[zi].vis==='current') drawZoneUI(zi,camY);
    drawVeil(zi,camY);
  }
  ctx.restore();
  const vg=ctx.createRadialGradient(W/2,H/2,Math.min(W,H)*0.45,W/2,H/2,Math.max(W,H)*0.72);
  vg.addColorStop(0,'rgba(5,1,15,0)'); vg.addColorStop(1,'rgba(5,1,15,0.5)');
  ctx.fillStyle=vg; ctx.fillRect(0,0,W,H);
  const cur=ZONES.find(z=>z.vis==='current');
  const hg=ctx.createLinearGradient(0,0,0,58);
  hg.addColorStop(0,'rgba(5,1,15,0.9)'); hg.addColorStop(1,'rgba(5,1,15,0)');
  ctx.fillStyle=hg; ctx.fillRect(0,0,W,58);
  ctx.save(); ctx.scale(S,S);
  wavyText('ZONE '+cur.n+' · '+THEMES[cur.theme].name,G.UNIT_W/2,24,13.5,'#fff',
           'hsla('+palOf(cur).hue+',100%,60%,1)');
  ctx.restore();
  ctx.textAlign='left'; ctx.textBaseline='middle';
  ctx.font='700 '+G.TEXT.hint+'px system-ui,sans-serif';
  ctx.fillStyle='rgba(255,255,255,0.4)';
  ctx.fillText('swipe for zones · tap a level',12,H-16);
  ctx.textAlign='right'; ctx.fillStyle='rgba(255,255,255,0.25)';
  ctx.fillText('PROTOTYPE v0.3',W-12,H-16);
  if(toastT>0){
    ctx.textAlign='center';
    ctx.font='900 15px system-ui,sans-serif';
    const a=Math.min(1,toastT*1.6);
    ctx.shadowColor='hsla('+toastHue+',100%,55%,'+a+')'; ctx.shadowBlur=14;
    ctx.fillStyle='rgba(255,255,255,'+a+')';
    ctx.fillText(toast,W/2,H-52-(2.6-toastT)*10);
    ctx.shadowBlur=0;
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
