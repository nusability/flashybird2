/* zones framework: theme registry + FX animation toolkit + map geometry.
   Shared contract with theme-lab.html — see its THEME PACK CONTRACT block. */
const THEMES=[]; function registerTheme(p){ THEMES.push(p); }
const FX={
  bob:(t,speed=2,amp=3,ph=0)=>Math.sin(t*speed+ph)*amp,
  sway:(t,speed=1.2,amp=0.12,ph=0)=>Math.sin(t*speed+ph)*amp,
  pulse:(t,speed=2,amp=0.06,ph=0)=>1+Math.sin(t*speed+ph)*amp,
  flap:(t,speed=9,amp=0.35,ph=0)=>Math.sin(t*speed+ph)*amp,
  blink:(t,seed)=>{ const p=(t+seed*13.7)%(2.8+(seed%1)*2.6); return p<0.14?1:0; },
  orbit:(t,speed,r,ph=0)=>[Math.cos(t*speed+ph)*r,Math.sin(t*speed+ph)*r],
  wander:(t,seed,ax=70,ay=80,speed=0.5)=>[
    Math.sin(t*speed+seed*7)*ax+Math.sin(t*speed*3.1+seed)*ax*0.2,
    Math.cos(t*speed*0.8+seed*3)*ay+Math.sin(t*speed*2.7+seed*2)*ay*0.15],
  crossing:(t,speed,span,ph=0)=>((t*speed+ph*span)%(span+140))-70,
  rise:(t,speed,span,ph=0)=>span-((t*speed+ph*span)%(span+60)),
  eyes(ctx,x,y,r,seed,t,color='#111'){
    const bl=FX.blink(t,seed);
    ctx.fillStyle=color;
    for(const e of [-1,1]){ ctx.beginPath();
      ctx.ellipse(x+e*r*1.4,y,r,Math.max(0.08,r*(1-bl)),0,0,Math.PI*2); ctx.fill(); }
  },
  glow(ctx,fn){ ctx.save(); ctx.globalCompositeOperation='lighter'; fn(); ctx.restore(); },
};
const G={
  UNIT_W:390, ZONE_H:720, PORT_X:0.5,
  MAZE:{ rows:7, xMin:64, xMax:316, minRun:84, corner:22, topLane:52 },
  TUBE:{ ringGap:14, rx:14, ry:5.5, beamW:34, pulseNear:90 },
  NODE:{ r:20, ringW:2.6, starR:4.6 },
  SKIP:{ r:17, lane:352 },
  MOTIF:{ perZone:9, margin:16, clearance:56, sizeMin:16, sizeMax:52 },
  LIFE:{ drifters:8, sparks:30, critters:4 },
  TEXT:{ zone:15, node:11, hint:11 },
};

<script>
'use strict';
/* ================= FLASHY BIRD =================
   Flappy-bird-from-behind through a hypnotic space
   tunnel. One button: tap / click / space to flap.
   ================================================ */
const VERSION='Z0.15.0 zones beta';
let cv = document.getElementById('c');
let ctx = cv.getContext('2d');

let W=0,H=0,CX=0,CY=0,DPR=1,SC=1,Fp=560,SAFE_T=0,SAFE_B=0;
// The paintable area is measured off the #vp yardstick (fixed inset:0):
// in standalone full-bleed mode iOS under-reports innerHeight AND
// visualViewport (812 on an 874pt screen — they exclude the status bar
// band even when the view runs edge-to-edge), while a fixed element's
// laid-out box always spans the real screen. visualViewport is only the
// fallback for the first frames before layout.
function vpSize(){
  const r=document.getElementById('vp').getBoundingClientRect();
  if(r.width>10 && r.height>10) return [Math.round(r.width),Math.round(r.height)];
  const vv=window.visualViewport;
  const w = (vv&&vv.width)  ? vv.width  : (document.documentElement.clientWidth ||window.innerWidth);
  const h = (vv&&vv.height) ? vv.height : (document.documentElement.clientHeight||window.innerHeight);
  return [Math.round(w),Math.round(h)];
}
function resize(){
  // render at native density (3x on modern phones) so text and thin
  // strokes stay crisp; cap at 3 to bound fill cost on zoomed desktops
  DPR = Math.min(window.devicePixelRatio||1, 3);
  [W,H] = vpSize();
  // black-translucent standalone runs edge-to-edge under the status bar and
  // home indicator; UI anchored to the top/bottom edges ducks the insets
  try{
    const cs=getComputedStyle(document.documentElement);
    SAFE_T=parseFloat(cs.getPropertyValue('--sat'))||0;
    SAFE_B=parseFloat(cs.getPropertyValue('--sab'))||0;
  }catch(e){ SAFE_T=0; SAFE_B=0; }
  cv.width = W*DPR; cv.height = H*DPR;
  cv.style.width = W+'px'; cv.style.height = H+'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);
  CX = W/2; CY = H/2;
  SC = Math.min(W,H)/720;
  Fp = 560*SC;
}
window.addEventListener('resize', resize); resize();
// iOS resolution watchdog: on reload (especially standalone/home-screen)
// Safari can report stale dimensions at script time and settle later with
// NO resize event — leaving the canvas backing store mismatched and the
// whole game upscaled blurry. Re-check on every geometry signal plus a
// short poll after launch; only re-run resize() on a real mismatch.
function resMatch(){
  const dpr=Math.min(window.devicePixelRatio||1,3), s=vpSize();
  return Math.abs(cv.width-s[0]*dpr)<2 && Math.abs(cv.height-s[1]*dpr)<2;
}
function ensureRes(){ if(!resMatch()) resize(); }
// The compositor assigns a layer its raster scale when the LAYER is born.
// A launch that races iOS's window-geometry settle can freeze the page at
// a reduced scale that survives backing-store rebuilds and even CSS
// resizes of the same element (proven live: the 1px nudge re-rastered
// and stayed soft). Two levers actually reset it: re-computing the page
// scale (viewport meta jiggle) and replacing the canvas element so it
// gets a brand-new layer.
const VPMETA=document.querySelector('meta[name=viewport]');
const VPCONTENT=VPMETA?VPMETA.getAttribute('content'):'';
function vpKick(){
  if(!VPMETA) return;
  VPMETA.setAttribute('content',
    VPCONTENT.replace('initial-scale=1','initial-scale=1.02')
             .replace('maximum-scale=1','maximum-scale=1.02'));
  requestAnimationFrame(()=>VPMETA.setAttribute('content',VPCONTENT));
}
function rebuildCanvas(){
  const n=document.createElement('canvas');
  n.id='c';
  cv.replaceWith(n);
  cv=n; ctx=n.getContext('2d');
  resize();
  vpKick();
}
window.addEventListener('pageshow',()=>rebuildCanvas());
window.addEventListener('focus',ensureRes);
document.addEventListener('visibilitychange',()=>{ if(!document.hidden) rebuildCanvas(); });
window.addEventListener('orientationchange',()=>setTimeout(ensureRes,80));
if(window.visualViewport) window.visualViewport.addEventListener('resize',ensureRes);
let resGuardN=24;
(function resGuard(){ ensureRes(); if(resGuardN-->0) setTimeout(resGuard,250); })();
// launch kicks after iOS has had time to settle the window geometry
setTimeout(rebuildCanvas,600);
setTimeout(rebuildCanvas,1800);
setTimeout(()=>syncUrl(),0);

/* ---------- deterministic randomness ----------
   Two seeded PRNG streams replace Math.random entirely:
   - world: consumed ONLY by course generation (spawns, shapes, gaps) —
     strictly sequential, so every device generates the identical course
     for a given seed regardless of frame rate
   - fx: cosmetics (particles, shake, stars, audio noise) on their own
     stream so frame-rate-dependent effect counts can't shift the course
   Seed = ?seed= URL param, else the UTC date: everyone flies the same
   daily tunnel. */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let r=Math.imul(a^a>>>15,1|a);r=r+Math.imul(r^r>>>7,61|r)^r;return((r^r>>>14)>>>0)/4294967296}}
function hashStr(s){let h=1779033703^s.length;for(let i=0;i<s.length;i++){h=Math.imul(h^s.charCodeAt(i),3432918353);h=h<<13|h>>>19}return h>>>0}
const _pad2=n=>String(n).padStart(2,'0');
const _now=new Date();
let TODAY=`${_now.getUTCFullYear()}${_pad2(_now.getUTCMonth()+1)}${_pad2(_now.getUTCDate())}`;
const urlSeed=(new URLSearchParams(location.search).get('seed')||'').slice(0,24);
let seedStr=urlSeed || TODAY;
// 'daily' follows the date across rollovers; 'custom' sticks to a picked
// or ?seed= tunnel until the player chooses otherwise
let seedMode = (!urlSeed || urlSeed===TODAY) ? 'daily' : 'custom';
let worldRng=mulberry32(hashStr(seedStr));
const wrng=()=>worldRng();
const wrand=(a,b)=>a+wrng()*(b-a);
const wirand=(a,b)=>Math.floor(wrand(a,b+1));
const fxRng=mulberry32(0xC0FFEE^hashStr(seedStr));

/* ---------- helpers ---------- */
const rand=(a,b)=>a+fxRng()*(b-a);   // fx stream — cosmetics only
const irand=(a,b)=>Math.floor(rand(a,b+1));
/* the tunnel's starting colour is part of the seed, not of how long your tab has
   been open: hue drifts continuously and used to carry over between runs, so two
   people flying the same daily tunnel saw different colours — and gate hues, which
   are derived from it, differed too */
const seedHue = () => hashStr(seedStr+'hue')%360;
function syncUrl(){
  try{
    const u=new URL(location.href);
    u.searchParams.set('seed', seedStr);
    history.replaceState(null,'',u);
  }catch(e){}
}
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,k)=>a+(b-a)*k;
const TAU=Math.PI*2;

/* difficulty is keyed off DISTANCE (deterministic given input), not score,
   and saturates at level 3 (~27k) so the game plateaus — infinitely playable.
   The plateau is pinned to the 27-30k experience: past it the course repeats
   that difficulty forever instead of growing further. (Was 10, then 6: both
   left the plateau above what sustained human play can hold — the game must
   end on a mistake, not on the curve outgrowing the player.) */
const dlvl=()=>Math.min(level, levelQ?6:3);

/* ---------- world constants ---------- */
const R = 64;          // tunnel radius (world units)
const BZ = 90;         // bird plane depth
const BIRD_R = 5.5;    // bird collision radius
const FAR = 1900;      // spawn horizon
const GRAV = 300;      // gravity u/s^2
const FLAP = -102;     // flap impulse u/s
const MAXFALL = 230;
const TOPSPD = 416;    // forward-speed ceiling, 20% under the old 520: a run
                       // should end on a mistake, never because terminal
                       // velocity outruns what a human can physically dodge
const DIVE_V = 480;    // swipe-dive plunge speed u/s

/* ---------- persistent ---------- */
let best=0, muted=false, bugs=0, up={}, skin='bird', track='wacky', pace=null;
let stock={}, giftClaimed=false, chalDone=false, chalClaimed=false, chProg=0;
// challenge collect celebration (gift-style bug fountain, no box)
let chalAnim=-1, chalFly=[], chalCount=0, chalPopT=0, chalPos=[0,0], chalRect=null;
let runMaxCombo=0, runMaxStreak=0, runMaxSurf=0, runSpiral=false;
function saveChp(){ try{ localStorage.setItem('fb_chp', JSON.stringify({d:TODAY,p:chProg})); }catch(e){} }
// crash-screen gift box: -1 idle, >=0 animating (claim happens at tap)
let giftAnim=-1, giftFly=[], giftLid=null, giftCount=0, giftPopT=0, giftRect=null;
// onboarding: has this device ever flown, and has swipe-to-swoop been used?
let seenPlay=false, diveUses=0;
try{
  const g=k=>localStorage.getItem(k);
  best = +g('fb_best')||0;
  muted = g('fb_mute')==='1';
  bugs = +g('fb_bugs')||0;
  up = JSON.parse(g('fb_up')||'{}')||{};
  skin = g('fb_skin') || 'bird';
  const tk=g('fb_track');
  track = tk==='gfunk' ? 'gfunk' : tk==='hyper' ? 'hyper' : 'wacky';
  pace = JSON.parse(g('fb_pace_'+seedStr) ?? 'null');
  stock = JSON.parse(g('fb_stock')||'{}')||{};
  giftClaimed = g('fb_gift')===TODAY;
  chalDone = g('fb_chal')===TODAY;
  chalClaimed = g('fb_chalc')===TODAY;
  const chp=JSON.parse(g('fb_chp')||'null');
  chProg = chp&&chp.d===TODAY ? +chp.p||0 : (chalDone?1e9:0);
  if(pace && pace.v!==1 && pace.v!==2) pace=null;   // v1 has score only, v2 adds position
  seenPlay = g('fb_seen')==='1';
  diveUses = +g('fb_dives')||0;
}catch(e){}
function save(){ try{
  localStorage.setItem('fb_best', best);
  localStorage.setItem('fb_mute', muted?'1':'0');
  localStorage.setItem('fb_bugs', bugs);
  localStorage.setItem('fb_up', JSON.stringify(up));
  localStorage.setItem('fb_skin', skin);
  localStorage.setItem('fb_track', track);
  localStorage.setItem('fb_stock', JSON.stringify(stock));
}catch(e){} }

/* ---------- shop catalog ---------- */
const UPG_ORDER=['pedal','surf','star','combo','magnet','net'];
const UPG={
  harness:{name:'HARNESS', tiers:3, cost:[40,90,160], desc:['absorbs 1 hit each run','absorbs 2 hits each run','absorbs 3 hits each run']},
  pedal:  {name:'SLO-MO PEDAL',    tiers:3, cost:[50,90,160], desc:['hold corner: slow time 2s','bigger meter: 3s','huge meter: 4.5s']},
  surf:   {name:'LONGER SURF',     tiers:3, cost:[30,60,110], desc:['surf +0.5s','surf +1.0s','surf +1.5s']},
  star:   {name:'LONGER STAR',     tiers:3, cost:[30,60,110], desc:['star +0.6s','star +1.2s','star +1.8s']},
  combo:  {name:'COMBO MASTERY',   tiers:3, cost:[35,80,150], desc:['combo cap 30','warm start ×5','double combo growth']},
  magnet: {name:'MAGNET BEAK',     tiers:2, cost:[45,100],  desc:['pickups drift to you','stronger pull']},
  net:    {name:'BUG NET',         tiers:2, cost:[25,70],   desc:['wider bug catch','even wider']},
  phoenix:{name:'PHOENIX FEATHER', tiers:2, cost:[200,380], desc:['rise again once per run','rise again twice per run']},
};
const SKINS=[
  {id:'bird',      name:'FLASHY',   cost:0},
  {id:'chick',     name:'CHICK',    cost:150},
  {id:'dragonfly', name:'DRAGONFLY',cost:250},
  {id:'eagle',     name:'EAGLE',    cost:400},
  {id:'ship',      name:'STARSHIP', cost:600},
  {id:'truck',     name:'ICE CREAM',cost:999},
];
const TRACKS=[
  {id:'wacky',  name:'WACKY RIDE', sub:'wah · 128'},
  {id:'hyper',  name:'HYPER RIDE', sub:'hardcore · 142'},
  {id:'gfunk',  name:'WESTSIDE', sub:'g-funk · 92'},
];
/* consumable supplies: bought per charge, spent when used, never refreshed */
const SUPPLIES=[
  {id:'harness', name:'CRASH PADS',  cost:25, pack:5, cap:15, desc:'absorbs 5 hits, then gone'},
  {id:'egg',     name:'PHOENIX EGG', cost:40, pack:1, cap:9,  desc:'one rise, then gone'},
];
/* ---------- debug switchboard: ?debug=reset,max,showmethemoney,poweroverwhelming,silversurfer
   comma-combinable. The persistent ones (reset/max/showmethemoney) apply and
   redirect to a clean URL — unless a runtime flag rides along, which must
   stay in the URL to keep working. ---------- */
const DBG={power:false, surfer:false};
try{
  const q=(new URLSearchParams(location.search).get('debug')||'').toLowerCase();
  if(q){
    const f=q.split(',').map(s=>s.trim());
    let persisted=false;
    if(f.includes('reset')){
      for(const k of Object.keys(localStorage)) if(k.startsWith('fb_')) localStorage.removeItem(k);
      best=0; bugs=0; up={}; stock={}; skin='bird'; track='wacky'; muted=false; pace=null;
      giftClaimed=false; chalDone=false; chalClaimed=false; chProg=0; seenPlay=false; diveUses=0;
      persisted=true;
    }
    if(f.includes('max')){
      for(const k in UPG) up[k]=UPG[k].tiers;
      for(const sp of SUPPLIES) stock[sp.id]=sp.cap;
      save(); persisted=true;
    }
    if(f.includes('showmethemoney')){ bugs+=1000; save(); persisted=true; }
    DBG.power=f.includes('poweroverwhelming');
    DBG.surfer=f.includes('silversurfer');
    if(persisted){
      if(!DBG.power && !DBG.surfer) location.replace(location.pathname);
      else {
        // runtime flags must stay in the URL to keep working, but the
        // persistent ones just applied must NOT re-apply on every reload —
        // rewrite the query to carry only the runtime flags
        const u=new URL(location.href);
        u.searchParams.set('debug', f.filter(x=>x==='poweroverwhelming'||x==='silversurfer').join(','));
        history.replaceState(null,'',u.href);
      }
    }
  }
}catch(e){}
/* daily gift (3-10 bugs) and daily challenge (3-20 bugs) — same for
   everyone worldwide, derived from the UTC date */
let GIFT_AMT=3+hashStr(TODAY+'gift')%8;
const CH_LIST=[
  {id:'combo30', txt:'reach COMBO ×30',              reward:12, goal:30,    cur:()=>runMaxCombo},
  {id:'combo50', txt:'reach COMBO ×50',              reward:20, goal:50,    cur:()=>runMaxCombo},
  {id:'bugs5',   txt:'catch 5 glowbugs in one run',  reward:10, goal:5,     cur:()=>runBugs},
  {id:'streak3', txt:'catch 3 glowbugs in a row',    reward:14, goal:3,     cur:()=>runMaxStreak},
  {id:'dist15k', txt:'fly 15,000 dist in one run',   reward:10, goal:15000, cur:()=>Math.floor(dist)},
  {id:'dist25k', txt:'fly 25,000 dist in one run',   reward:16, goal:25000, cur:()=>Math.floor(dist)},
  {id:'score5k', txt:'score 5,000 in one run',       reward:12, goal:5000,  cur:()=>score},
  {id:'gates25', txt:'thread 25 gates in one run',   reward:12, goal:25,    cur:()=>runGates},
  {id:'surf2',   txt:'stack a DOUBLE SURF',          reward:14, goal:2,     cur:()=>runMaxSurf},
  {id:'spiral',  txt:'ride a spiral (360°)',         reward:8,  goal:1,     cur:()=>runSpiral?1:0},
];
let CHAL=CH_LIST[hashStr(TODAY+'ch')%CH_LIST.length];
// the UTC date is sampled at load but re-checked on every run start and
// whenever the (home-screen) app resumes, so night owls and PWA users
// roll into the new daily tunnel / gift / challenge without a reload
function checkDay(){
  const n=new Date();
  const nd=`${n.getUTCFullYear()}${_pad2(n.getUTCMonth()+1)}${_pad2(n.getUTCDate())}`;
  if(nd===TODAY) return;
  TODAY=nd;
  if(seedMode==='daily'){ seedStr=TODAY; syncUrl(); }
  GIFT_AMT=3+hashStr(TODAY+'gift')%8;
  CHAL=CH_LIST[hashStr(TODAY+'ch')%CH_LIST.length];
  try{
    const g=k=>localStorage.getItem(k);
    giftClaimed = g('fb_gift')===TODAY;
    chalDone = g('fb_chal')===TODAY;
    chalClaimed = g('fb_chalc')===TODAY;
    const chp=JSON.parse(g('fb_chp')||'null');
    chProg = chp&&chp.d===TODAY ? +chp.p||0 : 0;
    pace = JSON.parse(g('fb_pace_'+seedStr) ?? 'null');
    if(pace && pace.v!==1 && pace.v!==2) pace=null;
  }catch(e){}
  giftAnim=-1; giftFly=[]; giftLid=null; chalAnim=-1; chalFly=[];
}
document.addEventListener('visibilitychange',()=>{ if(!document.hidden) checkDay(); });
// entropy here only picks WHICH deterministic tunnel to fly — the course
// itself stays a pure function of the seed string
function randomSeed(){ return 'S'+((Date.now()*2654435761>>>0)%2176782336).toString(36).toUpperCase(); }
function pickSeed(s,mode){
  seedStr=s; seedMode=mode; syncUrl();
  try{
    pace=JSON.parse(localStorage.getItem('fb_pace_'+seedStr) ?? 'null');
    if(pace && pace.v!==1 && pace.v!==2) pace=null;
  }catch(e){ pace=null; }
  reset(); flap();
}
const tier=k=>up[k]||0;
const ownsSkin=id=>id==='bird'||!!up['skin_'+id];
const pedalMax=()=>[0,2,3,4.5][tier('pedal')]||0;
const pedalRegen=()=>[0,0.25,0.35,0.5][tier('pedal')]||0;
const comboCap=()=>[20,30,40,50][tier('combo')];

/* ---------- audio ---------- */
let ac=null, master=null, nextNote=0, noteI=0, unlockEl=null;
function silentWav(){
  // 0.2s of 8-bit mono silence as a WAV data URI
  const sr=8000, n=1600, data=new Uint8Array(44+n), dv=new DataView(data.buffer);
  const wr=(o,s)=>{ for(let i=0;i<s.length;i++) data[o+i]=s.charCodeAt(i); };

  o.connect(g); o2.connect(sc2); sc2.connect(g); g.connect(master);
  o.start(at); o2.start(at); o.stop(at+dur+0.04); o2.stop(at+dur+0.04);
}
function schedGfunk(t0,step,k2,spb){
  const bar=Math.floor(step/8)%8, b=step%8;
  const [root,iv]=GF_CH8[bar];
  const sw=x=> x%2===1 ? t0+spb*0.30 : t0;   // lazy swing on the offbeat 8ths
  const at=sw(b);
  // drums: alternating syncopated kick, backbeat snare, shuffling hats
  const kp = bar%2===0 ? (b===0||b===5) : (b===0||b===3||b===6);
  if(kp) kick(at,0.42);
  if(b===2||b===6) snare(at,0.26);
  hat(at, b%2?0.032:0.02);
  if(b===7 && bar%2===1) hat(at,0.06);
  // walking sub
  if(b===0) gBass(t0, 61.74*Math.pow(2,root/12)*k2, spb*2.6, 0.11);
  if(b===5) gBass(at, 61.74*Math.pow(2,root/12)*2*k2, spb*0.9, 0.07);
  if(b===7) gBass(at, 61.74*Math.pow(2,(root+7)/12)*k2, spb*0.8, 0.06);
  // staccato high piano-chord ostinato in the back half
  if(bar>=4) for(const s of iv) stab(at, 494*Math.pow(2,(root+s)/12)*k2, spb*0.55, 0.016);
  // the whine, phrased lazily with long sustains
  const m=GF_LEAD[step];
  if(m!==undefined){
    const nxt=GF_KEYS.find(k=>k>step) ?? GF_KEYS[0]+64;
    gLead(at, 494*Math.pow(2,m/12)*k2, spb*(nxt-step)*0.9, 0.05);
  }
}

// scheduling runs on its own timer, decoupled from requestAnimationFrame:
// frames do no audio work, and a dropped frame can't glitch the music
let musicTimer=null;
function schedMusic(){
  if(!ac||muted||state!=='play'||ac.state!=='running') return;
  if(nextNote < ac.currentTime) nextNote = ac.currentTime; // no catch-up burst after suspend
  const ahead=ac.currentTime+0.35;
  while(nextNote < ahead){
    const t0=nextNote;
    const k2 = surfT>0?1.25+0.25*surfStack:1;
    // tempo follows the actual forward speed, so a speed reset is audible
    const bpm = track==='hyper' ? 142 + clamp((spd-250)*46/(TOPSPD-250), 0, 46)
              : track==='gfunk' ? 92 + clamp((spd-250)*14/(TOPSPD-250), 0, 14)
                                : 128 + clamp((spd-250)*60/(TOPSPD-250), 0, 60);
    const spb = 60/bpm/2;
    if(track==='hyper'){
      schedHyper(t0, noteI%256, k2, spb);
    } else if(track==='gfunk'){
      schedGfunk(t0, noteI%64, k2, spb);
    } else {
      const step=noteI%32;
      beep(BASS[step%8]*k2, BASS[step%8]*k2, 0.16, 'square', 0.05, t0);
      const m=MEL[step];
      if(m) lead(t0, degFreq(m.d,m.o)*k2, m.s!==undefined?0.32:0.2, m.s, !!m.o);
      if(step===28 && Math.floor(noteI/32)%2===1)  // fill run every other cycle
        for(let i=0;i<4;i++) lead(t0+i*0.05, degFreq(4+i,1)*k2, 0.09, -3, true);
      if(step%4===0) kick(t0);
      else if(step%2===1) hat(t0, 0.03);
    }
    nextNote += spb; noteI++;
  }
}

function rockShape(){
  const n=wirand(7,9), pts=[];
  for(let i=0;i<n;i++){ const a=i/n*TAU; const r=wrand(0.72,1.15); pts.push([Math.cos(a)*r,Math.sin(a)*r]); }
  return pts;
}

/* ---------- spawning (world stream only — no Math.random, no player state) ---------- */
let lastSpawnAt={};   // per-powerup cumulative-distance cooldowns
function spawn(z){
  const wz = dist + z;   // cumulative course position: frame-rate independent
  // powerup generosity ramps with course distance: baseline early, a bump
  // you start to feel around 30k, flat from 60k on. A pure function of
  // course position, so the world stream stays deterministic per seed.
  const gen = clamp((wz-20000)/40000, 0, 1);
  const nmkt = zTrait('market');
  const roll=wrng();
  if(roll<0.80){                                   // OBSTACLE — the pool grows by zone
    // stage ladder: z1 discs · z2 +rotors · z3 +boulders · z4 +sliders ·
    // z5 +iris discs · z6 +elevator doors · z7 +lasers. Deep tunnel
    // graduates on course distance so its stream stays deterministic.
    const stage = levelQ ? levelQ.n : Math.floor(wz/9000)+1;
    const pool=[['gate',40]];
    if(stage>=2) pool.push(['rotor',16]);
    if(stage>=3) pool.push(['rocks',16]);
    if(stage>=4) pool.push(['slider',13]);
    if(stage>=5) pool.push(['iris',13]);
    if(stage>=6) pool.push(['doors',11]);
    if(stage>=7) pool.push(['laser',11]);
    let tot=0; for(const p of pool) tot+=p[1];
    let pick=wrng()*tot, kind2=pool[0][0];
    for(const p of pool){ if((pick-=p[1])<=0){ kind2=p[0]; break; } }
    const shrink = clamp(22 - dlvl()*0.9, 15, 22);
    if(kind2==='gate'){                            // GATE — disc with a spinning hole
      const hr = wrand(shrink, shrink+4);
      // hole orbits as the disc approaches, but lands on an axis (0/90/180/270 deg)
      // exactly at the bird plane; side holes stay near center so hovering threads them
      const quad = wirand(0,3), thf = quad*Math.PI/2;
      // axis holes drift outward as the levels climb (6-36 early, up to
      // 26-52 at the cap) so threading them demands real excursions;
      // side-quad holes stay near center as the breather variant
      const d = quad%2===1 ? wrand(6+dlvl()*2, 36+dlvl()*1.6) : wrand(0, Math.max(4, hr-9));
      const spin = wrand(0.004,0.011)*(wrng()<0.5?-1:1);
      ents.push({type:'gate', z, thf, d, spin, x:Math.cos(thf)*d, y:Math.sin(thf)*d, hr, hue:(hue+wrand(0,120))%360, done:false});
    } else if(kind2==='rotor'){                    // ROTOR — full bar, depth-keyed rotation
      // the bar spans the whole tunnel and the only way through is a gap
      // the size of a gate hole; it rides the rotation on approach and
      // lands on the bird's axis exactly at the plane
      const g = wrand(shrink, shrink+4);
      const af = wrng()<0.5 ? Math.PI/2 : -Math.PI/2;
      const d = wrand(6,40);
      const spin = wrand(0.005,0.012)*(wrng()<0.5?-1:1)*(1+dlvl()*0.04);
      ents.push({type:'bar', z, af, d, g, spin, amp:0, sf:0, th:7, done:false});
    } else if(kind2==='slider'){                   // SLIDER — gap glides along the bar
      // stays on the flap axis, but the gap slides up and down its length
      // and only settles at its true spot at the plane
      const g = wrand(shrink, shrink+4);
      const d = wrand(-38,38);
      const amp = wrand(16,28)*(wrng()<0.5?-1:1);
      const sf = wrand(0.008,0.016)*(1+dlvl()*0.04);
      ents.push({type:'bar', z, af:Math.PI/2, d, g, spin:0, amp, sf, th:7, done:false});
    } else if(kind2==='rocks'){                    // ASTEROIDS — swaying slalom wall
      const slots=[-48,-26,0,26,48], gap1=wirand(0,4);
      let gap2 = wrng()<0.35 ? gap1 : wirand(0,4); // sometimes only ONE fixed gap
      const single = gap2===gap1;
      const rocks=[], w2=wrand(0.9,1.5)+dlvl()*0.05;
      slots.forEach((sy,i)=>{ if(i!==gap1&&i!==gap2) rocks.push({x:wrand(-5,5),y:sy+wrand(-3,3),r:wrand(10.5,13.5),shape:rockShape(),ra:wrand(0,TAU),rs:wrand(-1,1),amp:single?wrand(26,30):wrand(22,28),ph:0}); });
      // evenly staggered sway phases guarantee some rock is always swung
      // clear of the flight column — a moving, unpredictable opening
      const solid=rocks.length;
      rocks.forEach((r,i)=>{ r.ph=i*TAU/solid+wrand(-0.25,0.25); });
      for(let i=0;i<3;i++) rocks.push({x:wrand(24,52)*(wrng()<0.5?-1:1),y:wrand(-50,50),r:wrand(6,10),shape:rockShape(),ra:wrand(0,TAU),rs:wrand(-1.5,1.5),amp:wrand(4,8),ph:wrand(0,TAU),deco:true});
      ents.push({type:'rocks', z, w2, rocks, done:false});
    } else if(kind2==='iris'){                     // IRIS — the hole starts huge and closes
      // the aperture center roams vertically but keeps its horizontal
      // offset within reach of the flight axis — a sideways hole smaller
      // than its offset would be mathematically impassable
      const hr = wrand(shrink, shrink+3);
      const hx2 = wrand(-1,1)*(hr-10), hy2 = wrand(-28,28);
      // it orbits like a gate's hole and lands on its true spot at the
      // plane, so the aperture the collision reads is the one you flew at.
      // pf is the pump's rate PER UNIT OF DEPTH, not per second, so the
      // aperture bottoms out at the plane however fast you are travelling
      const spin = wrand(0.004,0.011)*(wrng()<0.5?-1:1);
      ents.push({type:'iris', z, thf:Math.atan2(hy2,hx2), d:Math.hypot(hx2,hy2), spin, x:hx2, y:hy2, hr, pf:wrand(0.018,0.030), hue:(hue+wrand(180,300))%360, done:false});
    } else if(kind2==='doors'){                    // BLAST DOORS — closing as you arrive
      // the slit sits at top, middle, or bottom and the panels close on
      // approach, reaching their final opening exactly at the plane —
      // reading WHERE the slit is while it is still wide is the challenge
      const g = wrand(shrink, shrink+4)*0.75;
      const band = wirand(0,2);
      const d = (band-1)*28 + wrand(-6,6);
      ents.push({type:'doors', z, d, g, hue:(hue+wrand(0,120))%360, done:false});
    } else {                                       // LASERS — an X pinned to the wall
      // two beams cross on the flight axis: pass above or below the
      // crossing. Emitters ride the wall, the X drifts and slowly spins
      ents.push({type:'laser', z, d:wrand(-20,20), b1:wrand(0.35,0.6), b2:-wrand(0.35,0.6), spin:wrand(0.0015,0.004)*(wrng()<0.5?-1:1), th:5+dlvl()*0.4, amp:wrand(10,18)*(wrng()<0.5?-1:1), sf:wrand(0.005,0.01), done:false});
    }
  } else if(roll<(nmkt?0.82:0.86-0.03*gen)){       // GEM — cedes ground to powerups late
    ents.push({type:'gem', z, x:0, y:wrand(-36,36), seed:wrand(0,9), done:false});
  } else if(roll<(nmkt?0.95:0.92-0.04*gen)){       // GLOWBUG — evasive currency
    ents.push({type:'bug', z, x:0, y:wrand(-30,30), seed:wrand(0,9), ev:0, done:false});
    if(levelQ&&lvlStat&&wz<levelQ.len+BZ-30) lvlStat.bugN++;
  } else {                                         // POWER-UP — static weights + distance cooldowns
    // rarity control moved from player-state sniffing (broke determinism)
    // to per-type course-distance cooldowns; on cooldown it becomes a gem
    const p=wrng();
    let kind='mult';
    if(p<0.26) kind='surf';
    else if(p<0.56) kind='star';
    else if(p<0.65) kind='slow';
    else if(p<0.70) kind='spin';
    else if(p<0.76) kind='buddy';
    const CD={surf:700, star:450, slow:1600, spin:2400, buddy:2000, mult:500};
    // shields must not chain into permanent invincibility: while surfing,
    // course distance flies past at up to 6.9x, so distance cooldowns that
    // shrink late made back-to-back boards routine for maxed players. The
    // surf/star cooldowns grow with the same ramp instead — a fresh board
    // can no longer appear inside the window the previous one covers —
    // while every other powerup still gets more frequent late.
    const cd = kind==='surf' ? CD.surf + 5300*gen
             : kind==='star' ? CD.star + 2550*gen
             : CD[kind]*(1-0.35*gen);
    if(wz - (lastSpawnAt[kind]||-1e9) < cd) kind='gem';
    if(kind==='gem') ents.push({type:'gem', z, x:0, y:wrand(-36,36), seed:wrand(0,9), done:false});
    else { lastSpawnAt[kind]=wz; ents.push({type:kind, z, x:0, y:wrand(-32,32), seed:wrand(0,9), done:false}); if(levelQ&&lvlStat&&kind!=='slow'&&kind!=='spin'&&wz<levelQ.len+BZ-30) lvlStat.puN++; }
  }
}

function burst(x,y,n,h,speed,size){

    parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:rand(0.4,0.9),max:0.9,h:(h+rand(-24,24)+360)%360,sz:rand(0.4,1)*size});
  }
}

function comboSmash(sx,sy){

function gain(pts,label,x,y,h,flat){
  scoreF += flat ? pts : pts*mult; scorePop=1;
  if(label) pop(label+(mult>1&&!flat?' ×'+mult:''), x, y, h, flat?1.4:1);

  }
}

/* ---------- projection ---------- */
function proj(x,y,z){ const k=Fp/z; return [CX+shX+x*k, CY+shY+(y-camY)*k, k]; }
/* tunnel warp: the tube's center line snakes with depth, growing with level
   (capped), but is anchored to zero at the bird plane so gameplay stays fair —
   obstacles drift into alignment as they arrive */
let wPh=0, wAmp=0;
function warpX(z){ const g=Math.min(1,(z-BZ)/500); return wAmp*Math.sin((z-BZ)*0.0045+wPh)*g; }
function warpY(z){ const g=Math.min(1,(z-BZ)/500); return wAmp*0.7*Math.cos((z-BZ)*0.0037+wPh*1.3)*g; }
function projW(x,y,z){ return proj(x+warpX(z), y+warpY(z), z); }

// one protection pool for every death source: per-run harness charges
// burn first, then the permanent crash-pad stock. Returns false when
// nothing is left to spend.
function absorbHit(sx,sy){
  let label;
  if(harnessLeft>0){ harnessLeft--; label='HARNESS!'; }
  else if((stock.harness|0)>0){ stock.harness--; save(); label='CRASH PADS!'; }
  else return false;
  graceT=Math.max(graceT,0.4);
  if(levelQ&&lvlStat) lvlStat.bumps++;
  pop(label,sx,sy-60*SC,30,1.1); sfx.smash(); shake=Math.max(shake,10);
  burst(sx,sy,20,30,320*SC,5*SC);

// dsave: true when the safe opening lay in the direction a swoop travels —
// below the bird normally, above it under TOPSY (drives the swoop hint)
const swoopable=oy=> (oy-bird.y)*diveDir() > 6;
function die(dsave){
  if(starT>0||surfT>0) return;
  if(buddy){
    // the fellow bird swoops into your place — the ride continues
    buddy=false; starT=1.0; starMax=1.0;
    pop('BUDDY TAKES OVER!',CX,CY-120*SC,140,1.5); flashA=Math.max(flashA,0.4); flashHue=140;
    sfx.levelup(); shake=Math.max(shake,12);
    const [px,py]=proj(0,bird.y,BZ); burst(px,py,35,140,380*SC,5*SC);
    return;
  }
  // phoenix no longer auto-triggers: the crash screen offers RISE AGAIN
  // and the player decides whether to spend a feather charge or an egg
  state='dead'; deadT=0;
  crashY=bird.y; crashSwoop=!!dsave;
  if(!chalDone && CHAL.cur()>chProg){ chProg=CHAL.cur(); saveChp(); }
  // freeze boulder sway at the instant of impact so the guilty rock stays put
  for(const en of ents) if(en.type==='rocks') en.tF=t;
  const [bx,by]=proj(0,bird.y,BZ);
  burst(bx,by,70,45,520*SC,7*SC); burst(bx,by,40,0,340*SC,5*SC);
  shake=26; flashA=0.85; flashHue=0; slow=0.65;
  sfx.crash();
  score=Math.floor(scoreF);
  if(score>best){ best=score; }
  save();
  // this run becomes the PB on this seed if it's your best
  if(!levelQ && score>0 && (!pace || score>pace.score)){
    pace={v:2,score,d:Math.round(dist),y:Math.round(bird.y)};
    try{ localStorage.setItem('fb_pace_'+seedStr, JSON.stringify(pace)); }catch(e){}
    pop('TUNNEL PB!',CX,CY+150*SC,190,1.1);
  }
}

// swipe-down dive: plunge to a hover point 20% off the floor, capped at
// half the tunnel per swipe (two swipes from the ceiling reach the floor
// zone). No cooldown — but a swipe inside the bottom 30% aims past the
// wall and slams you into the floor: diving there is a deliberate gamble.
// which way a swoop travels: away from the flap, so under TOPSY — where the
// flap pushes DOWN — the whole move mirrors and the swoop carries you UP
const diveDir=()=> zTrait('topsy')? -1 : 1;

  if(diveUses<3){ diveUses++; try{ localStorage.setItem('fb_dives',diveUses); }catch(e){} }
  const yMax=R-BIRD_R-2, dv=diveDir(), y=bird.y*dv;   // measure in swoop-space
  diveTo = (y > yMax*0.4 ? yMax+BIRD_R : Math.min(yMax*0.6, y+yMax))*dv;
  bird.wing=0;
  beep(300,180,0.4,'sine',0.2);
  const [bx,by]=proj(0,bird.y,BZ);
  burst(bx,by-14*SC*dv,5,(hue+180)%360,150*SC,3*SC);
}

const GAME_URL='https://nusability.github.io/flashybird2/';
let shareRect=null, sharing=false, shareShot=false;
async function doShare(){
  if(sharing) return; sharing=true;
  try{
    // re-render the crash screen without UI prompts, crop the interesting
    // center square, and stamp branding + URL on it
    shareShot=true; render();
    const S=Math.min(W,H)*DPR;

    o.font='900 46px system-ui,sans-serif';

    const blob=await new Promise(r=>off.toBlob(r,'image/png'));
    const seedUrl=GAME_URL+'?seed='+encodeURIComponent(seedStr);
    const text=`🐦🌀 I scored ${score} points in FLASHY BIRD! Can you beat me?`;
    const file=blob && new File([blob],'flashybird-score.png',{type:'image/png'});
    if(file && navigator.canShare && navigator.canShare({files:[file]})){
      await navigator.share({files:[file], title:'FLASHY BIRD', text, url:seedUrl}).catch(()=>{});
    } else if(navigator.share){
      await navigator.share({title:'FLASHY BIRD', text, url:seedUrl}).catch(()=>{});
    } else {
      try{ await navigator.clipboard.writeText(text+' '+seedUrl); pop('LINK COPIED!',CX,CY+190*SC,140,1); }catch(e){}
      if(blob){ const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='flashybird-score.png'; a.click(); }

}


/* ================= ZONES: identity, levels, map ================= */
/* zone identity: everything derives from hash(zone number) — themes,
   palette variant, maze, name. Nothing is stored but progress. */
const ziCache={};
function zoneInfo(n){
  if(ziCache[n]) return ziCache[n];
  const r=mulberry32(hashStr('zone'+n));
  const TH=THEMES[(r()*THEMES.length)|0];
  const pal=(r()*TH.palettes.length)|0;
  return ziCache[n]={n, TH, pal, P:TH.palettes[pal]};
}
function hexA(hex,a){ const v=parseInt(hex.slice(1),16);
  return 'rgba('+(v>>16)+','+((v>>8)&255)+','+(v&255)+','+a+')'; }


/* ---------------- zone traits: the variants ----------------
   Deterministic per zone, budget grows slowly, banned pairs stay fair.
   Traits carry late-game difficulty so the raw curve can stay gentle. */
const ZTRAITS={
  pulse:   {name:'PULSE',        desc:'the tunnel breathes'},
  wobble:  {name:'WOBBLE',       desc:'the tunnel snakes hard'},
  swarm:   {name:'SWARM',        desc:'obstacles hunt in packs'},
  market:  {name:'NIGHT MARKET', desc:'glowbugs everywhere'},
  sticky:  {name:'STICKY',       desc:'rocks creep toward you'},
  skittish:{name:'SKITTISH',     desc:'loot flees — magnet beats it'},
  wind:    {name:'CROSSWIND',    desc:'gusts shove the bird'},
  blackout:{name:'BLACKOUT',     desc:'fly by headlight'},
  topsy:   {name:'TOPSY',        desc:'gravity flipped — flaps push DOWN', min:10},
  phantom: {name:'PHANTOM',      desc:'obstacles fade in waves — near ones stay lit'},
};
const ZBAN=[['blackout','wind'],['blackout','swarm'],['blackout','sticky'],['blackout','phantom']];
function zoneTraits(n){
  const b = n<3?0 : n<12?1 : n<30?2 : 3;
  const keys=Object.keys(ZTRAITS), r=mulberry32(hashStr('traits'+n));
  const out=[]; let guard=0;
  while(out.length<b && guard++<40){
    const k=keys[(r()*keys.length)|0];
    if(out.includes(k)) continue;
    if((ZTRAITS[k].min||0)>n) continue;       // harsh twists wait for later zones
    if(ZBAN.some(p=>(k===p[0]&&out.includes(p[1]))||(k===p[1]&&out.includes(p[0])))) continue;
    out.push(k);
  }
  return out;
}
function zTrait(k){ return !!(levelQ&&levelQ.traits&&levelQ.traits.includes(k)); }

try{ const z=JSON.parse(localStorage.getItem('fb_zp')||'null'); if(z&&z.cur) ZP=z; }catch(e){}

}

/* level recipe: bounded runs; difficulty/speed/length from the level index */
function startLevel(n,k,x2){
  const idx=(n-1)*7+(k-1);
  levelQ={ n, k, x2:!!x2,
    diff: Math.min(6, Math.floor(idx/14)),
    spd0: Math.min(360, 250+idx*1.0),
    len:  Math.min(12500, 8000+idx*50),
    traits: zoneTraits(n),
    seed: 'zone'+n+'-'+k+(x2?'-x2':'') };
  if(prevSeed===null) prevSeed=seedStr;
  seedStr=levelQ.seed;
  pace=null; paceBeat=true;   // tunnel PB is a deep-tunnel concept — levels use stars
  reset();
}
function levelDone(){
  score=Math.floor(scoreF);
  const colTot=lvlStat.puN+lvlStat.bugN, colGot=lvlStat.puGot+lvlStat.bugGot;
  // forgiving at small totals: missing a single item never voids the loot
  // star; at scale the 90% rule governs. Loot and flawless are independent
  // stars, so a flawless run always shows.
  const colOK = colTot===0 || (colTot-colGot)<=1 || colGot>=colTot*0.9;
  lvlStars = 1 + (colOK?1:0) + (lvlStat.bumps===0?1:0);
  doneT=0; state='done';
  sfx.levelup(); flashA=Math.max(flashA,0.5); flashHue=130; shake=Math.max(shake,10);
  const arr=zStars(levelQ.n).slice(); ZP.stars[levelQ.n]=arr;
  if(lvlStars>arr[levelQ.k-1]){ ZP.total+=lvlStars-arr[levelQ.k-1]; arr[levelQ.k-1]=lvlStars; }
  if(levelQ.x2){ ZP.cur=Math.max(ZP.cur,levelQ.n+1); ZP.lvl=1; }
  else if(levelQ.n===ZP.cur && levelQ.k===ZP.lvl){
    if(levelQ.k===7){ ZP.cur=levelQ.n+1; ZP.lvl=1; } else ZP.lvl=levelQ.k+1;
  }
  saveZP();
}
function exitToMap(){
  levelQ=null; lvlStat=null;
  if(prevSeed!==null){ seedStr=prevSeed; prevSeed=null; }
  try{ pace=JSON.parse(localStorage.getItem('fb_pace_'+seedStr) ?? 'null'); }catch(e){ pace=null; }
  if(pace && pace.v!==1 && pace.v!==2) pace=null;
  paceBeat=false;
  state='map'; mpSnapCur();
}

/* the finish line: a checkered gate spanning the tunnel, riding the warp
   like every obstacle, with a FINISH banner floating in its mouth */
function drawFinish(zz){
  const a=clamp(1.9-zz/900,0.2,1), rot=t*0.5, segs=28;
  ctx.lineCap='butt';
  for(let band=0;band<2;band++){
    const rr=R-2-band*7;
    for(let i=0;i<segs;i++){
      const a0=rot+i/segs*TAU, a1=rot+(i+1)/segs*TAU+0.004;
      const [x0,y0]=projW(Math.cos(a0)*rr,Math.sin(a0)*rr,zz);
      const [x1,y1,k]=projW(Math.cos(a1)*rr,Math.sin(a1)*rr,zz);
      const white=(i+band)%2===0;

      ctx.strokeStyle=white?`rgba(255,255,255,${a})`:`rgba(8,8,18,${a*0.95})`;
      ctx.lineWidth=Math.max(2,7*k);
      ctx.beginPath(); ctx.moveTo(x0,y0); ctx.lineTo(x1,y1); ctx.stroke();
    }
  }
  ctx.shadowBlur=0; ctx.lineCap='round';
  const [cx2,cy2,k2]=projW(0,0,zz);

  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.shadowColor=`hsl(${(t*130)%360},100%,60%)`; ctx.shadowBlur=16*SC*a;
  ctx.fillStyle=`rgba(255,255,255,${a})`;

}

// the level-clear buttons arm on pointerdown and fire on pointerup, so the
// pill actually shows its pressed state (and a slide-off cancels)
function doneArm(x,y){
  const inR=r=> r&&x>=r[0]&&x<=r[0]+r[2]&&y>=r[1]&&y<=r[1]+r[3];
  if(inR(doneRetryRect)) return {act:'dretry', r:doneRetryRect};
  if(inR(doneMapRect))   return {act:'dmap',   r:doneMapRect};
  if(inR(doneNextRect))  return {act:'dnext',  r:doneNextRect};
  // once the celebration has played out, a tap anywhere means "carry on"
  if(doneT>0.6) return {act:'dnext', r:[0,0,W,H]};
  return null;
}
function doneFire(act){
  const q=levelQ; if(!q) return;
  if(act==='dretry'){ startLevel(q.n, q.k, q.x2); return; }
  if(act==='dmap'){ exitToMap(); return; }
  if(q.x2 || q.k===7){ exitToMap(); }
  else startLevel(q.n, q.k+1, false);
}
/* ---------------- the map's two orientations ----------------
   Every zone is authored in ONE cell — 390 across, 720 along, entry at the
   bottom, exit at the top — and that authored geometry never changes. What
   changes is how a cell point reaches the screen: portrait maps it straight
   through, landscape rotates it, so the labyrinth runs left to right and the
   whole strip scrolls sideways. Positions go through the map; artwork is
   drawn after it, upright, so nothing ends up lying on its side.
   ACROSS is the axis the zone is narrow on (screen x in portrait, screen y in
   landscape); ALONG is the axis it runs down. */
const mpLand=()=>W>H;
const mpCX=(x,y)=> mpLand()? G.ZONE_H-y : x;      // cell point -> canvas x
const mpCY=(x,y)=> mpLand()? x : y;               // cell point -> canvas y
const mpDir=a=> mpLand()? a+Math.PI/2 : a;        // a path heading, mapped
const mpAlongOf=(x,y)=> mpLand()? G.ZONE_H-y : y; // how far along the run a point sits
const mpCrossPx=()=> mpLand()? H : W;             // screen px across the strip
const mpAlongPx=()=> mpLand()? W : H;             // screen px along the run
/* scale: fit the strip's 390 across, never magnifying past the size the map
   has on the widest phone held upright, so elements keep their portrait size
   in both orientations and only the run length on screen changes. */
function mpS0(){ return Math.min(mpCrossPx()/G.UNIT_W, 1.1); }
function mpOff(){ return (mpCrossPx()-G.UNIT_W*mpS0())/2; }   // screen px, across
function mpPad(){ return mpOff()/mpS0(); }                    // cell units per side
const mpViewLen=()=> mpAlongPx()/mpS0();          // cell units visible along the run
// translate into a zone's cell frame, along whichever axis the run uses
function mpOrgTr(org){ const d=org-mpCam; if(mpLand()) ctx.translate(d,0); else ctx.translate(0,d); }
/* Theme packs place their own critters and overlays: they read G.UNIT_W for
   the cell's width and use the span they are handed as its height. Landscape
   turns the cell on its side, so for the length of those calls they are told
   the shape it now has — 720 across by 390 tall — and everything they draw
   lands inside the strip, upright, without any pack having to know. */
const themeSpan=()=> mpLand()? G.UNIT_W : G.ZONE_H;
function themeCell(fn){
  if(!mpLand()) return fn();
  const uw=G.UNIT_W; G.UNIT_W=G.ZONE_H;
  try{ fn(); } finally{ G.UNIT_W=uw; }
}
/* the zone plate sits at the TOP of its zone, above the maze's top lane —
   title first, its TWIST line under it, both inside PLATE_H of tap band */
const PLATE_Y=25, PLATE_TRAIT_Y=40, PLATE_H=52;
/* Where the plate sits inside its zone's frame, as a canvas point. Portrait
   puts it at the head of the cell and lets it stick to the screen once that
   head scrolls past, the way a section header does. Landscape has no head on
   screen to speak of — the run is sideways — so the plate rides the top-left
   of the view at a fixed inset, clamped to stay inside its own zone. */
function mpPlateAt(top){
  // far enough into the run that the title clears the SOUND corner button
  if(mpLand()) return [clamp(mpCam-top+330, 150, G.ZONE_H-150), 26];
  return [G.UNIT_W*G.PORT_X, clamp(Math.max(PLATE_Y, mpCam-top+18), PLATE_Y, G.ZONE_H-30)];
}
const mpPlatePinned=top=> mpLand() || mpPlateAt(top)[1]>PLATE_Y+0.5;
function mpOnPlate(top,ux,ly){
  const [pa,pb]=mpPlateAt(top);
  return mpLand()? Math.abs(ux-pb)<PLATE_H/2 && Math.abs((G.ZONE_H-ly)-pa)<120
                 : Math.abs(ly-pb)<PLATE_H/2;
}

/* ---------------- the zone map ---------------- */
const mpMazeCache={}, mpDressCache={};
function mpMaze(n){
  if(mpMazeCache[n]) return mpMazeCache[n];
  const rng=mulberry32(0xA7E^(n*2654435761));
  const cx=G.UNIT_W*G.PORT_X, rowH=(G.ZONE_H-G.MAZE.topLane-60)/G.MAZE.rows;
  const pts=[[cx,G.ZONE_H+50]]; let x=cx; const nodes=[];
  for(let k=1;k<=G.MAZE.rows;k++){
    const y=G.ZONE_H-60-(k-1)*rowH-rowH*0.5;
    let nx,guard=0;
    do{ nx=G.MAZE.xMin+rng()*(G.MAZE.xMax-G.MAZE.xMin); }
    while(Math.abs(nx-x)<G.MAZE.minRun&&guard++<20);

function mpPath(mz,dist2){
  const lut=mz.lut;
  let lo=0,hi=lut.length-1;
  while(lo<hi){ const mid=(lo+hi)>>1; lut[mid].cum<dist2?lo=mid+1:hi=mid; }
  const b=lut[lo], a=lut[Math.max(0,lo-1)];
  const f=(a.cum===b.cum)?0:(dist2-a.cum)/(b.cum-a.cum);
  return {x:lerp(a.x,b.x,f), y:lerp(a.y,b.y,f), ang:a.ang+((b.ang-a.ang+Math.PI*3)%TAU-Math.PI)*f};
}

// the rect — that's what makes the pressed state actually visible, and lets

// pedal stay instant.

function claimGift(){
  if(giftClaimed) return;

  // mid-animation — the show that follows is pure feedback
  giftClaimed=true; bugs+=GIFT_AMT;
  try{ localStorage.setItem('fb_gift',TODAY); }catch(e2){}
  save();
  giftAnim=0; giftCount=0; giftFly=[]; giftLid=null;

  if(!chalDone || chalClaimed) return;
  chalClaimed=true; bugs+=CHAL.reward;
  try{ localStorage.setItem('fb_chalc',TODAY); }catch(e2){}
  save();
  chalPos=[CX, H-chalBandH()-SAFE_B-40*uiS()];
  chalAnim=0; chalCount=0; chalFly=[];
  burst(chalPos[0],chalPos[1],36,60,400*SC,5*SC);
  burst(chalPos[0],chalPos[1],22,95,320*SC,4*SC);
  flashA=Math.max(flashA,0.35); flashHue=80; shake=Math.max(shake,8);
  sfx.levelup();
  for(let i=0;i<CHAL.reward;i++){
    const a=-Math.PI/2 + (i/(CHAL.reward-1||1)-0.5)*2.6;
    chalFly.push({d:0.05+i*0.07, t:0, x:chalPos[0], y:chalPos[1],

function fireBtn(act){
  if(act==='mute'){ muted=!muted; save(); applyMute(); return; }
  if(act==='dnext'||act==='dretry'||act==='dmap'){ doneFire(act); return; }
  if(act==='god'){ if(state==='play') endGodMode(); return; }
  if(act==='zmap'){ exitToMap(); return; }
  if(state==='shop') return;   // the screen changed under the press
  if(act==='nest') openShop();
  else if(act==='today') pickSeed(TODAY,'daily');
  else if(act==='rand') pickSeed(randomSeed(),'custom');
  else if(act==='rise' && state==='dead'){
    if(phoenixLeft>0){ phoenixLeft--; revive('PHOENIX!'); }
    else if((stock.egg|0)>0){ stock.egg--; save(); revive('PHOENIX EGG!'); }
  }
  else if(act==='share') doShare();
  else if(act==='gift') claimGift();
  else if(act==='chal') claimChal();
}

    const mr = muteRect || [0,0,64,64];
    if(inR(mr)){ arm('mute',mr); return; }

  }
  if(state==='play' && DBG.power && inR(dbgPowerRect)){ arm('god',dbgPowerRect); return; }

    if(inR(nestRect))  return arm('nest',nestRect);

// input runs on pointer events so no click handlers are lost.
