/* ---------- update ---------- */
function update(dt){
  // slo-mo pedal: held + meter -> half speed; meter drains in real time.
  // an empty meter LOCKS the pedal: holding through depletion must not
  // sip the regen as it trickles in — you have to lift off and let it
  // rebuild to half a second before it engages again
  const pedalActive = pedalOn && !pedalLock && pedalT>0 && state==='play' && tier('pedal')>0;
  if(state==='play' && tier('pedal')>0){
    if(pedalActive){ pedalT=Math.max(0,pedalT-dt); if(pedalT===0) pedalLock=true; }
    else pedalT=Math.min(pedalMax(), pedalT+pedalRegen()*dt);
    if(pedalLock && !pedalOn && pedalT>=0.5) pedalLock=false;
  }
  const ts = (slow>0 ? 0.25 : 1)*(pedalActive?0.5:1);
  slow = Math.max(0, slow-dt);
  viewT = Math.max(0, viewT-dt);   // real-time duration
  const d = dt*ts;
  t += d;

  // hypnotic drift
  hue = (hue + (36+level*4)*d) % 360;
  // deterministic hypnosis: two superposed sines at incommensurate
  // frequencies plus a slow constant drift — smooth, quasi-periodic,
  // never exactly repeating (no RNG involved)
  rot = t*0.15 + 2.9*Math.sin(t*0.31) + 1.6*Math.sin(t*0.127+2);
  twist = 0.006*Math.sin(t*0.21) + 0.005*Math.sin(t*0.093+1.3);
  wPh += (0.4+0.12*dlvl())*(zTrait('wobble')?1.7:1)*d;
  // steeper than the original 4.5/level: ~2x the wobble by dist 10k,
  // capped a little higher so deep runs get properly disorienting
  wAmp = Math.min(zTrait('wobble')?60:44, (dlvl()*9 + Math.min(6, t*0.1))*(zTrait('wobble')?1.6:1));

  shake *= Math.pow(0.001,dt); if(shake<0.3) shake=0;
  shX=rand(-1,1)*shake*SC; shY=rand(-1,1)*shake*SC;
  flashA=Math.max(0,flashA-dt*2.2);
  scorePop=Math.max(0,scorePop-dt*3);
  shopMsgT=Math.max(0,shopMsgT-dt*0.7);
  if(state==='play') hintT=Math.max(0,hintT-dt);
  camY = lerp(camY, bird.y*0.35, 1-Math.pow(0.001,dt));

  const surfing = surfT>0;
  const advSpd = state==='play' ? spd*(surfing?Math.pow(1.9,surfStack):1) : 90;
  const adv = advSpd*(state==='play'&&zTrait('pulse') ? 1+Math.sin(t*1.2)*0.3 : 1)*d;
  // the telegraph voices ride the same gates their visuals do, one shot per
  // window: pulse speaks as the surge turns, crosswind as the gust turns
  if(state==='play' && zTrait('pulse')){
    const pc=Math.cos(t*1.2), pI=(Math.abs(pc)-0.35)/0.65;
    // pc>0 is the tunnel breathing OUT (field spreading, speed ramping up) —
    // elongation, so it takes the falling/disengage half of the voice
    if(pI>0.02){ if(!pulseVoiced){ pulseVoiced=true; sfx.surge(pc<0); } }
    else pulseVoiced=false;
  } else pulseVoiced=false;

  // stars always move
  for(const s of stars){ s.z-=adv*0.85; if(s.z<BZ+8){ s.z+=FAR-BZ; s.x=rand(-260,260); s.y=rand(-260,260);} }
  if(!(state==='play' && zTrait('wind'))) windVoiced=false;
  if(state==='play' && zTrait('wind')){
    const wc=Math.cos(t*0.55), wI=(Math.abs(wc)-0.35)/0.65;
    // wc>0 is the gust ramping DOWNWARD (the dust chevrons point down here),
    // so that half falls and the other half rises — same air, mirrored
    if(wI>0.02){ if(!windVoiced){ windVoiced=true; sfx.gust(wc<0); } }
    else windVoiced=false;
    const wv=Math.sin(t*0.55)*85;
    for(const p of WDUST){
      p.z-=adv*0.9; p.y+=wv*1.3*d;
      if(p.z<BZ+6){ p.z+=1250-BZ; p.x=rand(-52,52); p.y=rand(-56,56); }
      if(p.y>60) p.y-=120; else if(p.y<-60) p.y+=120;
    }
  }

  if(state==='play'){
    if(DBG.power) starT=Math.max(starT,1.5);   // ?debug=poweroverwhelming
    dist += adv;
    if(levelQ && !levelQ.warned && levelQ.len-dist<1500){
      levelQ.warned=true;
      pop('FINISH AHEAD!',CX,CY-170*SC,130,1.3);
      beep(880,1320,0.3,'sine',0.2);
    }
    if(levelQ && dist>=levelQ.len && state==='play') levelDone();
    spd = Math.min(TOPSPD, spd + 0.84*d);   // slow creep to a hard ceiling
    scoreF += (14+level*2)*mult*d;

    // level comes from distance, not score: deterministic given input,
    // so the course difficulty is identical for everyone on a seed
    const lv = Math.floor(dist/9000);
    if(!levelQ && lv>level){ level=lv; pop(level<=10?'SPEED UP!':'LEVEL UP!',CX,CY-170*SC,(hue+60)%360,1.5); flashA=Math.max(flashA,0.3); flashHue=hue; sfx.levelup(); shake=Math.max(shake,8); }
    // pace recording: score sampled on the fixed clock
    // daily challenge auto-completes the moment its condition is met
    runMaxCombo=Math.max(runMaxCombo,combo);
    runMaxStreak=Math.max(runMaxStreak,runBugStreak);
    runMaxSurf=Math.max(runMaxSurf,surfStack);
    if(viewT>0) runSpiral=true;
    if(!chalDone && CHAL.cur()>=CHAL.goal){
      // completion only marks it done - the reward waits as a collect
      // badge on the title/crash screens (gift-style celebration)
      chalDone=true;
      try{ localStorage.setItem('fb_chal',TODAY); }catch(e){}
      chProg=CHAL.goal; saveChp();
      pop('CHALLENGE COMPLETE!',CX,CY-140*SC,95,1.5);
      flashA=Math.max(flashA,0.35); flashHue=95; sfx.levelup();
    }
    if(pace && !paceBeat && score>pace.score){
      paceBeat=true;
      pop('TUNNEL PB BEATEN!',CX,CY-170*SC,150,1.6); flashA=Math.max(flashA,0.35); flashHue=150; sfx.levelup();
    }

    // snapshot protection BEFORE the timers tick: this frame's advance was
    // computed at surf speed, so crossings this frame must be judged by the
    // state the frame started in — otherwise expiry retroactively unprotects
    // a band of tunnel already traversed at up to 6.9x speed
    const shield0 = surfT>0 || starT>0;
    surfT=Math.max(0,surfT-d); if(surfT<=0) surfStack=0;
    starT=Math.max(0,starT-d);
    // 0.25s grace after protection expires: can't die, but obstacle hits
    // pass through silently — no points, no sound
    graceT=Math.max(0,graceT-d);
    if(shield0 && surfT<=0 && starT<=0) graceT=0.25;
    if(multT>0){ multT-=d; if(multT<=0) mult=1; }

    // bird physics (an active swipe-dive overrides gravity until it lands)
    if(diveTo!==null){
      const dv=diveDir();
      bird.vy = DIVE_V*dv;
      bird.y += bird.vy*d;
      if(bird.y*dv>=diveTo*dv){ bird.y=diveTo; bird.vy=0; diveTo=null; }
    } else {
      const gd = zTrait('topsy')?-1:1;
      bird.vy = clamp(bird.vy + gd*(GRAV + (zTrait('wind')?Math.sin(t*0.55)*85:0))*d, -MAXFALL, MAXFALL);
      bird.y += bird.vy*d;
    }
    bird.wing = Math.max(0, bird.wing - d*5);
    if(Math.abs(bird.y) > R-BIRD_R-2){
      bird.y=clamp(bird.y,-(R-BIRD_R-2),R-BIRD_R-2); diveTo=null;
      if(shield0||starT>0||surfT>0||graceT>0){ bird.vy*= -0.4; if(levelQ&&lvlStat) lvlStat.bumps++; }
      else { const [wx,wy]=proj(0,bird.y,BZ); if(absorbHit(wx,wy)){ bird.vy*= -0.4; } else die(diveDir()>0 ? bird.y<0 : bird.y>0); }
    }
    trail.unshift(bird.y); if(trail.length>14) trail.length=14;

    // entities (same-frame pickups still protect via the live check)
    const inv = shield0 || starT>0 || surfT>0;
    for(const e of ents){
      const pz=e.z; e.z-=adv;
      if(e.type==='rocks') for(const r of e.rocks) r.ra+=r.rs*d;
      if(zTrait('sticky') && e.type==='rocks' && e.z<700)
        for(const r of e.rocks) if(!r.deco) r.y += clamp(bird.y-r.y,-1,1)*7*d;
      if(e.type==='bug' && e.z<420){
        // glowbugs dodge away from the bird — unless the magnet beak pulls harder
        const cur=e.y+e.ev, mr=tier('magnet')*15;
        if(mr && Math.abs(cur-bird.y)<mr) e.ev += (bird.y-cur)*1.1*d;
        else e.ev = clamp(e.ev + Math.sign(cur-bird.y||1)*26*d, -18, 18);
      }
      else if(zTrait('skittish') && !tier('magnet') && (e.type==='gem'||e.type==='surf'||e.type==='star'||e.type==='mult') && e.z<320){
        e.y = clamp(e.y + Math.sign(e.y-bird.y||1)*26*d, -42, 42);
      }
      else if(tier('magnet') && (e.type==='gem'||e.type==='surf'||e.type==='star'||e.type==='mult') && e.z<240){
        e.y = lerp(e.y, bird.y, 1-Math.pow(0.67,d*tier('magnet')));
      }
      if(!e.done && pz>BZ && e.z<=BZ){
        e.done=true;
        const [sx,sy]=proj(0,bird.y,BZ);
        if(e.type==='gate'||e.type==='iris'){
          const dd=Math.hypot(0-e.x, bird.y-e.y);
          if(dd < e.hr-BIRD_R*0.55){
            combo += tier('combo')>=3?2:1; runGates++;
            gain(25+Math.min(combo,comboCap())*10, '+'+((25+Math.min(combo,comboCap())*10)*mult), sx, sy-60*SC, e.hue);
            sfx.ding(combo);
            burst(sx,sy,12,e.hue,240*SC,4*SC);
            if(e.hr-dd < 7){ gain(15,'CLOSE!',sx,sy-100*SC,55,0); sfx.close(); }
          } else if(inv){
            gain(12,'SMASH!',sx,sy-60*SC,e.hue); if(levelQ) lvlStat.bumps++; comboSmash(sx,sy); sfx.smash(); burst(sx,sy,30,e.hue,420*SC,6*SC); shake=Math.max(shake,10);
          } else if(graceT>0){ /* silent grace pass-through */ }
          else if(absorbHit(sx,sy)){}
          else die(swoopable(e.y));
        }
        else if(e.type==='bar'){
          // bar lands vertical (aligned with the flap axis); the bird's
          // signed position along the gap arm decides gap vs metal
          const sPos = bird.y*Math.sin(e.af);
          const off = Math.abs(sPos - e.d);
          if(off < e.g - BIRD_R*0.55){
            combo++; gain(15,null,sx,sy,0); sfx.ding(combo);
            if(e.g - off < 7){ gain(15,'CLOSE!',sx,sy-100*SC,55,0); sfx.close(); }
          }
          else if(inv){ gain(10,'ZAP!',sx,sy-60*SC,10); if(levelQ) lvlStat.bumps++; comboSmash(sx,sy); sfx.smash(); burst(sx,sy,24,10,380*SC,5*SC); }
          else if(graceT>0){ /* silent */ }
          else if(absorbHit(sx,sy)){}
          else die(swoopable((Math.sin(e.af)>0?1:-1)*e.d));
        }
        else if(e.type==='doors'){
          // panels are wall-to-wall: only the slit at e.d lets you through
          const off = Math.abs(bird.y - e.d);
          if(off < e.g - BIRD_R*0.55){
            combo++; gain(15,null,sx,sy,0); sfx.ding(combo);
            if(e.g - off < 7){ gain(15,'CLOSE!',sx,sy-100*SC,55,0); sfx.close(); }
          }
          else if(inv){ gain(10,'CLANG!',sx,sy-60*SC,210); if(levelQ) lvlStat.bumps++; comboSmash(sx,sy); sfx.smash(); burst(sx,sy,24,210,380*SC,5*SC); }
          else if(graceT>0){ /* silent */ }
          else if(absorbHit(sx,sy)){}
          else die(swoopable(e.d));
        }
        else if(e.type==='laser'){
          // both beams cross at (0, e.d): clearance is vertical distance
          // from the crossing, scaled by each beam's slope
          let lHit=false, lClose=false;
          for(const b0 of [e.b1,e.b2]){
            const dd=Math.abs(bird.y-e.d)*Math.cos(b0);
            if(dd < e.th + BIRD_R*0.55) lHit=true;
            else if(dd < e.th + BIRD_R + 6) lClose=true;
          }
          if(!lHit){
            combo++; gain(15,null,sx,sy,0); sfx.ding(combo);
            if(lClose){ gain(15,'CLOSE!',sx,sy-100*SC,55,0); sfx.close(); }
          }
          else if(inv){ gain(10,'ZAP!',sx,sy-60*SC,350); if(levelQ) lvlStat.bumps++; comboSmash(sx,sy); sfx.smash(); burst(sx,sy,24,350,380*SC,5*SC); }
          else if(graceT>0){ /* silent */ }
          else if(absorbHit(sx,sy)){}
          else die(swoopable(e.d));
        }
        else if(e.type==='rocks'){
          let hit=false, close=false;
          for(const r of e.rocks){
            if(r.deco) continue;
            const rx=r.x+Math.sin(t*e.w2+r.ph)*r.amp;
            const dd=Math.hypot(rx, bird.y-r.y);
            if(dd < r.r+BIRD_R*0.8) hit=true;
            else if(dd < r.r+BIRD_R+6) close=true;
          }
          if(hit){
            if(inv){ gain(12,'SMASH!',sx,sy-60*SC,280); if(levelQ) lvlStat.bumps++; comboSmash(sx,sy); sfx.smash(); burst(sx,sy,30,280,420*SC,6*SC); shake=Math.max(shake,10); }
            else if(graceT>0){ /* silent */ }
            else if(absorbHit(sx,sy)){}
            else die([-48,-26,0,26,48].some(sy2=> swoopable(sy2) && e.rocks.every(r=> r.deco || Math.abs(r.y-sy2)>8)));
          }
          else { combo++; gain(15,null,sx,sy,0); sfx.ding(combo); if(close){ gain(15,'CLOSE!',sx,sy-100*SC,55,0); sfx.close(); } }
        }
        else if(e.type==='gem'){
          if(Math.hypot(0-e.x,bird.y-e.y) < 14+BIRD_R){ gain(50,'+'+(50*mult),sx,sy-60*SC,170); sfx.gem(); burst(sx,sy,18,170,300*SC,4*SC); }
        }
        else if(e.type==='bug'){
          const bx2=e.x+Math.sin(t*4+e.seed)*10, by2=e.y+e.ev+Math.sin(t*3.1+e.seed*2)*8;
          if(Math.hypot(bx2, bird.y-by2) < 7+3*tier('net')+BIRD_R){
            bugs++; runBugs++; runBugStreak++; save(); if(levelQ) lvlStat.bugGot++;
            gain(10,'+1 BUG',sx,sy-60*SC,95,true);
            beep(1700,2600,0.12,'sine',0.2); beep(2200,2200,0.06,'triangle',0.12);
            burst(sx,sy,10,95,220*SC,3*SC);
          } else { runBugStreak=0; pop('ESCAPED!',sx,sy-40*SC,95,0.7); }
        }
        else if(e.type==='surf'){
          if(Math.hypot(0-e.x,bird.y-e.y) < 15+BIRD_R){
            if(levelQ) lvlStat.puGot++;
            surfStack=Math.min(3,(surfT>0?surfStack:0)+1);
            surfT=surfMax=[4.5,3.4,2.6][surfStack-1]+0.5*tier('surf');   // higher stacks burn faster
            const names=['SILVER SURF!','DOUBLE SURF!!','TRIPLE SURF!!!'];
            gain(40*surfStack, names[surfStack-1], sx, sy-60*SC, 210, 0);
            sfx.power(); flashA=Math.max(flashA,0.3+0.1*surfStack); flashHue=210;
            burst(sx,sy,25+15*surfStack,210,(350+120*surfStack)*SC,5*SC);
            shake=Math.max(shake,4*surfStack);
          }
        }
        else if(e.type==='star'){
          if(Math.hypot(0-e.x,bird.y-e.y) < 15+BIRD_R){ if(levelQ) lvlStat.puGot++; starT=starMax=4.2+0.6*tier('star'); gain(40,'INVINCIBLE!',sx,sy-60*SC,55,0); sfx.power(); flashA=Math.max(flashA,0.35); flashHue=55; burst(sx,sy,30,55,400*SC,5*SC); }
        }
        else if(e.type==='mult'){
          if(Math.hypot(0-e.x,bird.y-e.y) < 15+BIRD_R){ if(levelQ) lvlStat.puGot++; mult=Math.min(8,mult*2); multT=8; gain(30,'×'+mult+' MULTIPLIER!',sx,sy-60*SC,320,0); sfx.power(); flashA=Math.max(flashA,0.3); flashHue=320; }
        }
        else if(e.type==='buddy'){
          if(Math.hypot(0-e.x,bird.y-e.y) < 15+BIRD_R){
            if(levelQ) lvlStat.puGot++;
            if(!buddy){
              buddy=true;
              gain(40,'BUDDY!',sx,sy-60*SC,140,0); sfx.power();
              flashA=Math.max(flashA,0.3); flashHue=140; burst(sx,sy,25,140,350*SC,5*SC);
            } else { gain(100,'+100',sx,sy-60*SC,140,true); sfx.gem(); }
          }
        }
        else if(e.type==='slow'){
          // paid mercy: reset to starting pace, ramps up again normally — costs points
          if(surfT<=0 && Math.hypot(0-e.x,bird.y-e.y) < 8+BIRD_R){
            spd=250; scoreF=Math.max(0,scoreF-2999); scorePop=1;
            pop('SLOW DOWN!',sx,sy-100*SC,195,1); pop('-2999',sx,sy-60*SC,0,1.3);
            beep(1400,250,0.5,'sine',0.24); flashA=Math.max(flashA,0.3); flashHue=195;
          }
        }
        else if(e.type==='spin'){
          // devil's bargain: small and dodgeable, big flat payout for 10s of chaos
          if(surfT<=0 && Math.hypot(0-e.x,bird.y-e.y) < 8+BIRD_R){
            viewT=10; gain(4999,'+4999!',sx,sy-100*SC,130,true);
            pop('360°!!!',sx,sy-60*SC,300,1.4);
            sfx.power(); beep(150,2400,0.7,'sawtooth',0.18); flashA=Math.max(flashA,0.45); flashHue=300; shake=Math.max(shake,12);
          }
        }
      }
    }
    ents = ents.filter(e=>e.z>BZ-60);
    spawnHead -= adv;
    while(spawnHead < FAR){
      // hold the obstacle *cadence* (seconds between entities) flat once the
      // speed ramp outpaces the course: past ~27k the gap stretches with the
      // no-surf speed estimate, pinning reaction time at the ~0.9s the 30k
      // stretch allows instead of shrinking forever
      const base = wrand(260,380);
      const wzg = dist + spawnHead;
      const spdEst = Math.min(TOPSPD, Math.sqrt(62500 + 1.68*wzg));
      let gap = base*Math.max(1 - dlvl()*10/base, spdEst/360);
      if(zTrait('swarm')) gap *= (wrng()<0.55?0.55:1.75);   // packs, then breathers
      spawnHead += gap; spawn(spawnHead);
    }
    score=Math.floor(scoreF);
  }
  if(state==='dead') deadT+=dt;
  if(state==='done') doneT+=dt;

  // gift-box opening: 0-0.5s rattle, then the lid blows off and the
  // glowbugs spray out, hover, and swirl back into a count-up
  if((state==='dead'||state==='title') && giftAnim>=0){
    const prev=giftAnim; giftAnim+=dt;
    const [gx,gy,GS]=giftPos();
    if(giftAnim<0.5 && Math.floor(prev*12)!==Math.floor(giftAnim*12))
      beep(160+giftAnim*500, 120, 0.05, 'square', 0.12);
    if(prev<0.5 && giftAnim>=0.5){
      burst(gx,gy,42,48,430*SC,5*SC);
      burst(gx,gy,26,95,340*SC,4*SC);
      flashA=Math.max(flashA,0.4); flashHue=48; shake=Math.max(shake,10);
      sfx.levelup();
      giftLid={x:gx,y:gy-24*GS,vx:70*GS,vy:-560*GS,rot:0,vr:9};
      for(let i=0;i<GIFT_AMT;i++){
        const a=-Math.PI/2 + (i/(GIFT_AMT-1||1)-0.5)*2.2;
        giftFly.push({d:i*0.09, t:0, x:gx, y:gy-10*GS,
          vx:Math.cos(a)*rand(160,300)*GS, vy:Math.sin(a)*rand(260,430)*GS, done:false});
      }
    }
    if(giftLid){
      giftLid.x+=giftLid.vx*dt; giftLid.y+=giftLid.vy*dt;
      giftLid.vy+=1500*GS*dt; giftLid.rot+=giftLid.vr*dt;
      if(giftLid.y>CY+H) giftLid=null;
    }
    for(const b of giftFly){
      if(giftAnim-0.5 < b.d || b.done) continue;
      b.t+=dt;
      if(b.t<0.32){ b.x+=b.vx*dt; b.y+=b.vy*dt; b.vy+=750*GS*dt; }
      else{
        const k=Math.min(1,(b.t-0.32)*3.5)*dt*11;
        b.x+=(gx-b.x)*k; b.y+=(gy-b.y)*k;
        if(Math.hypot(gx-b.x,gy-b.y)<11*GS){
          b.done=true; giftCount++; giftPopT=giftAnim;
          beep(520+giftCount*90, 90, 0.09, 'square', 0.16);
          burst(gx,gy,6,95,170*GS,3*GS);
        }
      }
      parts.push({x:b.x,y:b.y,vx:0,vy:0,life:0.22,max:0.25,h:95,sz:2.5*GS});
    }
    if(giftAnim > 0.5 + GIFT_AMT*0.09 + 1.6){ giftAnim=-1; giftFly=[]; giftLid=null; }
  }

  // challenge collect: instant burst, then the reward bugs spray out and
  // swirl back into a count-up (gift celebration without the box)
  if((state==='title'||state==='dead') && chalAnim>=0){
    chalAnim+=dt;
    const [gx,gy]=chalPos;
    for(const b of chalFly){
      if(chalAnim < b.d || b.done) continue;
      b.t+=dt;
      if(b.t<0.3){ b.x+=b.vx*dt; b.y+=b.vy*dt; b.vy+=750*SC*dt; }
      else{
        const k=Math.min(1,(b.t-0.3)*3.5)*dt*11;
        b.x+=(gx-b.x)*k; b.y+=(gy-b.y)*k;
        if(Math.hypot(gx-b.x,gy-b.y)<11*SC){
          b.done=true; chalCount++; chalPopT=chalAnim;
          beep(520+chalCount*70, 90, 0.09, 'square', 0.15);
          burst(gx,gy,5,95,160*SC,3*SC);
        }
      }
      parts.push({x:b.x,y:b.y,vx:0,vy:0,life:0.2,max:0.23,h:95,sz:2.2*SC});
    }
    if(chalAnim > 0.1 + CHAL.reward*0.07 + 1.5){ chalAnim=-1; chalFly=[]; }
  }

  // particles / popups
  for(const p of parts){ p.x+=p.vx*dt; p.y+=p.vy*dt; p.vx*=Math.pow(0.1,dt); p.vy*=Math.pow(0.1,dt); p.life-=dt; }
  parts=parts.filter(p=>p.life>0);
  for(const p of pops){ p.y-=60*SC*dt; p.life-=dt*0.9; }
  pops=pops.filter(p=>p.life>0);
}

/* ---------- drawing ---------- */
function ringPath(cx,cy,r,ang,sides){
  ctx.beginPath();
  for(let i=0;i<=sides;i++){ const a=ang+i/sides*TAU; const x=cx+Math.cos(a)*r, y=cy+Math.sin(a)*r; i?ctx.lineTo(x,y):ctx.moveTo(x,y); }
}
function starPath(cx,cy,r,ang){
  ctx.beginPath();
  for(let i=0;i<10;i++){ const a=ang+i/10*TAU; const rr=i%2?r*0.45:r; const x=cx+Math.cos(a)*rr,y=cy+Math.sin(a)*rr; i?ctx.lineTo(x,y):ctx.moveTo(x,y); }
  ctx.closePath();
}

// full-frame overlay fill sized to the viewport DIAGONAL, so its edges stay
// off-screen at any angle while the 360° rotation is active
function fillFrame(){
  const D=Math.hypot(W,H);
  ctx.fillRect(CX-D/2, CY-D/2, D, D);
}

function render(){
  const surfing=surfT>0, starred=starT>0;
  // base clear stays unrotated so spun corners aren't stale
  ctx.fillStyle='#05010f'; ctx.fillRect(0,0,W,H);
  // 360° madness: spin the ENTIRE frame — world, HUD, everything — once per 10s
  const spinning=viewT>0;
  if(spinning){ ctx.save(); ctx.translate(CX,CY); ctx.rotate((1-viewT/10)*TAU); ctx.translate(-CX,-CY); }
  const [ecx,ecy]=projW(0,0,FAR*0.95);
  const g=ctx.createRadialGradient(ecx,ecy,0,ecx,ecy,Math.max(W,H)*0.75);
  g.addColorStop(0,`hsla(${(hue+40)%360},100%,${surfing?80:62}%,0.95)`);
  g.addColorStop(0.12,`hsla(${hue},90%,30%,0.5)`);
  g.addColorStop(0.5,`hsla(${(hue+200)%360},80%,12%,0.25)`);
  g.addColorStop(1,'rgba(5,1,15,0)');
  ctx.fillStyle=g; fillFrame();

  // stars (streaks). PULSE telegraph: as the surge is about to flip, the
  // field breathes radially and glows — gated on the pulse's derivative
  // so it only speaks when the change is actually coming
  ctx.lineCap='round';
  const pw=(state==='play'&&zTrait('pulse'))?(()=>{ const c=Math.cos(t*1.2);
    const g2=clamp((Math.abs(c)-0.35)/0.65,0,1);
    return g2>0.02?{f:1+0.22*c*g2, g:g2}:null; })():null;
  if(pw) ctx.globalCompositeOperation='lighter';
  for(const s of stars){
    const sx3=pw?s.x*pw.f:s.x, sy3=pw?s.y*pw.f:s.y;
    const [x1,y1]=proj(sx3,sy3,s.z);
    const [x2,y2]=proj(sx3,sy3,s.z+ (surfing?60+60*surfStack:60));
    const a=clamp(1.4 - s.z/1200, 0.05, 0.8)*(pw?1+1.3*pw.g:1);
    ctx.strokeStyle=`hsla(${(hue+s.z*0.2)%360},90%,${80+(pw?17*pw.g:0)}%,${Math.min(a,1)})`;
    ctx.lineWidth=clamp(160/s.z,0.4,2.4)*(pw?1+1.4*pw.g:1)*SC;
    ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke();
  }
  if(pw) ctx.globalCompositeOperation='source-over';
  // CROSSWIND telegraph: dust motes light up and stream with the gust
  // exactly while the wind is turning; quiet the rest of the time
  if(state==='play' && zTrait('wind')){
    const cw=Math.cos(t*0.55);
    const gI=clamp((Math.abs(cw)-0.35)/0.65,0,1);
    if(gI>0.02){
      ctx.globalCompositeOperation='lighter';
      ctx.lineCap='round'; ctx.lineJoin='round';
      const dir=cw>0?1:-1;
      for(const p of WDUST){
        const fade=clamp(1.6-p.z/1100,0.15,1);
        const [x1,y1,k1]=projW(p.x,p.y,p.z);
        const s2=clamp(560/p.z,3,11)*SC;
        ctx.strokeStyle=`hsla(190,100%,80%,${0.9*gI*fade})`;
        ctx.lineWidth=clamp(320/p.z,1.3,3.8)*SC;
        for(let c2=0;c2<2;c2++){
          const yc2=y1 + dir*(c2*s2*1.1 + Math.sin(t*7+p.x)*s2*0.3);
          ctx.beginPath();
          ctx.moveTo(x1-s2, yc2-dir*s2*0.8);
          ctx.lineTo(x1, yc2);
          ctx.lineTo(x1+s2, yc2-dir*s2*0.8);
          ctx.stroke();
        }
      }
      ctx.globalCompositeOperation='source-over';
    }
  }

  // build z-sorted draw list: tunnel rings + entities
  const items=[];
  const SPACING=70, off=dist%SPACING;
  // rings live on past the bird plane and are culled only once their
  // projected radius exceeds the viewport diagonal - they grow out of
  // view instead of popping out of existence at the plane
  const zGone=Math.max(6, R*Fp/Math.hypot(W,H));
  for(let i=-2;i<26;i++){
    const z=BZ+16+i*SPACING-off+SPACING;
    if(z<zGone) continue;
    items.push({z, kind:'ring', z0:z});
  }
  // on the crash screen, keep obstacles just past the bird plane visible
  // so the player can see exactly what they hit
  const nearCut = state==='dead' ? BZ-25 : BZ+4;
  for(const e of ents){ if(e.z>nearCut && e.z<FAR) items.push({z:e.z, kind:'ent', e}); }
  if(levelQ){
    const fz=BZ+(levelQ.len-dist);
    if(fz>zGone && fz<FAR) items.push({z:fz, kind:'finish'});
  }
  items.sort((a,b)=>b.z-a.z);

  const phOn = state==='play' && zTrait('phantom');
  for(const it of items){
    if(it.kind==='ring') drawRing(it.z0);
    else if(it.kind==='finish') drawFinish(it.z);
    else if(phOn && (it.e.type==='gate'||it.e.type==='bar'||it.e.type==='rocks'||it.e.type==='iris'||it.e.type==='doors'||it.e.type==='laser')){
      const wave=0.5+0.5*Math.sin((dist+it.e.z)*0.0055 - t*2.2);
      const near=clamp((430-it.e.z)/330,0,1);            // always lit at the plane
      ctx.globalAlpha=lerp(0.10+0.9*wave, 1, near);
      drawEnt(it.e); ctx.globalAlpha=1;
    }
    else if(state==='dead' && it.e.z < BZ-4){
      // on the crash freeze, obstacles you already passed sit between
      // the camera and the plane - ghost them so the actual killer at
      // the dashed ring stays the star of the autopsy
      ctx.globalAlpha=0.3; drawEnt(it.e); ctx.globalAlpha=1;
    }
    else drawEnt(it.e);
  }

  // gold star where your PB run on this tunnel ended — the point to fly past
  if(state==='play' && pace && pace.v===2 && pace.d){
    const z=pace.d-dist+BZ;
    if(z>=BZ+30 && z<=1100){
      const [x,yb,k]=projW(0,pace.y||0,z);
      const a=clamp(1.8-z/800,0.3,1)*(0.8+Math.sin(t*4)*0.2);
      ctx.fillStyle=`hsla(48,100%,60%,${a})`;
      ctx.shadowColor='hsl(48,100%,55%)'; ctx.shadowBlur=14*SC*a;
      starPath(x,yb,Math.max(7*SC,9*k),t*1.5); ctx.fill();
      ctx.shadowBlur=0;
      if(z<420){
        ctx.textAlign='center'; ctx.textBaseline='middle';
        ctx.font=`900 ${Math.round(Math.max(10*SC,11*k))}px system-ui,sans-serif`;
        ctx.fillStyle=`hsla(48,100%,75%,${a})`;
        ctx.fillText('PB', x, yb-Math.max(14*SC,16*k));
      }
    }
  }

  // the "now" ring: a dashed, semi-transparent ring pinned to the bird
  // plane - whatever touches it is crossing the bird RIGHT NOW. Same
  // hue/rotation formulas as the tunnel rings so it blends in
  if(state==='play' || state==='dead'){
    const [pcx,pcy,pk]=projW(0,0,BZ);
    const ph=(hue+BZ*0.22)%360;
    ctx.setLineDash([9*SC,13*SC]);
    ctx.strokeStyle=`hsla(${ph},90%,70%,0.30)`;
    ctx.lineWidth=2*SC;
    ringPath(pcx,pcy,R*pk,rot+BZ*twist,16); ctx.stroke();
    ctx.setLineDash([]);
  }

  drawBird(surfing,starred);

  // particles (additive)
  ctx.globalCompositeOperation='lighter';
  for(const p of parts){
    const a=p.life/p.max;
    ctx.fillStyle=`hsla(${p.h},100%,65%,${a})`;
    ctx.beginPath(); ctx.arc(p.x,p.y,p.sz*(0.5+a*0.8),0,TAU); ctx.fill();
  }
  ctx.globalCompositeOperation='source-over';

  if(state==='play' && zTrait('blackout')) drawBlackout();
  drawHUD(surfing,starred);
  if(state==='play' && hintT>0) drawHintCards();

  // popups
  ctx.textAlign='center'; ctx.textBaseline='middle';
  for(const p of pops){
    const a=clamp(p.life,0,1);
    const s=(1+(1-a)*0.25)*p.size;
    ctx.font=`900 ${Math.round(30*s*SC)}px system-ui,sans-serif`;
    ctx.fillStyle=`hsla(${p.h},100%,70%,${a})`;
    ctx.shadowColor=`hsla(${p.h},100%,50%,${a})`; ctx.shadowBlur=16*SC;
    ctx.fillText(p.txt,p.x,p.y);
    ctx.shadowBlur=0;
  }

  // vignette
  const vg=ctx.createRadialGradient(CX,CY,Math.min(W,H)*0.42,CX,CY,Math.max(W,H)*0.72);
  vg.addColorStop(0,'rgba(0,0,0,0)'); vg.addColorStop(1,'rgba(0,0,5,0.55)');
  ctx.fillStyle=vg; fillFrame();

  // flash
  if(flashA>0){ ctx.fillStyle=`hsla(${flashHue},100%,60%,${flashA})`; fillFrame(); }

  if(state==='title') drawTitle();
  if(state==='dead') drawDead();
  if(state==='shop') drawShop();
  if(state==='map') mpDraw();
  if(state==='done') drawDone();
  if(spinning) ctx.restore();
}

function drawRing(z){
  const [cx,cy,k]=projW(0,0,z);
  const ang=rot+z*twist;
  const a=clamp(1.5-z/1000,0.06,0.85);
  const h=(hue+z*0.22)%360;
  const r=R*k;
  // glow pass
  ctx.strokeStyle=`hsla(${h},95%,55%,${a*0.35})`;
  ctx.lineWidth=clamp(1100/z,1,10)*SC*2.6;
  ringPath(cx,cy,r,ang,16); ctx.stroke();
  // bright pass
  ctx.strokeStyle=`hsla(${h},100%,${68+Math.sin(t*4+z*0.02)*10}%,${a})`;
  ctx.lineWidth=clamp(1100/z,0.8,10)*SC;
  ringPath(cx,cy,r,ang,16); ctx.stroke();
  // spiral spokes
  ctx.strokeStyle=`hsla(${(h+40)%360},90%,60%,${a*0.3})`;
  ctx.lineWidth=1.2*SC;
  ctx.beginPath();
  for(let j=0;j<16;j+=4){
    const aa=ang+j/16*TAU;
    const [nx,ny,nk]=projW(0,0,z+SPACING_);
    const na=rot+(z+SPACING_)*twist + j/16*TAU;
    ctx.moveTo(cx+Math.cos(aa)*r, cy+Math.sin(aa)*r);
    ctx.lineTo(nx+Math.cos(na)*R*nk, ny+Math.sin(na)*R*nk);
  }
  ctx.stroke();
}
const SPACING_=70;

function drawEnt(e){
  const zz=e.z;
  if(e.type==='gate'){
    const [cx,cy,k]=projW(0,0,zz);
    const th=e.thf + e.spin*(zz-BZ);   // spin keyed to depth: lands at thf on arrival
    const [hx,hy]=projW(Math.cos(th)*e.d, Math.sin(th)*e.d, zz);
    // the disc is a membrane stretched inside a tunnel ring: its rim is
    // the SAME 16-gon (radius, rotation, warped center) as the wall
    // rings at this depth, so it fits snugly with zero overshoot
    const hr=e.hr*k, rimAng=rot+zz*twist;
    const a=clamp(1.6-zz/900,0.1,0.92);
    ringPath(cx,cy,R*k,rimAng,16);
    ctx.moveTo(hx+hr,hy);
    ctx.arc(hx,hy,hr,0,TAU,true);
    ctx.fillStyle=`hsla(${e.hue},85%,${30+Math.sin(t*6)*6}%,${a})`;
    ctx.fill('evenodd');
    // rim stroke in the disc's hue so the membrane visibly hangs on a ring
    ctx.strokeStyle=`hsla(${e.hue},95%,62%,${a*0.8})`;
    ctx.lineWidth=clamp(900/zz,1,8)*SC;
    ringPath(cx,cy,R*k,rimAng,16); ctx.stroke();
    // hole rim glow
    ctx.strokeStyle=`hsla(${e.hue},100%,72%,${a})`;
    ctx.lineWidth=clamp(700/zz,1,7)*SC;
    ctx.shadowColor=`hsl(${e.hue},100%,60%)`; ctx.shadowBlur=18*SC*a;
    ctx.beginPath(); ctx.arc(hx,hy,hr,0,TAU); ctx.stroke();
    ctx.shadowBlur=0;
  }
  else if(e.type==='bar'){
    const [cx,cy,k]=projW(0,0,zz);
    const a=clamp(1.6-zz/900,0.1,0.95);
    const pulse=0.75+Math.sin(t*10)*0.25;
    // both motions are depth-keyed, same trick as the gates: the rotor's
    // angle and the slider's gap position land at their final values
    // exactly when the bar reaches the plane (sin(0)=0 at zz=BZ)
    const ang=e.af + e.spin*(zz-BZ);
    const gc=e.d + (e.amp ? e.amp*Math.sin(e.sf*(zz-BZ)) : 0);
    const ux=Math.cos(ang), uy=Math.sin(ang);
    const L=R, i1=gc-e.g, i2=gc+e.g;
    ctx.lineCap='round';
    const seg=(r1,r2,wd,style)=>{
      if(r2<=r1) return;
      ctx.strokeStyle=style; ctx.lineWidth=wd;
      ctx.beginPath();
      ctx.moveTo(cx+ux*r1*k, cy+uy*r1*k);
      ctx.lineTo(cx+ux*r2*k, cy+uy*r2*k);
      ctx.stroke();
    };
    // the full diameter is metal except the signed interval (i1,i2);
    // outer ends pull in by each pass's cap radius so the round lineCap
    // lands flush on the wall instead of poking past it
    const halo=`hsla(8,100%,55%,${a*0.4})`;
    const core=`hsla(${18+pulse*20},100%,${55+pulse*15}%,${a})`;
    // both passes share endpoints so the glow hugs the whole bar; the
    // wider halo cap then wraps the tip the same way it wraps the sides
    const wHalo=e.th*k*2.2, wCore=e.th*k;
    const tCap=e.th*0.5;
    seg(-L+tCap,i1,wHalo,halo); seg(i2,L-tCap,wHalo,halo);
    seg(-L+tCap,i1,wCore,core); seg(i2,L-tCap,wCore,core);
  }
  else if(e.type==='iris'){
    const [cx,cy,k]=projW(0,0,zz);
    // the same disc as a gate — same membrane, same rim, hole orbiting on a
    // depth-keyed spin that lands on its true spot at the plane — except
    // that the aperture pumps the whole width of the tunnel: wide open is the
    // tunnel itself, shut is its final size. Keyed to depth rather than to
    // the clock — like the gate's spin and the slider's gap — the cosine is
    // at its trough exactly where zz meets the plane, so it bottoms out on
    // the frame you fly through it whatever your speed. The S-curve on top
    // of the cosine is what stops it reading as clockwork: it holds near
    // each end and crosses the middle quickly, so the iris rests open, sweeps
    // shut, rests shut. EASE alone sets how much hang — 1 leaves the bare
    // cosine, higher squares it up — and it leaves the period untouched.
    const EASE=3;
    let sw=(1-Math.cos((zz-BZ)*e.pf))/2;
    const sa=Math.pow(sw,EASE), sb=Math.pow(1-sw,EASE);
    sw=sa/(sa+sb);
    const hrRaw=e.hr+(R-e.hr)*sw;
    const th=e.thf + e.spin*(zz-BZ);
    const [hx,hy]=projW(Math.cos(th)*e.d, Math.sin(th)*e.d, zz);
    const hrNow=hrRaw*k, rimAng=rot+zz*twist;
    const a=clamp(1.6-zz/900,0.1,0.92);
    ringPath(cx,cy,R*k,rimAng,16);
    ctx.moveTo(hx+hrNow,hy);
    ctx.arc(hx,hy,hrNow,0,TAU,true);
    ctx.fillStyle=`hsla(${e.hue},85%,${30+Math.sin(t*6)*6}%,${a})`;
    ctx.fill('evenodd');
    ctx.strokeStyle=`hsla(${e.hue},95%,62%,${a*0.8})`;
    ctx.lineWidth=clamp(900/zz,1,8)*SC;
    ringPath(cx,cy,R*k,rimAng,16); ctx.stroke();
    // at full open the hole is the tunnel, so its rim is clipped to the wall
    // ring — otherwise it would draw a circle out over the tunnel itself
    ctx.save();
    ringPath(cx,cy,R*k,rimAng,16); ctx.clip();
    ctx.strokeStyle=`hsla(${e.hue},100%,72%,${a})`;
    ctx.lineWidth=clamp(700/zz,1,7)*SC;
    ctx.shadowColor=`hsl(${e.hue},100%,60%)`; ctx.shadowBlur=18*SC*a;
    ctx.beginPath(); ctx.arc(hx,hy,hrNow,0,TAU); ctx.stroke();
    ctx.restore();
    ctx.shadowBlur=0;
  }
  else if(e.type==='doors'){
    const [cx,cy,k]=projW(0,0,zz);
    const a=clamp(1.6-zz/900,0.1,0.95);
    // blast doors: the panels start flush inside the tunnel walls and
    // close the full span, landing on the final slit exactly at the
    // plane; the 0.7 ease makes the last stretch the fastest — a slam
    const prog=Math.pow(clamp((zz-BZ)/1100,0,1),0.7);
    const rimAng=rot+zz*twist;
    const [,gyA]=projW(0, lerp(e.d-e.g,-R-8,prog), zz);
    const [,gyB]=projW(0, lerp(e.d+e.g, R+8,prog), zz);
    const gy1=Math.min(gyA,gyB), gy2=Math.max(gyA,gyB);
    // panels and edges all live inside a ring clip — nothing pokes past
    // the tunnel wall
    ctx.save();
    ringPath(cx,cy,R*k,rimAng,16); ctx.clip();
    const span=(R+12)*k;
    ctx.fillStyle=`hsla(${e.hue},72%,${28+Math.sin(t*4)*4}%,${a})`;
    ctx.fillRect(cx-span, cy-span, span*2, gy1-(cy-span));
    ctx.fillRect(cx-span, gy2, span*2, cy+span-gy2);
    const pulse=0.7+Math.sin(t*9)*0.3;
    ctx.lineCap='round';
    ctx.strokeStyle=`hsla(${e.hue},100%,${58+pulse*14}%,${a})`;
    ctx.lineWidth=clamp(500/zz,1,5)*SC;
    ctx.shadowColor=`hsl(${e.hue},100%,60%)`; ctx.shadowBlur=14*SC*a;
    ctx.beginPath(); ctx.moveTo(cx-span,gy1); ctx.lineTo(cx+span,gy1);
    ctx.moveTo(cx-span,gy2); ctx.lineTo(cx+span,gy2); ctx.stroke();
    ctx.shadowBlur=0;
    ctx.restore();
    // rim stroke sits on top, unclipped, so the wall ring stays crisp
    ctx.strokeStyle=`hsla(${e.hue},95%,62%,${a*0.8})`;
    ctx.lineWidth=clamp(900/zz,1,7)*SC;
    ringPath(cx,cy,R*k,rimAng,16); ctx.stroke();
  }
  else if(e.type==='laser'){
    const a=clamp(1.6-zz/900,0.1,0.95);
    const gc=e.d + e.amp*Math.sin(e.sf*(zz-BZ));
    const pulse=0.72+Math.sin(t*16)*0.28;
    for(const [b0,dir] of [[e.b1,1],[e.b2,-1]]){
      const ang=b0 + dir*e.spin*(zz-BZ);
      const ca=Math.cos(ang), sa=Math.sin(ang);
      // chord of the beam line through (0,gc) across the R-circle
      const B=gc*sa, disc=Math.sqrt(Math.max(0,B*B-(gc*gc-R*R)));
      const tA=-B-disc, tB=-B+disc;
      const [x1,y1]=projW(tA*ca, gc+tA*sa, zz);
      const [x2,y2,k2]=projW(tB*ca, gc+tB*sa, zz);
      ctx.lineCap='round';
      ctx.strokeStyle=`hsla(350,100%,55%,${a*0.35})`;
      ctx.lineWidth=e.th*k2*2.6;
      ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke();
      ctx.strokeStyle=`hsla(${344+pulse*14},100%,${58+pulse*18}%,${a})`;
      ctx.lineWidth=e.th*k2;
      ctx.shadowColor='hsl(350,100%,55%)'; ctx.shadowBlur=16*SC*a*pulse;
      ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke();
      ctx.shadowBlur=0;
      // wall emitter nubs
      ctx.fillStyle=`hsla(350,60%,80%,${a})`;
      ctx.beginPath(); ctx.arc(x1,y1,3.2*k2,0,TAU); ctx.fill();
      ctx.beginPath(); ctx.arc(x2,y2,3.2*k2,0,TAU); ctx.fill();
    }
    { // sparks fly where the beams cross
      const [xc,yc,kc]=projW(0,gc,zz);
      ctx.globalCompositeOperation='lighter';
      ctx.lineCap='round';
      for(let i=0;i<4;i++){
        const a2=rand(0,TAU), len2=rand(3,10)*kc;
        ctx.strokeStyle=`hsla(${rand(28,55)},100%,${rand(65,88)}%,${a*rand(0.4,1)})`;
        ctx.lineWidth=rand(0.8,2)*kc*SC;
        ctx.beginPath(); ctx.moveTo(xc,yc);
        ctx.lineTo(xc+Math.cos(a2)*len2, yc+Math.sin(a2)*len2); ctx.stroke();
      }
      ctx.fillStyle=`hsla(45,100%,${80+Math.sin(t*40)*15}%,${a})`;
      ctx.beginPath(); ctx.arc(xc,yc,2.4*kc*(0.8+rand(0,0.5)),0,TAU); ctx.fill();
      ctx.globalCompositeOperation='source-over';
    }
  }
  else if(e.type==='rocks'){
    const a=clamp(1.6-zz/900,0.1,0.95);
    const tt = state==='dead' && e.tF!==undefined ? e.tF : t;
    for(const r of e.rocks){
      const [x,y,k]=projW(r.x+Math.sin(tt*e.w2+r.ph)*r.amp,r.y,zz);
      const rr=r.r*k;
      ctx.save(); ctx.translate(x,y); ctx.rotate(r.ra);
      ctx.beginPath();
      r.shape.forEach((p,i)=>{ i?ctx.lineTo(p[0]*rr,p[1]*rr):ctx.moveTo(p[0]*rr,p[1]*rr); });
      ctx.closePath();
      ctx.fillStyle=`hsla(268,${r.deco?18:32}%,${r.deco?20:28}%,${a})`;
      ctx.fill();
      ctx.strokeStyle=`hsla(${(hue+180)%360},80%,62%,${a*0.8})`;
      ctx.lineWidth=clamp(320/zz,0.8,3.5)*SC;
      ctx.stroke();
      ctx.restore();
    }
  }
  else if(e.type==='gem'){
    const [x,yb,k]=projW(e.x,e.y+Math.sin(t*3+e.seed)*3,zz);
    const s=13*k, a=clamp(1.7-zz/900,0.15,1);
    ctx.save(); ctx.translate(x,yb); ctx.rotate(t*1.5+e.seed);
    ctx.beginPath(); ctx.moveTo(0,-s); ctx.lineTo(s*0.7,0); ctx.lineTo(0,s); ctx.lineTo(-s*0.7,0); ctx.closePath();
    ctx.fillStyle=`hsla(170,100%,60%,${a})`;
    ctx.shadowColor='hsl(170,100%,55%)'; ctx.shadowBlur=20*SC*a;
    ctx.fill();
    ctx.strokeStyle=`hsla(170,100%,88%,${a})`; ctx.lineWidth=1.6*SC; ctx.stroke();
    ctx.shadowBlur=0; ctx.restore();
  }
  else if(e.type==='bug'){
    const bx2=e.x+Math.sin(t*4+e.seed)*10, by2=e.y+e.ev+Math.sin(t*3.1+e.seed*2)*8;
    const [x,yb,k]=projW(bx2,by2,zz);
    const s=5*k, a=clamp(1.7-zz/900,0.15,1), pl=0.7+Math.sin(t*12+e.seed)*0.3;
    ctx.globalCompositeOperation='lighter';
    const g2=ctx.createRadialGradient(x,yb,0,x,yb,s*3);
    g2.addColorStop(0,`hsla(95,100%,75%,${a*pl})`);
    g2.addColorStop(1,'hsla(95,100%,50%,0)');
    ctx.fillStyle=g2; ctx.beginPath(); ctx.arc(x,yb,s*3,0,TAU); ctx.fill();
    ctx.globalCompositeOperation='source-over';
    ctx.fillStyle=`hsla(95,100%,82%,${a})`;
    ctx.beginPath(); ctx.arc(x,yb,s*0.8,0,TAU); ctx.fill();
    ctx.fillStyle=`hsla(95,60%,92%,${a*(Math.sin(t*40+e.seed)>0?0.55:0.18)})`;
    ctx.beginPath(); ctx.ellipse(x-s,yb-s*0.6,s*1.1,s*0.5,-0.5,0,TAU); ctx.fill();
    ctx.beginPath(); ctx.ellipse(x+s,yb-s*0.6,s*1.1,s*0.5,0.5,0,TAU); ctx.fill();
  }
  else if(e.type==='surf'){
    const [x,yb,k]=projW(e.x,e.y+Math.sin(t*3+e.seed)*3,zz);
    const s=15*k, a=clamp(1.7-zz/900,0.15,1);
    ctx.save(); ctx.translate(x,yb); ctx.rotate(Math.sin(t*2+e.seed)*0.4);
    const lg=ctx.createLinearGradient(-s,-s,s,s);
    lg.addColorStop(0,'#fff'); lg.addColorStop(0.5,'#9fb6c9'); lg.addColorStop(1,'#e8f4ff');
    ctx.fillStyle=lg;
    ctx.shadowColor='#bfe3ff'; ctx.shadowBlur=22*SC*a;
    ctx.globalAlpha=a;
    ctx.beginPath(); ctx.ellipse(0,0,s*1.25,s*0.45,0.5,0,TAU); ctx.fill();
    // lightning glyph
    ctx.fillStyle='#2b3d55';
    ctx.beginPath(); ctx.moveTo(-s*0.15,-s*0.55); ctx.lineTo(s*0.25,-s*0.1); ctx.lineTo(s*0.02,-s*0.05); ctx.lineTo(s*0.2,s*0.5); ctx.lineTo(-s*0.28,0); ctx.lineTo(-0.02,-s*0.05); ctx.closePath(); ctx.fill();
    ctx.globalAlpha=1; ctx.shadowBlur=0; ctx.restore();
  }
  else if(e.type==='star'){
    const [x,yb,k]=projW(e.x,e.y+Math.sin(t*3+e.seed)*3,zz);
    const s=14*k, a=clamp(1.7-zz/900,0.15,1);
    ctx.fillStyle=`hsla(${(t*300)%360},100%,65%,${a})`;
    ctx.shadowColor='hsl(55,100%,60%)'; ctx.shadowBlur=22*SC*a;
    starPath(x,yb,s,t*2+e.seed); ctx.fill();
    ctx.strokeStyle=`hsla(55,100%,85%,${a})`; ctx.lineWidth=1.6*SC;
    starPath(x,yb,s,t*2+e.seed); ctx.stroke();
    ctx.shadowBlur=0;
  }
  else if(e.type==='slow'){
    const [x,yb,k]=projW(e.x,e.y+Math.sin(t*3+e.seed)*3,zz);
    const s=9*k, a=clamp(1.7-zz/900,0.15,1)*(surfT>0?0.25:1); // ghosted while inert mid-surf
    ctx.shadowColor='hsl(195,100%,60%)'; ctx.shadowBlur=20*SC*a;
    ctx.fillStyle=`hsla(210,85%,22%,${a*0.95})`;
    ctx.beginPath(); ctx.arc(x,yb,s,0,TAU); ctx.fill();
    ctx.strokeStyle=`hsla(195,100%,78%,${a})`; ctx.lineWidth=Math.max(2.2*SC,s*0.22);
    ctx.lineCap='round';
    ctx.beginPath(); ctx.arc(x,yb,s,0,TAU); ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(x,yb); ctx.lineTo(x,yb-s*0.6);
    ctx.moveTo(x,yb); ctx.lineTo(x+Math.cos(t*2)*s*0.42,yb+Math.sin(t*2)*s*0.42);
    ctx.stroke(); ctx.shadowBlur=0;
  }
  else if(e.type==='spin'){
    const [x,yb,k]=projW(e.x,e.y+Math.sin(t*3+e.seed)*3,zz);
    const s=9*k, a=clamp(1.7-zz/900,0.15,1)*(surfT>0?0.25:1); // ghosted while inert mid-surf
    ctx.shadowColor='hsl(300,100%,60%)'; ctx.shadowBlur=22*SC*a;
    ctx.fillStyle=`hsla(300,90%,26%,${a*0.95})`;
    ctx.beginPath(); ctx.arc(x,yb,s,0,TAU); ctx.fill();
    ctx.strokeStyle=`hsla(300,100%,78%,${a})`; ctx.lineWidth=Math.max(2.2*SC,s*0.2);
    ctx.lineCap='round';
    ctx.beginPath();
    for(let i=0;i<=40;i++){
      const aa=t*3+i*0.28, rr=s*(0.12+i/40*0.82);
      const px=x+Math.cos(aa)*rr, py=yb+Math.sin(aa)*rr;
      i?ctx.lineTo(px,py):ctx.moveTo(px,py);
    }
    ctx.stroke(); ctx.shadowBlur=0;
  }
  else if(e.type==='buddy'){
    const [x,yb,k]=projW(e.x,e.y+Math.sin(t*3+e.seed)*3,zz);
    const a=clamp(1.7-zz/900,0.15,1);
    ctx.save(); ctx.globalAlpha=a; ctx.translate(x,yb);
    ctx.shadowColor='hsl(140,100%,60%)'; ctx.shadowBlur=18*SC*a;
    drawBuddy(6*k, 0.3+Math.sin(t*8+e.seed)*0.3, null);
    ctx.restore();
  }
  else if(e.type==='mult'){
    const [x,yb,k]=projW(e.x,e.y+Math.sin(t*3+e.seed)*3,zz);
    const s=13*k, a=clamp(1.7-zz/900,0.15,1);
    ctx.fillStyle=`hsla(320,100%,55%,${a*0.9})`;
    ctx.shadowColor='hsl(320,100%,60%)'; ctx.shadowBlur=20*SC*a;
    ctx.beginPath(); ctx.arc(x,yb,s,0,TAU); ctx.fill();
    ctx.shadowBlur=0;
    ctx.fillStyle=`rgba(255,255,255,${a})`;
    ctx.font=`900 ${Math.round(s*1.1)}px system-ui,sans-serif`;
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText('×2',x,yb+s*0.05);
  }
}

function drawBird(surfing,starred){
  // invincibility running out: the whole bird strobes solid black/white,
  // four full cycles over the last second
  const invEnd=Math.max(surfT,starT);
  const mono = (invEnd>0 && invEnd<1) ? (Math.floor(invEnd*8)%2 ? '#000' : '#fff') : null;
  const fx = starred ? 'star' : surfing ? 'surf' : null;
  const [bx,by,k]=proj(0,bird.y,BZ);
  const s=BIRD_R*k;
  // trail ghosts
  for(let i=trail.length-1;i>=1;i--){
    const [tx,ty,tk]=proj(0,trail[i],BZ+i*9);
    const a=(1-i/trail.length)*(surfing?0.5:starred?0.45:0.22);
    const h= surfing?210 : starred?(t*400+i*30)%360 : 45;
    ctx.fillStyle=`hsla(${h},${surfing?30:100}%,${surfing?85:60}%,${a})`;
    ctx.beginPath(); ctx.arc(tx,ty,BIRD_R*tk*(1-i*0.02),0,TAU); ctx.fill();
  }
  // the buddy tags along above the shoulder, trailing your line slightly
  if(buddy && state==='play'){
    const byy = trail[6]!==undefined ? trail[6] : bird.y;
    const [cx2,cy2,ck]=proj(0,byy,BZ+14);
    ctx.save();
    ctx.translate(cx2 - BIRD_R*ck*2.2, cy2 - BIRD_R*ck*1.7);
    ctx.shadowColor='hsl(140,100%,60%)'; ctx.shadowBlur=10*SC;
    drawBuddy(BIRD_R*ck*0.62, 0.3+Math.sin(t*11)*0.3, fx);
    ctx.restore();
  }
  ctx.save();
  ctx.translate(bx,by);
  if(zTrait('topsy')) ctx.scale(1,-1);   // gravity is flipped — so is the bird
  const bodyH = starred ? (t*400)%360 : surfing ? 210 : 45;
  const bodySat = surfing ? 20 : 100;
  const bodyLum = surfing ? 82 : 58;
  // surfboard
  if(surfing){
    ctx.save(); ctx.rotate(0.08*Math.sin(t*8));
    const lg=ctx.createLinearGradient(-s*2.2,0,s*2.2,0);
    lg.addColorStop(0,'#8fa8bd'); lg.addColorStop(0.5,'#f4fbff'); lg.addColorStop(1,'#8fa8bd');
    ctx.fillStyle=mono||lg;
    ctx.shadowColor='#cfeaff'; ctx.shadowBlur=24*SC;
    ctx.beginPath(); ctx.ellipse(0,s*1.35,s*2.4,s*0.55,0,0,TAU); ctx.fill();
    ctx.shadowBlur=0; ctx.restore();
  }
  // harness shells: the SKIN's silhouette as a union — every part of the
  // model flattened into one shape, so wings and body stop ghosting through
  // each other the way stacked copies did — carrying a yellow inner shadow.
  // The mask is built once a frame and stamped at a scale per charge, so the
  // glow hugs the outline from inside and thins outward: a planet's limb seen
  // from orbit, in gold. The bird is drawn over the top, so the middles stay
  // hollow with no masking of their own.
  const shells=Math.min(3, harnessLeft+(stock.harness|0));
  if(state==='play' && shells>0){
    const need=Math.ceil(s*8), pxs=Math.ceil(need*DPR);
    if(!shCv || shCv.width!==pxs){
      shCv=document.createElement('canvas'); shCv.width=shCv.height=pxs; shCtx=shCv.getContext('2d');
      shInv=document.createElement('canvas'); shInv.width=shInv.height=pxs; shInvCtx=shInv.getContext('2d');
      shGlow=document.createElement('canvas'); shGlow.width=shGlow.height=pxs; shGlowCtx=shGlow.getContext('2d');
    }
    // 1. the union: one flat colour, so overlapping parts merge into one shape
    shCtx.setTransform(DPR,0,0,DPR,0,0);
    shCtx.globalCompositeOperation='source-over'; shCtx.globalAlpha=1;
    shCtx.clearRect(0,0,need,need);
    const mainCtx=ctx; ctx=shCtx;
    ctx.save(); ctx.translate(need/2,need/2);
    drawModel(skin, s, '#fff', bodyH, bodySat, bodyLum, bird.wing, null);
    ctx.restore();
    ctx=mainCtx;
    // 2. the inverse of that union — the caster the inner shadow falls from
    shInvCtx.setTransform(1,0,0,1,0,0);
    shInvCtx.globalCompositeOperation='source-over';
    shInvCtx.clearRect(0,0,pxs,pxs);
    shInvCtx.fillStyle='#000'; shInvCtx.fillRect(0,0,pxs,pxs);
    shInvCtx.globalCompositeOperation='destination-out';
    shInvCtx.drawImage(shCv,0,0);
    // 3. cast that inverse WITH a shadow, on its own pass. The shadow has to
    // be its own step: Chromium drops shadows under the clipping composite
    // ops, so casting straight into the mask silently produced nothing but
    // the caster's antialiased edge. The caster needs no offset either — its
    // pixels are the OUTSIDE of the shape, so only the shadow lands inside.
    shGlowCtx.setTransform(1,0,0,1,0,0);
    shGlowCtx.globalCompositeOperation='source-over';
    shGlowCtx.clearRect(0,0,pxs,pxs);
    // deep gold, not pale: added light at high lightness carries blue with it
    // and washes to grey. A tight blur also keeps the band hugging the edge
    // instead of bleeding into the middle, where the bird covers it anyway.
    shGlowCtx.shadowColor='hsl(45,100%,50%)';
    shGlowCtx.shadowBlur=Math.max(2,s*0.32)*DPR;
    shGlowCtx.drawImage(shInv,0,0);
    shGlowCtx.shadowBlur=0;
    // 4. keep it only where the union is, and that is the inner shadow
    shCtx.setTransform(1,0,0,1,0,0);
    shCtx.globalCompositeOperation='source-in';
    shCtx.drawImage(shGlow,0,0);
    // 5. one stamp per charge, each a step wider
    // the steps have to clear the bird itself: at 1.13 the margin round the
    // body is a couple of pixels and the bird covers its own innermost shell
    const STEP=[1.22,1.5,1.8], AL=[1,0.76,0.56];
    const flare=1+(graceT>0?graceT*1.4:0);          // one just took a hit
    const quiet=(surfing||starred)?0.45:1;          // an aura is already lit
    ctx.save(); ctx.globalCompositeOperation='lighter';
    for(let i=0;i<shells;i++){
      const w=need*(STEP[i]+Math.sin(t*2.4+i*1.15)*0.016);
      ctx.globalAlpha=clamp(AL[i]*flare*quiet,0,1);
      ctx.drawImage(shCv,-w/2,-w/2,w,w);
    }
    ctx.restore();
  }
  if(starred||surfing){ ctx.shadowColor=mono||(surfing?'#dff2ff':`hsl(${(t*400)%360},100%,60%)`); ctx.shadowBlur=26*SC; }
  drawModel(skin, s, mono, bodyH, bodySat, bodyLum, bird.wing, fx);
  ctx.shadowBlur=0;
  ctx.restore();
}

/* ---------- playable models (all drawn at origin, s = base half-size) ---------- */
function drawModel(id, s, mono, bodyH, bodySat, bodyLum, wing, fx){
  if(id==='chick') return drawBirdModel(s*0.7, mono, bodyH, bodySat, Math.min(90,bodyLum+16), wing, 0.75);
  if(id==='dragonfly') return drawDragonfly(s, mono, wing, fx);
  if(id==='eagle') return drawEagle(s, mono, wing, fx);
  if(id==='ship') return drawShip(s, mono, wing, fx);
  if(id==='truck') return drawTruck(s, mono, wing, fx);
  return drawBirdModel(s, mono, bodyH, bodySat, bodyLum, wing, 0.55);
}
// the buddy is a pint-sized copy of whichever model you're flying
function drawBuddy(s, wing, fx){
  const h = fx==='star' ? (t*400)%360 : fx==='surf' ? 210 : 50;
  const sa = fx==='surf' ? 20 : 100;
  const lu = fx==='surf' ? 78 : fx==='star' ? 58 : 74;
  if(skin==='bird') return drawModel('chick', s, null, h, sa, lu, wing, fx);
  drawModel(skin, s*0.7, null, h, sa, lu, wing, fx);
}
// non-bird models draw every part through this: 'star' spins the whole
// palette through rainbow hues, 'surf' washes it silver, matching what
// the bird body does via bodyH/bodySat/bodyLum
function fxColor(fx, mono){
  if(mono) return ()=>mono;
  if(fx==='star'){ const cyc=(t*400)%360; return (h,sa,li,a=1)=>`hsla(${(cyc+h*0.2)%360},100%,${35+li*0.4}%,${a})`; }
  if(fx==='surf') return (h,sa,li,a=1)=>`hsla(210,${Math.min(sa,25)}%,${55+li*0.4}%,${a})`;
  return (h,sa,li,a=1)=>`hsla(${h},${sa}%,${li}%,${a})`;
}
function drawBirdModel(s, mono, bodyH, bodySat, bodyLum, wing, headR){
  const wingA = 0.55 - wing*1.5 + Math.sin(t*9)*0.08;
  for(const side of [-1,1]){
    ctx.save(); ctx.scale(side,1); ctx.translate(s*0.55,-s*0.1); ctx.rotate(wingA);
    const wg=ctx.createLinearGradient(0,0,s*2.4,0);
    wg.addColorStop(0,`hsl(${(bodyH+15)%360},${bodySat}%,${bodyLum}%)`);
    wg.addColorStop(1,`hsl(${(bodyH-25+360)%360},${bodySat}%,${bodyLum-14}%)`);
    ctx.fillStyle=mono||wg;
    ctx.beginPath(); ctx.moveTo(0,0);
    ctx.quadraticCurveTo(s*1.5,-s*0.9,s*2.5,-s*0.35);
    ctx.quadraticCurveTo(s*1.7,s*0.55,0,s*0.5);
    ctx.closePath(); ctx.fill();
    ctx.strokeStyle=mono||`hsla(${bodyH},100%,20%,0.5)`; ctx.lineWidth=1.4*SC; ctx.stroke();
    ctx.restore();
  }
  ctx.fillStyle=mono||`hsl(${(bodyH-20+360)%360},${bodySat}%,${bodyLum-10}%)`;
  ctx.beginPath();
  ctx.moveTo(0,s*0.5); ctx.lineTo(-s*0.5,s*1.5); ctx.lineTo(0,s*1.1); ctx.lineTo(s*0.5,s*1.5); ctx.closePath(); ctx.fill();
  const bg=ctx.createRadialGradient(-s*0.3,-s*0.4,s*0.1,0,0,s*1.3);
  bg.addColorStop(0,`hsl(${bodyH},${bodySat}%,${bodyLum+14}%)`);
  bg.addColorStop(1,`hsl(${(bodyH-18+360)%360},${bodySat}%,${bodyLum-16}%)`);
  ctx.fillStyle=mono||bg;
  ctx.beginPath(); ctx.ellipse(0,0,s,s*1.08,0,0,TAU); ctx.fill();
  ctx.fillStyle=mono||`hsl(${bodyH},${bodySat}%,${bodyLum+8}%)`;
  ctx.beginPath(); ctx.arc(0,-s*0.85,s*headR,0,TAU); ctx.fill();
}
function drawDragonfly(s, mono, wing, fx){
  const C=fxColor(fx,mono);
  const flut=Math.sin(t*45)*0.35 - wing*0.5;
  for(const side of [-1,1]) for(const pair of [0,1]){
    ctx.save(); ctx.scale(side,1); ctx.translate(s*0.3, -s*0.2+pair*s*0.55); ctx.rotate(0.25+flut+pair*0.15);
    ctx.fillStyle=C(190+pair*40,80,75,0.5);
    ctx.beginPath(); ctx.ellipse(s*1.3,0,s*1.5,s*0.34,0,0,TAU); ctx.fill();
    ctx.strokeStyle=C(173,60,91,0.7); ctx.lineWidth=1*SC; ctx.stroke();
    ctx.restore();
  }
  const bg=ctx.createLinearGradient(0,-s,0,s*2.4);
  bg.addColorStop(0,C(170,90,55)); bg.addColorStop(1,C(230,80,45));
  ctx.fillStyle=mono||bg;
  ctx.beginPath(); ctx.ellipse(0,s*0.8,s*0.32,s*1.7,0,0,TAU); ctx.fill();      // slim tail
  ctx.beginPath(); ctx.ellipse(0,-s*0.3,s*0.55,s*0.6,0,0,TAU); ctx.fill();     // thorax
  ctx.fillStyle=C(160,90,70);
  ctx.beginPath(); ctx.arc(-s*0.3,-s*0.95,s*0.32,0,TAU); ctx.fill();           // eyes
  ctx.beginPath(); ctx.arc(s*0.3,-s*0.95,s*0.32,0,TAU); ctx.fill();
}
function drawEagle(s, mono, wing, fx){
  const C=fxColor(fx,mono);
  const wingA = 0.35 - wing*1.4 + Math.sin(t*7)*0.06;
  for(const side of [-1,1]){
    ctx.save(); ctx.scale(side,1); ctx.translate(s*0.6,-s*0.15); ctx.rotate(wingA);
    const wg=ctx.createLinearGradient(0,0,s*3.4,0);
    wg.addColorStop(0,C(28,45,32)); wg.addColorStop(1,C(28,40,18));
    ctx.fillStyle=mono||wg;
    ctx.beginPath(); ctx.moveTo(0,0);
    ctx.quadraticCurveTo(s*2,-s*1.3,s*3.5,-s*0.7);
    ctx.lineTo(s*3.1,-s*0.15); ctx.lineTo(s*2.4,-s*0.3);
    ctx.quadraticCurveTo(s*1.8,s*0.6,0,s*0.55);
    ctx.closePath(); ctx.fill();
    ctx.restore();
  }
  ctx.fillStyle=C(43,39,93);                                                  // fanned white tail
  ctx.beginPath(); ctx.moveTo(-s*0.7,s*1.7); ctx.quadraticCurveTo(0,s*0.5,s*0.7,s*1.7);
  ctx.quadraticCurveTo(0,s*1.45,-s*0.7,s*1.7); ctx.closePath(); ctx.fill();
  const bg=ctx.createRadialGradient(-s*0.3,-s*0.3,s*0.1,0,0,s*1.4);
  bg.addColorStop(0,C(28,40,38)); bg.addColorStop(1,C(28,45,20));
  ctx.fillStyle=mono||bg;
  ctx.beginPath(); ctx.ellipse(0,0,s*1.05,s*1.15,0,0,TAU); ctx.fill();
  ctx.fillStyle=C(42,45,95);                                                  // white head
  ctx.beginPath(); ctx.arc(0,-s*0.95,s*0.55,0,TAU); ctx.fill();
  ctx.fillStyle=C(45,95,55);                                                  // beak tip peeking over
  ctx.beginPath(); ctx.arc(0,-s*1.35,s*0.16,0,TAU); ctx.fill();
}
function drawShip(s, mono, wing, fx){
  const C=fxColor(fx,mono);
  const thrust=0.5+wing*1.6+Math.sin(t*30)*0.15;
  ctx.globalCompositeOperation='lighter';                                     // engine glow
  for(const side of [-1,1]){
    const g2=ctx.createRadialGradient(side*s*0.55,s*1.15,0,side*s*0.55,s*1.15,s*1.4*thrust);
    g2.addColorStop(0,C(196,100,74,0.85*thrust)); g2.addColorStop(1,C(196,100,74,0));
    ctx.fillStyle=g2; ctx.beginPath(); ctx.arc(side*s*0.55,s*1.15,s*1.4*thrust,0,TAU); ctx.fill();
  }
  ctx.globalCompositeOperation='source-over';
  const bg=ctx.createLinearGradient(-s*1.6,0,s*1.6,0);
  bg.addColorStop(0,C(212,17,43)); bg.addColorStop(0.5,C(213,52,92)); bg.addColorStop(1,C(212,17,43));
  ctx.fillStyle=mono||bg;
  ctx.beginPath();                                                            // chevron hull
  ctx.moveTo(0,-s*1.5); ctx.lineTo(s*1.7,s*1.1); ctx.lineTo(s*0.55,s*0.75);
  ctx.lineTo(0,s*1.05); ctx.lineTo(-s*0.55,s*0.75); ctx.lineTo(-s*1.7,s*1.1);
  ctx.closePath(); ctx.fill();
  ctx.strokeStyle=C(216,38,13,0.6); ctx.lineWidth=1.4*SC; ctx.stroke();
  ctx.fillStyle=C(192,100,75,0.95);                                          // cockpit dome
  ctx.beginPath(); ctx.arc(0,-s*0.25,s*0.42,0,TAU); ctx.fill();
}
function drawTruck(s, mono, wing, fx){
  const C=fxColor(fx,mono);
  ctx.save(); ctx.rotate(clamp(bird.vy*0.0012,-0.18,0.18));
  ctx.fillStyle=C(258,15,17);                                                 // wheels
  ctx.beginPath(); ctx.arc(-s*0.85,s*1.15,s*0.38,0,TAU); ctx.fill();
  ctx.beginPath(); ctx.arc(s*0.85,s*1.15,s*0.38,0,TAU); ctx.fill();
  const bg=ctx.createLinearGradient(0,-s*1.1,0,s*1.2);
  bg.addColorStop(0,C(32,79,96)); bg.addColorStop(0.55,C(32,79,96)); bg.addColorStop(0.56,C(337,100,75)); bg.addColorStop(1,C(336,100,69));
  ctx.fillStyle=mono||bg;                                                     // box body (rear view)
  ctx.beginPath();
  if(ctx.roundRect) ctx.roundRect(-s*1.35,-s*1.05,s*2.7,s*2.15,s*0.25); else ctx.rect(-s*1.35,-s*1.05,s*2.7,s*2.15);
  ctx.fill();
  ctx.strokeStyle=C(324,38,25,0.55); ctx.lineWidth=1.4*SC; ctx.stroke();
  ctx.beginPath(); ctx.moveTo(0,-s*1.05); ctx.lineTo(0,s*1.1); ctx.stroke();  // rear door split
  ctx.fillStyle=C(200,80,71,0.9);                                             // rear windows
  ctx.fillRect(-s*1.05,-s*0.75,s*0.75,s*0.55); ctx.fillRect(s*0.3,-s*0.75,s*0.75,s*0.55);
  ctx.fillStyle=C(37,83,81);                                                  // roof cone (tip down)
  ctx.beginPath(); ctx.moveTo(-s*0.3,-s*1.85); ctx.lineTo(s*0.3,-s*1.85); ctx.lineTo(0,-s*1.05); ctx.closePath(); ctx.fill();
  ctx.fillStyle=C(330,100,85);                                                // scoop on top
  ctx.beginPath(); ctx.arc(0,-s*1.95,s*0.34,0,TAU); ctx.fill();
  ctx.restore();
}

function drawHUD(surfing,starred){
  ctx.textAlign='center'; ctx.textBaseline='top';
  // score
  const ps=1+scorePop*0.28;
  ctx.save();
  ctx.translate(CX, 18*SC+SAFE_T);
  ctx.scale(ps,ps);
  ctx.font=`900 ${Math.round(58*SC)}px system-ui,sans-serif`;
  ctx.shadowColor=`hsl(${hue},100%,55%)`; ctx.shadowBlur=18*SC;
  ctx.fillStyle='#fff';
  ctx.fillText(state==='title'? '' : String(score), 0, 0);
  ctx.shadowBlur=0;
  ctx.restore();
  // combo
  if(state==='play' && combo>=2){
    ctx.font=`800 ${Math.round(21*SC)}px system-ui,sans-serif`;
    ctx.fillStyle=`hsl(${(hue+120)%360},100%,70%)`;
    ctx.fillText('COMBO ×'+combo, CX, 84*SC+SAFE_T);
  }
  // one consolidated stat line: distance · best · glowbugs
  if(state==='play'){
    ctx.textBaseline='middle';
    ctx.font=`700 ${Math.round(14*SC)}px system-ui,sans-serif`;
    const ly=116*SC+SAFE_T, sep='   ';
    const s1='DIST '+Math.floor(dist), s2='BEST '+best, s3=String(bugs);
    const dotW=13*SC;
    let x=CX-(ctx.measureText(s1+sep+s2+sep).width+dotW+ctx.measureText(s3).width)/2;
    ctx.textAlign='left';
    ctx.fillStyle='rgba(255,255,255,0.55)';
    ctx.fillText(s1,x,ly); x+=ctx.measureText(s1+sep).width;
    ctx.fillText(s2,x,ly); x+=ctx.measureText(s2+sep).width;
    ctx.fillStyle='hsl(95,100%,72%)';
    ctx.shadowColor='hsl(95,100%,60%)'; ctx.shadowBlur=8*SC;
    ctx.beginPath(); ctx.arc(x+4.5*SC,ly,4.5*SC,0,TAU); ctx.fill();
    ctx.shadowBlur=0; x+=dotW;
    ctx.fillStyle='rgba(255,255,255,0.75)';
    ctx.fillText(s3,x,ly);
    ctx.textBaseline='top';
  }
  // mult badge — in flight only: on the crash screen the corner belongs to
  // the NEST button, and a multiplier you can no longer spend is just noise.
  // The protection chip owns the same corner, so the badge drops below it
  // rather than printing over it
  if(mult>1 && state==='play'){
    const chip = harnessLeft>0 || (stock.harness|0)>0;
    ctx.textAlign='right';
    ctx.font=`900 ${Math.round(26*SC)}px system-ui,sans-serif`;
    ctx.fillStyle=`hsl(320,100%,${60+Math.sin(t*10)*12}%)`;
    ctx.fillText('×'+mult, W-16*SC, (chip? 20+44*uiS() : 16*SC)+SAFE_T);
  }
  // level progress lives at the very bottom with the other status bars
  if(state==='play' && levelQ){
    const bw2=190*SC, by2=H-12-SAFE_B;
    ctx.fillStyle='rgba(255,255,255,0.18)'; ctx.fillRect(CX-bw2/2,by2,bw2,6);
    ctx.fillStyle=`hsl(${hue},100%,65%)`; ctx.fillRect(CX-bw2/2,by2,bw2*clamp(dist/levelQ.len,0,1),6);
    for(let ci=0;ci<2;ci++) for(let cj=0;cj<2;cj++){
      ctx.fillStyle=(ci+cj)%2?'#15152a':'#fff';
      ctx.fillRect(CX+bw2/2+2+ci*3, by2+cj*3, 3, 3);
    }
    if(levelQ.traits.length){
      ctx.save();
      ctx.font=`800 ${Math.round(10*SC)}px system-ui,sans-serif`;
      ctx.fillStyle='rgba(255,255,255,0.5)'; ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.fillText(levelQ.traits.map(tr=>ZTRAITS[tr].name).join(' · '), CX, by2-8);
      ctx.restore(); ctx.textBaseline='top'; ctx.textAlign='center';
    }
  }
  // power timers
  let ty=H-26*SC-SAFE_B-(state==='play'&&levelQ?18:0);
  const barW=170*SC;
  if(surfing){
    ctx.fillStyle='rgba(200,230,255,0.25)'; ctx.fillRect(CX-barW/2,ty,barW,8*SC);
    ctx.fillStyle='#cfeaff'; ctx.fillRect(CX-barW/2,ty,barW*(surfT/surfMax),8*SC);
    if(surfStack>1){
      ctx.textAlign='center';
      ctx.font=`900 ${Math.round(16*SC)}px system-ui,sans-serif`;
      ctx.fillStyle=`hsl(210,100%,${75+Math.sin(t*12)*15}%)`;
      ctx.fillText('SURF ×'+surfStack, CX, ty-18*SC);
    }
    ty-=14*SC;
  }
  if(starred){
    ctx.fillStyle='rgba(255,240,150,0.25)'; ctx.fillRect(CX-barW/2,ty,barW,8*SC);
    ctx.fillStyle=`hsl(${(t*400)%360},100%,65%)`; ctx.fillRect(CX-barW/2,ty,barW*(starT/starMax),8*SC);
    ty-=14*SC;
  }
  if(mult>1){
    ctx.fillStyle='rgba(255,120,220,0.25)'; ctx.fillRect(CX-barW/2,ty,barW,8*SC);
    ctx.fillStyle='hsl(320,100%,62%)'; ctx.fillRect(CX-barW/2,ty,barW*(multT/8),8*SC);
    ty-=14*SC;
  }
  if(viewT>0){
    ctx.fillStyle='rgba(255,120,255,0.25)'; ctx.fillRect(CX-barW/2,ty,barW,8*SC);
    ctx.fillStyle='hsl(300,100%,65%)'; ctx.fillRect(CX-barW/2,ty,barW*(viewT/10),8*SC);
  }
  // protection chip (top-right): hexagon + total hits you can still
  // absorb, styled like the in-flight mute button so the corners match.
  // Hex is orange while a per-run harness charge backs you, gold once
  // you're running on crash-pad stock alone
  if(state==='play' && (harnessLeft>0 || (stock.harness|0)>0)){
    const S=44*uiS();
    const total=harnessLeft+(stock.harness|0);
    ctx.font=`800 ${Math.round(S*0.34)}px system-ui,sans-serif`;
    const tw=ctx.measureText('×'+total).width;
    const pw=S*0.58+tw+S*0.24, px=W-10-pw, py=10+SAFE_T;
    ctx.globalAlpha=0.75;
    ctx.fillStyle='rgba(255,255,255,0.08)';
    ctx.strokeStyle='hsla(30,100%,65%,0.8)'; ctx.lineWidth=Math.max(1.5,S*0.035);
    ctx.beginPath();
    if(ctx.roundRect) ctx.roundRect(px,py,pw,S,S*0.28); else ctx.rect(px,py,pw,S);
    ctx.fill(); ctx.stroke();
    const hx=px+S*0.34, hy=py+S/2, hr=S*0.2;
    ctx.strokeStyle= harnessLeft>0?'hsl(30,100%,65%)':'hsl(48,90%,68%)';
    ctx.lineWidth=S*0.06; ctx.lineJoin='round';
    ctx.beginPath();
    for(let i=0;i<6;i++){ const a=-Math.PI/2+i*TAU/6; ctx[i?'lineTo':'moveTo'](hx+Math.cos(a)*hr, hy+Math.sin(a)*hr); }
    ctx.closePath(); ctx.stroke();
    ctx.fillStyle='#fff'; ctx.textAlign='left'; ctx.textBaseline='middle';
    ctx.fillText('×'+total, px+S*0.58, py+S/2+0.5);
    ctx.globalAlpha=1;
    ctx.textAlign='center';
  }
  // slo-mo pedal
  if(state==='play' && (tier('pedal')>0||DBG.surfer)){
    const pcx=W-66, pcy=H-66-SAFE_B, pr=44;
    const active=pedalOn&&!pedalLock&&pedalT>0;
    ctx.fillStyle=active?'rgba(120,210,255,0.3)':'rgba(255,255,255,0.08)';
    ctx.beginPath(); ctx.arc(pcx,pcy,pr,0,TAU); ctx.fill();
    ctx.strokeStyle='rgba(140,220,255,0.4)'; ctx.lineWidth=3;
    ctx.beginPath(); ctx.arc(pcx,pcy,pr,0,TAU); ctx.stroke();
    ctx.strokeStyle= pedalLock?'hsl(25,100%,58%)':'hsl(195,100%,65%)'; ctx.lineWidth=4; ctx.lineCap='round';
    ctx.beginPath(); ctx.arc(pcx,pcy,pr,-Math.PI/2,-Math.PI/2+TAU*(pedalMax()?pedalT/pedalMax():0)); ctx.stroke();
    ctx.fillStyle=`rgba(255,255,255,${active?1:0.6})`;
    ctx.font='800 13px system-ui,sans-serif';
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText('SLO-MO',pcx,pcy);
  }
  // ?debug=poweroverwhelming needs a visible exit — home-screen apps can't
  // edit the URL, so god mode carries its own off switch
  if(DBG.power && state==='play'){
    const US=uiS(), bw=132*US, bh=36*US;
    dbgPowerRect=pillBtn(14+bw/2, H-64*US-SAFE_B, bw, bh, 'END GOD MODE', (t*400)%360, false);
  } else dbgPowerRect=null;
  // mute toggle: styled corner button on menu screens, whisper-quiet
  // bare glyph during play so it never competes with the tunnel
  if(state==='title' || (state==='dead'&&deadT>0.25)){
    const S=58*uiS();
    muteRect=cornerBtn(12+S/2, 12+SAFE_T+S/2, S, muted?'MUTED':'SOUND', 190, false, soundIcon);
  } else {
    // in flight: same styling, icon-only and smaller, slightly faded so
    // it never competes with the tunnel — but still a real button
    const S=44*uiS();
    ctx.globalAlpha=0.75;
    muteRect=cornerBtn(10+S/2, 10+SAFE_T+S/2, S, '', 190, false, soundIcon);
    ctx.globalAlpha=1;
  }
}

// first-flight primer: three little illustrated cards riding over the run —
// tap to flap, avoid obstacles, grab power-ups
function drawHintCards(){
  const a=clamp(Math.min(hintT*1.5,(8-hintT)*2),0,1);
  if(a<=0) return;
  const US=uiS(), cw=104*US, ch=98*US, gp=10*US;
  const y0=H-158*US;
  ctx.save(); ctx.globalAlpha=a;
  ctx.textAlign='center'; ctx.textBaseline='middle';
  const labels=[['TAP','TO FLAP'],['AVOID','OBSTACLES'],['GRAB','POWER-UPS']];
  for(let i=0;i<3;i++){
    const bx=CX+(i-1)*(cw+gp), bob=Math.sin(t*2.2+i*1.8)*3*US;
    ctx.save(); ctx.translate(bx,y0+bob);
    ctx.fillStyle='rgba(5,1,15,0.78)';
    ctx.strokeStyle=`hsla(${(hue+i*70)%360},100%,65%,0.85)`; ctx.lineWidth=2;
    ctx.beginPath();
    if(ctx.roundRect) ctx.roundRect(-cw/2,-ch/2,cw,ch,12*US); else ctx.rect(-cw/2,-ch/2,cw,ch);
    ctx.fill(); ctx.stroke();
    const iy=-ch*0.16;
    if(i===0){
      // fingertip with a tap ripple, and the bird hopping on each beat
      const ph=(t*1.6)%1;
      ctx.strokeStyle=`hsla(0,0%,100%,${0.8*(1-ph)})`; ctx.lineWidth=2;
      ctx.beginPath(); ctx.arc(-cw*0.2,iy+ch*0.10,(5+ph*13)*US,0,TAU); ctx.stroke();
      ctx.fillStyle='#fff';
      ctx.beginPath(); ctx.arc(-cw*0.2,iy+ch*0.10,4.5*US,0,TAU); ctx.fill();
      ctx.save();
      ctx.translate(cw*0.17, iy+ch*0.12-Math.abs(Math.sin(t*5))*9*US);
      drawModel(skin, 6.5*US, null, 45, 100, 58, 0.3+Math.sin(t*9)*0.3);
      ctx.restore();
    } else if(i===1){
      // a gate disc with its hole, and a little asteroid to the side
      ctx.fillStyle='hsla(20,90%,55%,0.9)';
      ctx.beginPath();
      ctx.arc(-cw*0.06,iy+ch*0.06,15*US,0,TAU);
      ctx.arc(-cw*0.06+6*US,iy+ch*0.06,6*US,0,TAU,true);
      ctx.fill('evenodd');
      ctx.fillStyle='hsl(260,15%,45%)';
      ctx.save(); ctx.translate(cw*0.26,iy+ch*0.02); ctx.rotate(t*1.5);
      ctx.beginPath();
      for(let k2=0;k2<7;k2++){ const aa=k2/7*TAU, rr=(5+(k2%2)*2)*US; ctx[k2?'lineTo':'moveTo'](Math.cos(aa)*rr,Math.sin(aa)*rr); }
      ctx.closePath(); ctx.fill(); ctx.restore();
    } else {
      // gold star + silver surfboard, the loot worth grabbing
      ctx.save(); ctx.translate(-cw*0.02,iy+ch*0.04); ctx.rotate(Math.sin(t*2)*0.2);
      ctx.fillStyle='hsl(50,100%,60%)';
      ctx.shadowColor='hsl(50,100%,55%)'; ctx.shadowBlur=8*US;
      ctx.beginPath();
      for(let k2=0;k2<10;k2++){ const aa=-Math.PI/2+k2/10*TAU, rr=(k2%2?5:11)*US; ctx[k2?'lineTo':'moveTo'](Math.cos(aa)*rr,Math.sin(aa)*rr); }
      ctx.closePath(); ctx.fill(); ctx.shadowBlur=0; ctx.restore();
      ctx.fillStyle='#dfe9f5';
      ctx.beginPath(); ctx.ellipse(cw*0.02,iy+ch*0.20,14*US,4*US,-0.12,0,TAU); ctx.fill();
    }
    ctx.fillStyle='#fff';
    ctx.font=`900 ${Math.round(11.5*US)}px system-ui,sans-serif`;
    ctx.fillText(labels[i][0],0,ch*0.20);
    ctx.font=`700 ${Math.round(9.5*US)}px system-ui,sans-serif`;
    ctx.fillStyle='rgba(255,255,255,0.75)';
    ctx.fillText(labels[i][1],0,ch*0.34);
    ctx.restore();
  }
  ctx.restore();
}

// TR nest + BL share, the fixed utility corners shared by both screens
function drawCorners(){
  const US=uiS(), S=58*US;
  nestRect=cornerBtn(W-12-S/2, 12+SAFE_T+S/2, S, 'NEST', (hue+120)%360, nestAlert(), nestIcon, String(bugs));

function nestAlert(){
  if(!giftClaimed) return true;
  if(chalDone && !chalClaimed) return true;
  for(const k in UPG){ const u=UPG[k], tr=tier(k); if(tr<u.tiers && bugs>=u.cost[tr]) return true; }
  for(const sk of SKINS) if(!ownsSkin(sk.id) && bugs>=sk.cost) return true;
  return false;
}
// soft white wash over a rect while the finger rests on it — the pressed
// state for buttons whose art is drawn inline rather than via a helper
function pressGlow(r,rad){
  if(!pressedIn(r)) return;
  ctx.save(); ctx.fillStyle='rgba(255,255,255,0.15)';
  ctx.beginPath();
  if(ctx.roundRect&&rad) ctx.roundRect(r[0],r[1],r[2],r[3],rad); else ctx.rect(r[0],r[1],r[2],r[3]);
  ctx.fill(); ctx.restore();
}
function pillBtn(cx,cy,bw,bh,label,h2,alert){
  // typography and trim scale with the pill itself, so callers size
  // buttons for thumbs and the label follows
  ctx.save(); ctx.translate(cx,cy);
  const prs=pressedIn([cx-bw/2,cy-bh/2,bw,bh]);
  if(prs) ctx.scale(0.93,0.93);
  ctx.fillStyle=prs?'rgba(255,255,255,0.22)':'rgba(255,255,255,0.10)';
  ctx.strokeStyle=`hsl(${h2},100%,65%)`; ctx.lineWidth=Math.max(2,bh*0.05);
  ctx.beginPath();
  if(ctx.roundRect) ctx.roundRect(-bw/2,-bh/2,bw,bh,bh/2); else ctx.rect(-bw/2,-bh/2,bw,bh);
  ctx.fill(); ctx.stroke();
  ctx.fillStyle='#fff'; ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.font=`800 ${Math.round(bh*0.38)}px system-ui,sans-serif`;
  ctx.fillText(label,0,0);
  if(alert){
    // something's waiting inside: pulsing gold dot on the pill's corner
    ctx.fillStyle=`hsl(48,100%,${58+Math.sin(t*6)*14}%)`;
    ctx.shadowColor='hsl(48,100%,55%)'; ctx.shadowBlur=bh*0.25;
    ctx.beginPath(); ctx.arc(bw/2-bh*0.14,-bh/2+bh*0.1,bh*0.15,0,TAU); ctx.fill();
    ctx.shadowBlur=0;
  }
  ctx.restore();
  return [cx-bw/2,cy-bh/2,bw,bh];
}

// corner utility button: rounded square, vector icon on top, tiny label
function cornerBtn(cx,cy,S,label,h2,alert,icon,badge){
  ctx.save(); ctx.translate(cx,cy);
  const prs=pressedIn([cx-S/2,cy-S/2,S,S]);
  if(prs) ctx.scale(0.92,0.92);
  ctx.fillStyle=prs?'rgba(255,255,255,0.20)':'rgba(255,255,255,0.08)';
  ctx.strokeStyle=`hsla(${h2},100%,65%,0.8)`; ctx.lineWidth=Math.max(1.5,S*0.035);
  ctx.beginPath();
  if(ctx.roundRect) ctx.roundRect(-S/2,-S/2,S,S,S*0.28); else ctx.rect(-S/2,-S/2,S,S);
  ctx.fill(); ctx.stroke();
  if(label){
    icon(S);
    ctx.fillStyle='rgba(255,255,255,0.9)';
    ctx.font=`800 ${Math.round(S*0.17)}px system-ui,sans-serif`;
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText(label,0,S*0.30);
  } else {
    // icon-only variant: recenter the glyph (icons sit high to leave
    // room for a label that isn't there)
    ctx.save(); ctx.translate(0,S*0.14); icon(S); ctx.restore();
  }
  if(badge!=null){
    // corner-riding pill with a number in it (the glowbug balance):
    // gold + pulsing when there's something affordable, quiet green else
    ctx.font=`800 ${Math.round(S*0.2)}px system-ui,sans-serif`;
    const tw=ctx.measureText(badge).width;
    const pw=Math.max(S*0.38, tw+S*0.2), ph=S*0.3;
    const pcx=S*0.58-pw/2, pcy=-S*0.47;
    ctx.beginPath();
    if(ctx.roundRect) ctx.roundRect(pcx-pw/2-S*0.03, pcy-ph/2-S*0.03, pw+S*0.06, ph+S*0.06, (ph+S*0.06)/2); else ctx.rect(pcx-pw/2-S*0.03, pcy-ph/2-S*0.03, pw+S*0.06, ph+S*0.06);
    ctx.fillStyle='rgba(5,1,15,0.95)'; ctx.fill();
    ctx.beginPath();
    if(ctx.roundRect) ctx.roundRect(pcx-pw/2, pcy-ph/2, pw, ph, ph/2); else ctx.rect(pcx-pw/2, pcy-ph/2, pw, ph);
    if(alert){
      ctx.fillStyle=`hsl(48,100%,${58+Math.sin(t*6)*12}%)`;
      ctx.shadowColor='hsl(48,100%,55%)'; ctx.shadowBlur=S*0.18;
      ctx.fill(); ctx.shadowBlur=0;
      ctx.fillStyle='#221';
    } else {
      ctx.fillStyle='rgba(10,4,25,0.95)'; ctx.fill();
      ctx.strokeStyle='hsl(95,90%,55%)'; ctx.lineWidth=Math.max(1.2,S*0.025); ctx.stroke();
      ctx.fillStyle='hsl(95,100%,72%)';
    }
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText(badge, pcx, pcy+S*0.01);
  } else if(alert){
    // notification badge riding ON the corner, iOS style, with a dark
    // rim so it pops off the button border
    ctx.fillStyle='rgba(5,1,15,0.95)';
    ctx.beginPath(); ctx.arc(S*0.46,-S*0.46,S*0.16,0,TAU); ctx.fill();
    ctx.fillStyle=`hsl(48,100%,${58+Math.sin(t*6)*14}%)`;
    ctx.shadowColor='hsl(48,100%,55%)'; ctx.shadowBlur=S*0.2;
    ctx.beginPath(); ctx.arc(S*0.46,-S*0.46,S*0.12,0,TAU); ctx.fill();
    ctx.shadowBlur=0;
  }
  ctx.restore();
  return [cx-S/2,cy-S/2,S,S];
}
function nestIcon(S){
  // eggs peeking out of a twiggy bowl
  ctx.fillStyle='#fff';
  ctx.beginPath(); ctx.ellipse(-S*0.07,-S*0.16,S*0.048,S*0.06,-0.15,0,TAU); ctx.fill();
  ctx.beginPath(); ctx.ellipse(S*0.06,-S*0.17,S*0.048,S*0.06,0.15,0,TAU); ctx.fill();
  ctx.strokeStyle='hsl(35,90%,65%)'; ctx.lineWidth=S*0.055; ctx.lineCap='round';

    if(x<rx||x>rx+rw||yy<ry||yy>ry+rh) continue;

          const u=new URL(location.href);

            // deep refresh: clear caches, update the worker, reload fresh
            doUpdate();

          const dbg=SKIN_DEBUG[sk.id];
          if(dbg && confirm('DEBUG · '+dbg[0]+'\n'+dbg[1]+' — apply and reload?')){
            const cur=(u.searchParams.get('debug')||'').split(',').filter(Boolean);

            u.searchParams.set('debug', cur.join(','));
            u.searchParams.set('reload', Math.random().toString(36).slice(2,10));
            location.replace(u.href);

      }
      if(ownsSkin(sk.id)){ skin=sk.id; save(); sfx.gem(); }
      else if(bugs>=sk.cost){ bugs-=sk.cost; up['skin_'+sk.id]=1; skin=sk.id; save(); sfx.power(); shopSay(sk.name+' UNLOCKED!'); }
      else { beep(180,120,0.18,'square',0.2); shopSay('need '+sk.cost+' bugs'); }
      return;
    }
    if(s2.a==='track'){
      if(s2.id==='wacky' && streakN>=7){
        streakN=0;
        if(confirm('DEBUG · off\nswitch OFF all debug modes (invincibility, stacking surf) and reload?')){
          try{
            const u=new URL(location.href);
            u.searchParams.delete('debug');
            u.searchParams.delete('reload');
            location.replace(u.href);
          }catch(e){ location.reload(); }
        }
        return;
      }
      track=s2.id; noteI=0; save(); sfx.gem();
      shopSay(TRACKS.find(q=>q.id===s2.id).name+' SELECTED');
      return;
    }
    if(s2.a==='gift'){
      if(!giftClaimed){
        giftClaimed=true; bugs+=GIFT_AMT;
        try{ localStorage.setItem('fb_gift',TODAY); }catch(e){}
        save(); sfx.power(); shopSay('+'+GIFT_AMT+' bugs — enjoy!');
      } else shopSay('come back tomorrow');
      return;
    }
    if(s2.a==='chal'){
      if(chalDone && !chalClaimed){
        chalClaimed=true; bugs+=CHAL.reward;
        try{ localStorage.setItem('fb_chalc',TODAY); }catch(e){}
        save(); sfx.power(); shopSay('+'+CHAL.reward+' bugs — nice flying!');
      }
      return;
    }
    if(s2.a==='supply'){
      const sp=SUPPLIES.find(q=>q.id===s2.id);
      if((stock[sp.id]|0)+sp.pack>sp.cap){ shopSay(sp.cap+' is plenty'); return; }
      if(bugs>=sp.cost){ bugs-=sp.cost; stock[sp.id]=(stock[sp.id]|0)+sp.pack; save(); sfx.power(); shopSay(sp.name+' ×'+stock[sp.id]); }
      else { beep(180,120,0.18,'square',0.2); shopSay('need '+sp.cost+' bugs'); }
      return;
    }
  }
}

function drawDead(){
  ctx.fillStyle=`rgba(5,1,15,${clamp(deadT*2,0,0.36)})`;
  fillFrame();
  // pulsing impact marker where the bird hit
  const [ix,iy]=proj(0,crashY,BZ);
  ctx.strokeStyle=`hsla(0,100%,62%,${0.45+Math.sin(t*6)*0.3})`;
  ctx.lineWidth=3*SC;
  ctx.beginPath(); ctx.arc(ix,iy,(17+Math.sin(t*6)*4)*SC,0,TAU); ctx.stroke();
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.font=`900 ${Math.round(46*SC)}px system-ui,sans-serif`;
  ctx.shadowColor='hsl(0,100%,50%)'; ctx.shadowBlur=24*SC;
  ctx.fillStyle='#fff';
  ctx.fillText('CRASHED', CX, CY-158*SC);
  ctx.shadowBlur=0;
  ctx.font=`900 ${Math.round(36*SC)}px system-ui,sans-serif`;
  ctx.fillStyle=`hsl(${hue},100%,70%)`;
  ctx.fillText(String(score), CX, CY-112*SC);
  ctx.font=`700 ${Math.round(17*SC)}px system-ui,sans-serif`;
  ctx.fillStyle='rgba(255,255,255,0.7)';
  ctx.fillText(score>=best&&score>0 ? '★ NEW BEST ★' : 'BEST '+best, CX, CY-78*SC);
  ctx.font=`700 ${Math.round(14*SC)}px system-ui,sans-serif`;
  ctx.fillStyle='rgba(255,255,255,0.5)';
  ctx.fillText('DIST '+Math.floor(dist), CX, CY-52*SC);
  // swipe-to-swoop primer: an animated finger dragging down — shown only
  // when THIS crash had its safe opening below the bird (a swoop would
  // have saved it), and only until the move has been used a few times
  if(crashSwoop && diveUses<3 && !shareShot){
    const US=uiS(), hw=Math.min(258*US,W-24), hh=58*US;
    ctx.save();
    ctx.globalAlpha=clamp(deadT*2,0,1);
    ctx.translate(CX,CY+2*SC);
    ctx.fillStyle='rgba(5,1,15,0.80)';
    ctx.strokeStyle='hsla(195,100%,65%,0.9)'; ctx.lineWidth=2;
    ctx.beginPath();
    if(ctx.roundRect) ctx.roundRect(-hw/2,-hh/2,hw,hh,hh/2); else ctx.rect(-hw/2,-hh/2,hw,hh);
    ctx.fill(); ctx.stroke();
    // the finger drags whichever way the swoop goes in this zone
    const dv=diveDir();
    const ph=(t*1.1)%1, fx=-hw/2+hh*0.62, fy=(-0.26+ph*0.5)*hh*dv;
    ctx.strokeStyle='rgba(140,220,255,0.55)'; ctx.lineWidth=4*US; ctx.lineCap='round';
    ctx.beginPath(); ctx.moveTo(fx,-hh*0.26*dv); ctx.lineTo(fx,fy); ctx.stroke();
    ctx.fillStyle='#fff';
    ctx.beginPath(); ctx.arc(fx,fy,5.5*US,0,TAU); ctx.fill();
    ctx.strokeStyle='hsl(195,100%,70%)'; ctx.lineWidth=2.5*US; ctx.lineJoin='round';
    ctx.beginPath(); ctx.moveTo(fx-5*US,hh*0.16*dv); ctx.lineTo(fx,hh*0.30*dv); ctx.lineTo(fx+5*US,hh*0.16*dv); ctx.stroke();
    ctx.textAlign='left';
    ctx.fillStyle='#fff';
    ctx.font=`900 ${Math.round(15*US)}px system-ui,sans-serif`;
    ctx.fillText(dv>0?'SWIPE DOWN':'SWIPE UP', fx+hh*0.40, -hh*0.15);
    ctx.font=`700 ${Math.round(11*US)}px system-ui,sans-serif`;

    ctx.textAlign='center';
  }
  if(deadT>0.25 && !shareShot){
    const rise=canRise();

    if(rise){

      const pl=0.5+Math.sin(t*6)*0.5;

      rg.addColorStop(0,'hsl(8,100%,50%)');

      rg.addColorStop(1,'hsl(8,100%,50%)');
      ctx.shadowColor='hsl(25,100%,55%)'; ctx.shadowBlur=(16+pl*16)*US;

    if(levelQ){

    } else {

    }
    drawCorners();

    pressGlow(giftRect,14);
