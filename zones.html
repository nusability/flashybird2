}

// the daily gift as a real present on the crash screen: bobbing wrapped
// box with a bow while unclaimed; rattle → lid blast → glowbug fountain
// swirling into a count-up once tapped
// daily challenge strip: progress while pending, gold COLLECT badge once
// complete, glowbug fountain while collecting, quiet line once claimed
// the daily challenge lives on a full-width band pinned to the bottom
// edge: progress fill while pending, a gold COLLECT band once complete,
// a quiet line after claiming. The collect celebration flies above it.
function chalBandH(){
  const US=uiS();
  return (chalDone&&!chalClaimed) ? 46*US : chalClaimed ? 22*US : 32*US;
}
function drawChalBand(){
  chalRect=null;
  const US=uiS(), bh=chalBandH(), by=H-bh-SAFE_B, bhF=bh+SAFE_B;
  const fmt=n=> n>=10000 ? Math.round(n/1000)+'k' : String(n);
  ctx.textAlign='center'; ctx.textBaseline='middle';
  // celebration: reward bugs swirl to the band, count-up rides above it
  if(chalAnim>=0){
    const [gx,gy]=chalPos;
    for(const b of chalFly){
      if(chalAnim<b.d || b.done) continue;
      const wing=Math.sin((t+b.d*7)*42);
      ctx.save();
      ctx.translate(b.x,b.y);
      ctx.shadowColor='hsl(95,100%,60%)'; ctx.shadowBlur=10*SC;
      ctx.fillStyle='hsl(95,100%,70%)';
      ctx.beginPath(); ctx.arc(0,0,3.6*SC,0,TAU); ctx.fill();
      ctx.shadowBlur=0;
      ctx.fillStyle='rgba(255,255,255,0.75)';
      ctx.beginPath(); ctx.ellipse(-3.6*SC,-2.2*SC,4*SC,2*SC,-0.6-wing*0.35,0,TAU); ctx.fill();
      ctx.beginPath(); ctx.ellipse(3.6*SC,-2.2*SC,4*SC,2*SC,0.6+wing*0.35,0,TAU); ctx.fill();
      ctx.restore();
    }
    if(chalCount>0){
      const tEnd=0.1+CHAL.reward*0.07+1.5;
      const a=clamp((tEnd-chalAnim)/0.4,0,1);
      const sc2=1+0.5*Math.max(0,1-(chalAnim-chalPopT)*6);
      ctx.save();
      ctx.translate(gx,gy); ctx.scale(sc2,sc2);
      ctx.globalAlpha=a;
      ctx.font=`900 ${Math.round(26*US)}px system-ui,sans-serif`;
      ctx.shadowColor='hsl(95,100%,55%)'; ctx.shadowBlur=16*US;
      ctx.fillStyle='hsl(95,100%,72%)';
      ctx.fillText('+'+chalCount+(chalCount>=CHAL.reward?' BUGS!':''), 0, 0);
      ctx.restore();
      ctx.shadowBlur=0;
    }
  }
  if(chalDone && !chalClaimed && chalAnim<0){
    // COLLECT: the whole band is the button
    const pl=0.5+Math.sin(t*6)*0.5;
    chalRect=[0,by,W,bhF];
    const gr=ctx.createLinearGradient(0,by,W,by);
    gr.addColorStop(0,'hsl(48,100%,48%)');
    gr.addColorStop(0.5,'hsl(80,100%,52%)');
    gr.addColorStop(1,'hsl(48,100%,48%)');
    ctx.fillStyle=gr;
    ctx.fillRect(0,by,W,bhF);
    ctx.fillStyle=`rgba(255,255,255,${0.10+pl*0.12})`;
    ctx.fillRect(0,by,W,bhF);
    ctx.fillStyle='#221';
    ctx.font=`900 ${Math.round(15*US)}px system-ui,sans-serif`;
    ctx.fillText('DAILY CHALLENGE DONE — COLLECT +'+CHAL.reward+' BUGS', CX, by+bh/2);
    return;
  }
  // quiet band base
  ctx.fillStyle='rgba(5,1,15,0.72)';
  ctx.fillRect(0,by,W,bhF);
  if(chalClaimed){
    ctx.strokeStyle='rgba(255,255,255,0.1)'; ctx.lineWidth=1;
    ctx.beginPath(); ctx.moveTo(0,by+0.5); ctx.lineTo(W,by+0.5); ctx.stroke();
    ctx.font=`700 ${Math.round(9.5*US)}px system-ui,sans-serif`;
    ctx.fillStyle='hsla(95,80%,70%,0.5)';
    ctx.fillText('DAILY CHALLENGE ✓  ·  +'+CHAL.reward+' collected', CX, by+bh/2);
    return;
  }
  // pending: the band itself is the progress bar
  const p=Math.min(chProg,CHAL.goal), frac=clamp(p/CHAL.goal,0,1);
  if(frac>0){
    ctx.fillStyle='hsla(95,100%,55%,0.20)';
    ctx.fillRect(0,by,W*frac,bhF);
    ctx.fillStyle='hsl(95,100%,60%)';
    ctx.fillRect(W*frac-1.5,by,3,bhF);
  }
  ctx.strokeStyle='rgba(255,255,255,0.12)'; ctx.lineWidth=1;
  ctx.beginPath(); ctx.moveTo(0,by+0.5); ctx.lineTo(W,by+0.5); ctx.stroke();
  ctx.font=`800 ${Math.round(9*US)}px system-ui,sans-serif`;
  ctx.fillStyle='hsl(48,100%,68%)';
  ctx.fillText('DAILY CHALLENGE  ·  +'+CHAL.reward+' bugs', CX, by+bh*0.30);
  ctx.font=`700 ${Math.round(11*US)}px system-ui,sans-serif`;
  ctx.fillStyle='rgba(255,255,255,0.85)';
  ctx.fillText(CHAL.txt+'   ·   '+fmt(p)+' / '+fmt(CHAL.goal), CX, by+bh*0.68);
}
function giftPos(){
  // bottom-right corner, tucked above the challenge band
  const GS=uiS();
  return [W-56*GS, H-chalBandH()-SAFE_B-52*GS, GS];
}
function drawGift(){
  giftRect=null;
  if(giftClaimed && giftAnim<0) return;
  const [gx,gy,GS]=giftPos();
  const idle = giftAnim<0;
  const open = giftAnim>=0.5;
  const pulse=0.5+Math.sin(t*4.5)*0.5;
  const bw=52*GS, bh=40*GS;
  // soft dark halo so the gift reads as UI on top of the frozen scene
  const halo=ctx.createRadialGradient(gx,gy,0,gx,gy,80*GS);
  halo.addColorStop(0,'rgba(5,1,15,0.65)');
  halo.addColorStop(1,'rgba(5,1,15,0)');
  ctx.fillStyle=halo;
  ctx.fillRect(gx-80*GS,gy-80*GS,160*GS,160*GS);
  // box body (+ lid while shut), shaking harder as the open approaches
  let sx=0, wob=Math.sin(t*2.6)*0.05, bob=Math.sin(t*2.2)*4*GS;
  if(!idle && !open){
    const k=giftAnim/0.5;
    sx=Math.sin(giftAnim*58)*k*6*GS; wob=Math.sin(giftAnim*47)*k*0.24; bob=0;
  }
  const bodyA = open ? Math.max(0,1-(giftAnim-0.5)/1.0) : 1;
  if(bodyA>0){
    ctx.save();
    ctx.translate(gx+sx, gy+bob);
    ctx.rotate(wob);
    ctx.globalAlpha=bodyA;
    ctx.shadowColor='hsl(48,100%,60%)'; ctx.shadowBlur=(16+pulse*16)*GS;
    const g2=ctx.createLinearGradient(-bw/2,0,bw/2,0);
    g2.addColorStop(0,'hsl(330,95%,50%)');
    g2.addColorStop(0.5,'hsl(295,95%,58%)');
    g2.addColorStop(1,'hsl(330,95%,50%)');
    ctx.fillStyle=g2;
    ctx.beginPath();
    if(ctx.roundRect) ctx.roundRect(-bw/2,-bh/2+7*GS,bw,bh,5*GS); else ctx.rect(-bw/2,-bh/2+7*GS,bw,bh);
    ctx.fill();
    ctx.shadowBlur=0;
    ctx.fillStyle='hsl(48,100%,62%)';
    ctx.fillRect(-4.5*GS,-bh/2+7*GS,9*GS,bh);
    if(!open){
      // lid + bow
      ctx.fillStyle='hsl(310,95%,46%)';
      ctx.beginPath();
      if(ctx.roundRect) ctx.roundRect(-bw/2-5*GS,-bh/2-3*GS,bw+10*GS,13*GS,4*GS); else ctx.rect(-bw/2-5*GS,-bh/2-3*GS,bw+10*GS,13*GS);
      ctx.fill();
      ctx.fillStyle='hsl(48,100%,62%)';
      ctx.beginPath(); ctx.ellipse(-8*GS,-bh/2-7*GS,7.5*GS,4.5*GS,-0.5,0,TAU); ctx.fill();
      ctx.beginPath(); ctx.ellipse(8*GS,-bh/2-7*GS,7.5*GS,4.5*GS,0.5,0,TAU); ctx.fill();
      ctx.beginPath(); ctx.arc(0,-bh/2-6*GS,3.2*GS,0,TAU); ctx.fill();
    }
    ctx.restore();
  }
  if(idle){
    // orbiting sparkle stars sell "tap me"
    for(let i=0;i<3;i++){
      const a=t*1.6+i*TAU/3;
      const px=gx+Math.cos(a)*46*GS, py=gy+bob*0.5+Math.sin(a)*34*GS;
      ctx.fillStyle=`hsla(48,100%,75%,${0.35+0.5*Math.sin(t*5+i*2.1)**2})`;
      starPath(px,py,3.5*GS,t*3+i); ctx.fill();
    }
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.font=`800 ${Math.round(11*GS)}px system-ui,sans-serif`;
    ctx.fillStyle='hsl(48,100%,70%)';
    ctx.shadowColor='hsl(48,100%,55%)'; ctx.shadowBlur=10*GS;
    ctx.fillText('DAILY GIFT', gx, gy-38*GS);
    ctx.shadowBlur=0;
    ctx.font=`700 ${Math.round(10*GS)}px system-ui,sans-serif`;
    ctx.fillStyle=`rgba(255,255,255,${0.55+pulse*0.4})`;
    ctx.fillText('TAP TO OPEN', gx, gy+36*GS);
    giftRect=[gx-44*GS, gy-48*GS, 88*GS, 94*GS];
    return;
  }
  // flying lid
  if(giftLid){
    ctx.save();
    ctx.translate(giftLid.x,giftLid.y); ctx.rotate(giftLid.rot);
    ctx.fillStyle='hsl(310,95%,46%)';
    ctx.fillRect(-(bw/2+5*GS),-6*GS,bw+10*GS,12*GS);
    ctx.fillStyle='hsl(48,100%,62%)';
    ctx.beginPath(); ctx.ellipse(-8*GS,-8*GS,7*GS,4*GS,-0.5,0,TAU); ctx.fill();
    ctx.beginPath(); ctx.ellipse(8*GS,-8*GS,7*GS,4*GS,0.5,0,TAU); ctx.fill();
    ctx.restore();
  }
  // flying glowbugs
  for(const b of giftFly){
    if(giftAnim-0.5<b.d || b.done) continue;
    const wing=Math.sin((t+b.d*7)*42);
    ctx.save();
    ctx.translate(b.x,b.y);
    ctx.shadowColor='hsl(95,100%,60%)'; ctx.shadowBlur=12*GS;
    ctx.fillStyle='hsl(95,100%,70%)';
    ctx.beginPath(); ctx.arc(0,0,4*GS,0,TAU); ctx.fill();
    ctx.shadowBlur=0;
    ctx.fillStyle='rgba(255,255,255,0.75)';
    ctx.beginPath(); ctx.ellipse(-4*GS,-2.5*GS,4.5*GS,2.2*GS,-0.6-wing*0.35,0,TAU); ctx.fill();
    ctx.beginPath(); ctx.ellipse(4*GS,-2.5*GS,4.5*GS,2.2*GS,0.6+wing*0.35,0,TAU); ctx.fill();
    ctx.restore();
  }
  // count-up where the box stood, popping on each arrival
  if(open && giftCount>0){
    const tEnd=0.5+GIFT_AMT*0.09+1.6;
    const a=clamp((tEnd-giftAnim)/0.45,0,1);
    const s=1+0.5*Math.max(0,1-(giftAnim-giftPopT)*6);
    ctx.save();
    ctx.translate(gx,gy); ctx.scale(s,s);
    ctx.globalAlpha=a;
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.font=`900 ${Math.round(30*GS)}px system-ui,sans-serif`;
    ctx.shadowColor='hsl(95,100%,55%)'; ctx.shadowBlur=18*GS;
    ctx.fillStyle='hsl(95,100%,72%)';
    ctx.fillText('+'+giftCount+(giftCount>=GIFT_AMT?' BUGS!':''), 0, 0);
    ctx.restore();
    ctx.shadowBlur=0;
  }
}

/* ---------- main loop: fixed 120Hz simulation timestep ----------
   physics advances in exact 1/120s quanta regardless of display refresh,
   so a 60Hz laptop and a 120Hz phone integrate the identical simulation */
let last=0, acc=0;
const STEP=1/120;
function loop(ms){
  requestAnimationFrame(loop);
  const now=ms/1000;
  let dt=now-last; last=now;
  if(dt<=0) return;
  if(dt>0.1) dt=0.1;
  acc+=dt;
  let n=0;
  while(acc>=STEP && n<24){ update(STEP); acc-=STEP; n++; }
  render();
}
requestAnimationFrame(loop);

/* update flow: probe the origin (cache-bypassed) for a newer build; offer a
   one-tap deep refresh that clears every cache and reloads. iOS standalone
   apps resume without navigating, so this runs on launch AND foreground. */
let updReady=null, updRect=null;
async function checkUpdate(){
  try{
    const r=await fetch('zones.html?v='+Math.random().toString(36).slice(2),{cache:'no-store'});
    if(!r.ok) return;
    const m=(await r.text()).match(/VERSION='([^']+)'/);
    if(m && m[1]!==VERSION) updReady=m[1];
  }catch(e){}
}
async function doUpdate(){
  // the reload IS the update: the cache purge and the service-worker check
  // are best-effort housekeeping in front of it. registration.update() can
  // hang forever (it never settles in Chromium here), and awaiting it flat
  // meant the button did nothing at all — so the housekeeping gets a budget
  // and the reload fires either way.
  const housekeeping=(async()=>{
    try{ const ks=await caches.keys(); await Promise.all(ks.map(k=>caches.delete(k))); }catch(e){}
    try{ const reg=await navigator.serviceWorker.getRegistration(); if(reg) await reg.update(); }catch(e){}
  })();
  await Promise.race([housekeeping, new Promise(r=>setTimeout(r,1500))]);
  try{
    const u=new URL(location.href);
    u.searchParams.set('reload',Math.random().toString(36).slice(2,10));
    location.replace(u.href);
  }catch(e){ location.reload(); }
}
checkUpdate();
document.addEventListener('visibilitychange',()=>{ if(!document.hidden) checkUpdate(); });
window.addEventListener('pageshow',()=>checkUpdate());
/* offline: the service worker caches the shell; network-first keeps it fresh */
if('serviceWorker' in navigator){ try{ navigator.serviceWorker.register('sw.js').catch(()=>{}); }catch(e){} }
/* zones app boots on the map */
try{ for(const k of Object.keys(localStorage)) if(k.startsWith('fb_pace_zone')) localStorage.removeItem(k); }catch(e){}
state='map'; mpSnapCur();
